<!doctype html>
<html lang="zh">

<head>
  <meta charset="utf-8" />
  <title>新高买卖决策台 · TIB SOP</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#faf9f5" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="决策台" />
  <!-- 不引任何外部 CDN：完全离线可用，字体走系统栈 -->
  <style>
    :root {
      --bg: #faf9f5;
      --bg-sidebar: #f4f2ea;
      --bg-elev: #ffffff;
      --ink: #1f1e1c;
      --ink-2: #4a4844;
      --ink-3: #8a857c;
      --line: #e7e3d8;
      --line-strong: #d8d2c2;
      --accent: #cc785c;
      --accent-ink: #b56247;
      --accent-soft: rgba(204, 120, 92, 0.10);
      --green: #4f7a52;
      --green-soft: rgba(79, 122, 82, 0.10);
      --red: #b0483b;
      --red-soft: rgba(176, 72, 59, 0.09);
      --stance: #5f7d95;
      --stance-soft: rgba(95, 125, 149, 0.12);
      --main-w: 100%;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: grid;
      grid-template-columns: 300px 1fr;
      height: 100vh;
      height: 100dvh;
    }

    body.dragging-col {
      cursor: col-resize;
      user-select: none;
    }

    body.dragging-col * {
      cursor: col-resize !important;
    }

    /* ========== Sidebar ========== */
    aside {
      background: var(--bg-sidebar);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .brand {
      padding: 22px 22px 18px;
      font-family: "Source Serif 4", Georgia, "Songti SC", serif;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--ink);
      display: flex;
      align-items: baseline;
      gap: 10px;
      border-bottom: 1px solid var(--line);
    }

    .brand .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex: 0 0 8px;
    }

    .brand .sub {
      margin-left: auto;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 11px;
      font-weight: 500;
      color: var(--ink-3);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .mode-nav {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0 24px;
    }

    .group-head {
      padding: 18px 22px 6px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    .mode-btn {
      margin: 3px 12px;
      padding: 11px 14px;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 11px;
      color: var(--ink-2);
      transition: background 0.12s, border-color 0.12s;
    }

    .mode-btn:hover {
      background: rgba(204, 120, 92, 0.06);
    }

    .mode-btn.on {
      background: var(--bg-elev);
      border-color: var(--line-strong);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
      color: var(--ink);
    }

    .mode-btn .m-icon {
      width: 26px;
      height: 26px;
      flex: 0 0 26px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      background: rgba(0, 0, 0, 0.04);
    }

    .mode-btn.on.buy .m-icon {
      background: var(--accent-soft);
    }

    .mode-btn.on.sell .m-icon {
      background: var(--green-soft);
    }

    .mode-btn.on.stance .m-icon {
      background: var(--stance-soft);
    }

    .mode-btn .m-txt {
      min-width: 0;
    }

    .mode-btn .m-label {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.25;
    }

    .mode-btn .m-desc {
      font-size: 11px;
      color: var(--ink-3);
      line-height: 1.3;
      margin-top: 1px;
    }

    .mode-btn.on .m-mark {
      margin-left: auto;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex: 0 0 6px;
      background: var(--accent);
    }

    .mode-btn.on.sell .m-mark {
      background: var(--green);
    }

    .mode-btn.on.stance .m-mark {
      background: var(--stance);
    }

    .side-foot {
      padding: 14px 20px 18px;
      border-top: 1px solid var(--line);
      font-size: 11px;
      color: var(--ink-3);
      line-height: 1.6;
    }

    .side-foot b {
      color: var(--ink-2);
      font-weight: 600;
    }

    /* ========== Main (可拖拽宽度) ========== */
    main {
      position: relative;
      overflow: hidden;
      background: var(--bg);
      min-width: 0;
    }

    .main-col {
      position: relative;
      height: 100vh;
      height: 100dvh;
      width: var(--main-w);
      max-width: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border-right: 1px solid var(--line);
    }

    /* 移动端 / 嵌入版顶栏（桌面独立版隐藏，靠 @media 或 .embedded 打开） */
    .mobile-topbar {
      display: none;
      flex-direction: column;
      gap: 9px;
      flex: 0 0 auto;
      padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
      border-bottom: 1px solid var(--line);
      background: var(--bg-sidebar);
    }

    .mtb-brand {
      font-family: "Source Serif 4", Georgia, "Songti SC", serif;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
    }

    .mtb-brand .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      flex: 0 0 7px;
    }

    .mtb-brand .mtb-sub {
      margin-left: auto;
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-3);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }

    .mtb-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .mtb-tabs::-webkit-scrollbar {
      display: none;
    }

    .mtb-chip {
      flex: 0 0 auto;
      padding: 8px 15px;
      border-radius: 20px;
      border: 1px solid var(--line-strong);
      background: var(--bg-elev);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-2);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    .mtb-chip.on.buy {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .mtb-chip.on.sell {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    .mtb-chip.on.stance {
      background: var(--stance);
      border-color: var(--stance);
      color: #fff;
    }

    .resize-handle {
      position: absolute;
      top: 0;
      bottom: 0;
      right: -4px;
      width: 9px;
      cursor: col-resize;
      z-index: 30;
      background: transparent;
      transition: background 0.15s;
    }

    .resize-handle:hover,
    .resize-handle.dragging {
      background: var(--accent-soft);
    }

    .resize-handle::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 3px;
      width: 2px;
      background: transparent;
      border-radius: 2px;
      transition: background 0.15s;
    }

    .resize-handle:hover::after,
    .resize-handle.dragging::after {
      background: var(--accent);
    }

    .resize-grip {
      position: absolute;
      right: -1px;
      top: 50%;
      transform: translateY(-50%);
      width: 5px;
      height: 46px;
      border-radius: 4px;
      z-index: 31;
      background: var(--line-strong);
      opacity: 0.55;
      pointer-events: none;
      transition: opacity 0.15s, background 0.15s;
    }

    .resize-handle:hover~.resize-grip,
    .main-col:hover .resize-grip {
      opacity: 0.9;
    }
    .resize-hint {
      position: absolute; right: 12px; top: 72px; z-index: 40;
      padding: 8px 11px; border-radius: 7px; background: var(--ink); color: #fff;
      font-size: 12px; line-height: 1.45; box-shadow: 0 8px 24px rgba(0,0,0,.16);
      opacity: 0; transform: translateX(8px); pointer-events: none;
      transition: opacity .2s, transform .2s;
    }
    .resize-hint.show { opacity: 1; transform: translateX(0); }

    .head {
      padding: 26px 40px 20px;
      border-bottom: 1px solid var(--line);
    }

    .head .kicker {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent-ink);
      margin-bottom: 8px;
    }

    .head h1 {
      font-family: "Source Serif 4", Georgia, "Songti SC", serif;
      font-size: 27px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0 0 8px;
      color: var(--ink);
    }

    .head .tagline {
      font-size: 14px;
      color: var(--ink-2);
      line-height: 1.5;
    }

    .core-banner {
      margin: 20px 40px 0;
      padding: 13px 18px;
      border-radius: 10px;
      background: var(--accent-soft);
      border: 1px solid rgba(204, 120, 92, 0.25);
      font-size: 13.5px;
      color: var(--ink);
      line-height: 1.55;
      display: flex;
      gap: 11px;
      align-items: flex-start;
    }

    .core-banner.sell {
      background: var(--green-soft);
      border-color: rgba(79, 122, 82, 0.25);
    }

    .core-banner .cb-icon {
      flex: 0 0 auto;
      font-size: 16px;
    }

    .core-banner b {
      font-weight: 600;
    }

    .body-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 8px 40px 28px;
    }

    .section {
      margin-top: 26px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .section-title .s-name {
      font-family: "Source Serif 4", Georgia, "Songti SC", serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--ink);
    }

    .section-title .s-rule {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 20px;
      letter-spacing: 0.02em;
    }

    .s-rule.all {
      background: var(--accent-soft);
      color: var(--accent-ink);
    }

    .s-rule.any {
      background: var(--green-soft);
      color: var(--green);
    }

    .section-title .s-prog {
      margin-left: auto;
      font-size: 12px;
      color: var(--ink-3);
      font-feature-settings: "tnum";
    }

    .item {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--bg-elev);
      margin-bottom: 9px;
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
      position: relative;
    }

    .item:hover {
      border-color: var(--line-strong);
    }

    .item.checked {
      border-color: rgba(204, 120, 92, 0.4);
      background: rgba(204, 120, 92, 0.035);
    }

    .item.redline {
      border-left: 3px solid var(--red);
    }

    .item.redline.checked {
      border-left-color: var(--red);
      background: var(--red-soft);
      border-color: rgba(176, 72, 59, 0.3);
    }

    .cbox {
      flex: 0 0 22px;
      width: 22px;
      height: 22px;
      margin-top: 1px;
      border-radius: 6px;
      border: 2px solid var(--line-strong);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s;
    }

    .item:hover .cbox {
      border-color: var(--accent);
    }

    .item.checked .cbox {
      background: var(--accent);
      border-color: var(--accent);
    }

    .item.redline.checked .cbox {
      background: var(--red);
      border-color: var(--red);
    }

    .cbox svg {
      width: 13px;
      height: 13px;
      opacity: 0;
      transform: scale(0.6);
      transition: all 0.12s;
    }

    .item.checked .cbox svg {
      opacity: 1;
      transform: scale(1);
    }

    .i-body {
      min-width: 0;
      flex: 1;
    }

    .i-label {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.4;
    }

    .i-label .rl-tag {
      font-size: 10px;
      font-weight: 700;
      color: var(--red);
      border: 1px solid rgba(176, 72, 59, 0.4);
      border-radius: 4px;
      padding: 0 5px;
      margin-left: 8px;
      vertical-align: 1px;
      letter-spacing: 0.03em;
    }

    .i-note {
      font-size: 12.5px;
      color: var(--ink-3);
      line-height: 1.5;
      margin-top: 4px;
    }

    .i-note em {
      color: var(--accent-ink);
      font-style: normal;
      font-weight: 500;
    }

    /* 提示卡（实盘提醒，非勾选项） */
    .tips {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tip {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      border: 1px solid rgba(176, 72, 59, 0.22);
      border-left: 3px solid var(--red);
      border-radius: 10px;
      background: var(--red-soft);
      padding: 12px 15px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--ink-2);
    }

    .tip .tip-icon {
      flex: 0 0 auto;
      font-size: 14px;
      line-height: 1.5;
    }

    .tip em {
      color: var(--red);
      font-style: normal;
      font-weight: 600;
    }

    /* ========== 每日定调：选择表单 ========== */
    .stance {
      padding-top: 6px;
    }

    .stance-q {
      margin-top: 22px;
    }

    .stance-q:first-child {
      margin-top: 8px;
    }

    .stance-q-title {
      font-family: "Source Serif 4", Georgia, "Songti SC", serif;
      font-size: 16px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 12px;
    }

    .stance-opts {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .stance-opt {
      display: flex;
      flex-direction: column;
      gap: 3px;
      align-items: flex-start;
      text-align: left;
      padding: 14px 15px;
      border: 1px solid var(--line-strong);
      border-radius: 11px;
      background: var(--bg-elev);
      cursor: pointer;
      font-family: inherit;
      color: var(--ink-2);
      transition: all 0.12s;
    }

    .stance-opt:hover {
      border-color: var(--stance);
    }

    .stance-opt .so-main {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--ink);
    }

    .stance-opt .so-sub {
      font-size: 11.5px;
      color: var(--ink-3);
      line-height: 1.3;
    }

    .stance-opt.on {
      border-color: var(--stance);
      background: var(--stance-soft);
      box-shadow: 0 0 0 1px var(--stance) inset;
    }

    .stance-opt.on .so-sub {
      color: var(--stance);
    }

    .stance-note {
      margin-top: 24px;
      padding: 13px 16px;
      border-radius: 10px;
      background: var(--stance-soft);
      border: 1px solid rgba(95, 125, 149, 0.25);
      font-size: 13px;
      line-height: 1.6;
      color: var(--ink-2);
    }

    .stance-note em {
      color: var(--stance);
      font-style: normal;
      font-weight: 600;
    }

    .stance-plan {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 11px;
      border: 1px solid var(--line-strong);
      background: var(--bg-elev);
      color: var(--ink);
      font-family: inherit;
      font-size: 13.5px;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      min-height: 76px;
    }

    .stance-plan:focus {
      border-color: var(--stance);
      box-shadow: 0 0 0 3px var(--stance-soft);
    }

    .sc-plan {
      display: inline-block;
      margin-top: 5px;
      font-weight: 400;
      color: var(--ink-2);
      font-size: 12.5px;
      line-height: 1.5;
    }

    /* ========== 今日定调条：在其它 tab 顶部动态显示当天参数 ========== */
    .stance-ctx {
      margin: 6px 0 4px;
      padding: 11px 15px;
      border-radius: 10px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 13px;
      line-height: 1.5;
      border: 1px solid var(--line-strong);
      background: var(--bg-elev);
      color: var(--ink-2);
      cursor: pointer;
    }

    .stance-ctx .sc-icon {
      flex: 0 0 auto;
      font-size: 15px;
    }

    .stance-ctx b {
      color: var(--ink);
      font-weight: 600;
    }

    .stance-ctx.none {
      border-style: dashed;
    }

    .stance-ctx.good {
      background: var(--green-soft);
      border-color: rgba(79, 122, 82, 0.3);
    }

    .stance-ctx.good b,
    .stance-ctx.good .sc-msg {
      color: var(--green);
    }

    .stance-ctx.warn {
      background: var(--red-soft);
      border-color: rgba(176, 72, 59, 0.32);
    }

    .stance-ctx.warn b,
    .stance-ctx.warn .sc-msg {
      color: var(--red);
    }

    .stance-ctx .sc-msg {
      font-weight: 600;
    }

    body.embedded .stance-ctx {
      margin: 6px 0;
    }

    /* ========== Action bar（正常流式，固定在列底部） ========== */
    .action-bar {
      flex: 0 0 auto;
      background: var(--bg);
      border-top: 1px solid var(--line);
      padding: 16px 40px;
      display: flex;
      align-items: center;
      gap: 20px;
      z-index: 10;
    }

    .prog-wrap {
      flex: 1;
      min-width: 0;
    }

    .prog-label {
      font-size: 12px;
      color: var(--ink-2);
      margin-bottom: 7px;
      display: flex;
      gap: 8px;
      align-items: baseline;
    }

    .prog-label b {
      font-family: "Source Serif 4", Georgia, "Songti SC", serif;
      font-size: 15px;
      color: var(--ink);
      font-feature-settings: "tnum";
    }

    .prog-label .hint {
      color: var(--ink-3);
      font-size: 11.5px;
    }

    .prog-track {
      height: 7px;
      border-radius: 7px;
      background: var(--line);
      overflow: hidden;
    }

    .prog-fill {
      height: 100%;
      border-radius: 7px;
      background: var(--accent);
      width: 0;
      transition: width 0.25s ease;
    }

    .action-bar.sell .prog-fill {
      background: var(--green);
    }

    .action-bar.stance .prog-fill {
      background: var(--stance);
    }

    .fire-btn {
      flex: 0 0 auto;
      padding: 14px 30px;
      border-radius: 10px;
      border: none;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: all 0.14s;
      background: var(--line-strong);
      color: var(--bg-elev);
      white-space: nowrap;
    }

    .fire-btn.locked {
      background: #cfc8b8;
      color: #fff;
      box-shadow: none;
    }

    .fire-btn.ready {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 14px rgba(204, 120, 92, 0.35);
    }

    .action-bar.sell .fire-btn.ready {
      background: var(--green);
      box-shadow: 0 4px 14px rgba(79, 122, 82, 0.32);
    }

    .action-bar.stance .fire-btn.ready {
      background: var(--stance);
      box-shadow: 0 4px 14px rgba(95, 125, 149, 0.32);
    }

    .fire-btn.ready:hover {
      transform: translateY(-1px);
    }

    .fire-btn:active {
      transform: translateY(1px);
    }

    /* ========== Modal ========== */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(31, 30, 28, 0.42);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      transition: opacity 0.16s;
    }

    .overlay.show {
      display: flex;
      opacity: 1;
    }

    .modal {
      width: 100%;
      max-width: 520px;
      background: var(--bg-elev);
      border: 1px solid var(--line-strong);
      border-radius: 16px;

      }

      20%,
      80% {
        transform: translateX(2px);
      }

      30%,
      50%,
      70% {

      60% {

      margin: 0;

      color: var(--ink);
      padding: 7px 0 7px 24px;

      border-bottom: 1px dashed var(--line);
      line-height: 1.45;

      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      border: 1px solid var(--line-strong);
      background: var(--bg-elev);
      color: var(--ink-2);
    }

      color: var(--accent-ink);
    }

      background: var(--ink);
      color: #fff;
      border-color: var(--ink);

    }

      display: block;
      height: auto;

    body.embedded .head {
      padding: 14px 16px 12px;

    }

    body.embedded .modal {
      border-radius: 16px;
      max-height: calc(var(--vis-height, 100dvh) - 28px);
    }
  </style>
</head>

    const ORDER = ["daily", "buy_new", "buy_add", "sell_tp", "sell_sl"];

    /* ============ 状态 ============ */
    let currentMode = "daily";
    const checks = {}; // modeKey -> { itemId: bool }
    for (const k of ORDER) checks[k] = {};

    /* ============ 收盘定调（跨 tab 共享的「收盘计划」：收盘后制定，次日开盘只执行） ============ */
    const STANCE_KEY = "sop-daily-stance";
    const CURVE_LABEL = { smooth: "曲线顺", chaos: "曲线震荡", drawdown: "回撤中" };
    // 阶梯仓位（Size Penalty Gate）：仓位跟资金曲线状态走
    const SIZE_CAP = { smooth: "正常仓位 · 不临时放大总敞口", chaos: "仓位减半 · 降低风险偏好", drawdown: "禁开新仓 · 仅允许最小试探仓" };
    const REGIME_LABEL = { on: "Risk-on", chaos: "Chaos", off: "Risk-off" };
    const LEAN_LABEL = { add: "扩张 · 盯买点", hold: "观望 · 少动", reduce: "收缩 · 盯卖点" };
    const LEAN_ROUTE = { add: "buy_new", hold: "buy_add", reduce: "sell_tp" };
    function todayStr() {
      const d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }
    function daysSince(dateStr) {
      const p = (dateStr || "").split("-").map(Number);
      if (p.length !== 3 || p.some(isNaN)) return 999;
      const now = new Date();
      return Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - new Date(p[0], p[1] - 1, p[2])) / 86400000);
    }
    let dailyStance = null;
    try { dailyStance = JSON.parse(localStorage.getItem(STANCE_KEY) || "null"); } catch (e) { dailyStance = null; }
    // 计划有效期：收盘定的计划管到下一个交易日（≤3 个自然日，兜住周末）
    function stanceHasAny() { const d = dailyStance ? daysSince(dailyStance.date) : 999; return d >= 0 && d <= 3; }
    function stanceIsToday() { return !!(stanceHasAny() && dailyStance.curve && dailyStance.regime && dailyStance.lean); }
    function saveStance() { try { localStorage.setItem(STANCE_KEY, JSON.stringify(dailyStance)); } catch (e) { } }
    function setStance(k, v) {
      if (!dailyStance || !stanceHasAny()) dailyStance = { date: todayStr(), curve: null, regime: null, lean: null, plan: "" };
      dailyStance[k] = v;
      dailyStance.date = todayStr();
      saveStance();
      if (k === "plan") { updateProgress(); return; }  // 文本输入不整页重渲染，避免丢焦点
      renderMode();
    }
    function escapeHTML(s) {
      return String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }

    /* ============ 渲染侧栏 ============ */
    function renderNav() {
      const nav = document.getElementById("modeNav");
      nav.innerHTML = "";
      let lastGroup = null;
      for (const key of ORDER) {
        const m = MODES[key];
        if (m.group !== lastGroup) {
          const gh = document.createElement("div");
          gh.className = "group-head";
          gh.textContent = m.group;
          nav.appendChild(gh);
          lastGroup = m.group;
        }
        const btn = document.createElement("div");
        btn.className = "mode-btn " + m.kind + (key === currentMode ? " on" : "");
        btn.onclick = () => switchMode(key);
        btn.innerHTML =
          '<div class="m-icon">' + m.icon + '</div>' +
          '<div class="m-txt"><div class="m-label">' + m.navLabel + '</div>' +
          '<div class="m-desc">' + m.navDesc + '</div></div>' +
          '<div class="m-mark"></div>';
        nav.appendChild(btn);

    /* ============ 渲染移动端 chip 切换 ============ */
    function renderMobileTabs() {
      const wrap = document.getElementById("mobileTabs");
      if (!wrap) return;
      wrap.innerHTML = "";
      for (const key of ORDER) {
        const m = MODES[key];
        const chip = document.createElement("div");
        chip.className = "mtb-chip " + m.kind + (key === currentMode ? " on" : "");

        chip.onclick = () => switchMode(key);
        wrap.appendChild(chip);

    /* ============ 渲染主区 ============ */
    function renderMode() {
      const m = MODES[currentMode];
      document.getElementById("kicker").textContent = m.kicker;
      document.getElementById("title").textContent = m.title;
      document.getElementById("tagline").innerHTML = m.tagline;

      const banner = document.getElementById("coreBanner");
      if (m.banner) {
        banner.style.display = "flex";
        banner.className = "core-banner " + m.kind;
        banner.innerHTML = '<span class="cb-icon">' + (m.kind === "sell" ? "⚖️" : "🧭") + '</span><div>' + m.banner + '</div>';
      } else {
        banner.style.display = "none";
      }

      const scroll = document.getElementById("bodyScroll");
      scroll.innerHTML = "";

      if (m.kind === "stance") {
        renderStance(scroll);
        appendTips(scroll, m);
        updateProgress();
        scroll.scrollTop = 0;
        reportHeight();
        return;
      }

      // 收盘计划条：把收盘定的参数动态带到本 tab 顶部（计划内绿 / 计划外红）
      scroll.appendChild(buildStanceCtx());

      for (const sec of m.sections) {
        const secEl = document.createElement("div");
        secEl.className = "section";

        secEl.innerHTML =
          '<div class="section-title">' +
          '<span class="s-name">' + sec.name + '</span>' +
          '<span class="s-rule ' + sec.rule + '">' + ruleLabel + '</span>' +
          '<span class="s-prog" data-sec="' + sec.name + '"></span>' +
          '</div>';
        for (const it of sec.items) {
          const row = document.createElement("div");
          const isChecked = !!checks[currentMode][it.id];
          row.className = "item" + (it.redline ? " redline" : "") + (isChecked ? " checked" : "");
          row.dataset.itemId = it.id;
          row.onclick = () => toggle(it.id);
          row.innerHTML =
            '<div class="cbox">' + CHECK_SVG + '</div>' +
            '<div class="i-body">' +
            '<div class="i-label">' + it.label + (it.redline ? '<span class="rl-tag">红线</span>' : '') + '</div>' +
            '<div class="i-note">' + it.note + '</div>' +
            '</div>';
          secEl.appendChild(row);
        }
        scroll.appendChild(secEl);
      }
      appendTips(scroll, m);
      updateProgress();
      scroll.scrollTop = 0;
      reportHeight();
    }

    /* ============ 收盘定调：表单 + 收盘计划条 ============ */
    // 提示卡（非勾选项，只是实盘提醒）—— 勾选模式与定调模式共用
    function appendTips(scroll, m) {
      if (!m.tips || !m.tips.length) return;
      const tipsEl = document.createElement("div");
      tipsEl.className = "tips";
      for (const t of m.tips) {
        const tip = document.createElement("div");
        tip.className = "tip";
        tip.innerHTML = '<span class="tip-icon">⚠️</span><div>' + t + '</div>';
        tipsEl.appendChild(tip);
      }
      scroll.appendChild(tipsEl);
    }
    function stanceOptHTML(k, v, main, sub, curVal) {
      return '<button class="stance-opt' + (curVal === v ? " on" : "") + '" data-k="' + k + '" data-v="' + v + '">' +
        '<span class="so-main">' + main + '</span><span class="so-sub">' + sub + '</span></button>';
    }
    function renderStance(scroll) {
      const cur = stanceHasAny() ? dailyStance : {};
      const wrap = document.createElement("div");
      wrap.className = "stance";
      wrap.innerHTML =
        '<div class="stance-q">' +
        '<div class="stance-q-title">① 最近的资金曲线？</div>' +
        '<div class="stance-opts">' +
        stanceOptHTML("curve", "smooth", "🟢 曲线顺", "连续盈利 · 禁加本金", cur.curve) +
        stanceOptHTML("curve", "chaos", "🟡 震荡", "有赚有亏 ·仓位减半", cur.curve) +
        stanceOptHTML("curve", "drawdown", "🔴 回撤中", "连损 · 禁开新仓", cur.curve) +
        '</div></div>' +
        '<div class="stance-q">' +
        '<div class="stance-q-title">② 明日预期情绪？</div>' +
        '<div class="stance-opts">' +
        stanceOptHTML("regime", "on", "🟢 Risk-on", "进攻窗口", cur.regime) +
        stanceOptHTML("regime", "chaos", "🟡 Chaos", "混沌 · 降场口", cur.regime) +
        stanceOptHTML("regime", "off", "🔴 Risk-off", "防守 · 只减不增", cur.regime) +
        '</div></div>' +
        '<div class="stance-q">' +
        '<div class="stance-q-title">③ 明日动作？</div>' +
        '<div class="stance-opts">' +
        stanceOptHTML("lean", "add", "扩张 · 盯买点", "按计划买 / 加", cur.lean) +
        stanceOptHTML("lean", "hold", "观望 · 少动", "只做预设的 T", cur.lean) +
        stanceOptHTML("lean", "reduce", "收缩 · 盯卖点", "止盈 / 止损", cur.lean) +
        '</div></div>' +
        '<div class="stance-q">' +
        '<div class="stance-q-title">④ 明日具体计划（选填，会显示在各 tab 顶部）</div>' +
        '<textarea class="stance-plan" id="stancePlan" rows="3" placeholder="例：XX 回踩 5 日线企稳则低多一笔；YY 到 XX 价位止盈半仓；其余不买。">' + escapeHTML(cur.plan || "") + '</textarea>' +
        '</div>' +
        '<div class="stance-note">开盘三不：<em>不临时起意开新仓</em>、盘中新机会<em>只进 Watchlist 今晚再审</em>、盘面与预期不符时<em>默认防守只卖不买</em>。开盘时，手只是执行昨晚计划的机器人；决策留给收盘后的这里。</div>';
      wrap.querySelectorAll(".stance-opt").forEach(el => {
        el.onclick = () => setStance(el.dataset.k, el.dataset.v);
      });
      const ta = wrap.querySelector("#stancePlan");
      ta.addEventListener("input", () => setStance("plan", ta.value));
      scroll.appendChild(wrap);
    }
    function buildStanceCtx() {
      const el = document.createElement("div");
      el.onclick = () => switchMode("daily");
      if (!stanceIsToday()) {
        el.className = "stance-ctx none";
        el.innerHTML = '<span class="sc-icon">📋</span><div>没有有效的<b>收盘计划</b> —— 收盘后先去「收盘定调」定好；开盘只执行、不决策。</div>';
        return el;
      }
      const s = dailyStance;
      const made = s.date === todayStr() ? "今日定" : s.date.slice(5).replace("-", "/") + " 收盘定";
      const m = MODES[currentMode];
      let cls = "", msg = "";
      if (m.kind === "buy") {
        if (s.lean === "add") { cls = "good"; msg = "计划内 · 扩张日盯买点执行"; }
        else if (s.lean === "reduce") { cls = "warn"; msg = "计划外！收盘定的是收缩只卖——盘中新机会只进 Watchlist，今晚再审"; }
        else { cls = "warn"; msg = "计划 = 观望少动：只做预设动作，非计划标的不开仓"; }
        msg += "｜敞口：" + SIZE_CAP[s.curve];
        if (s.curve === "drawdown") cls = "warn";  // 回撤期做任何买入动作都亮红
      } else {
        if (s.lean === "reduce") { cls = "good"; msg = "计划内 · 收缩日盯卖点执行"; }
        else { cls = ""; msg = "计划偏进攻——这笔卖出应是预设的止盈 / 失效条件触发"; }
      }
      const planLine = s.plan ? '<br><span class="sc-plan">📝 ' + escapeHTML(s.plan) + '</span>' : "";
      el.className = "stance-ctx " + cls;
      el.innerHTML = '<span class="sc-icon">📋</span><div>收盘计划（' + made + '）：<b>' + CURVE_LABEL[s.curve] + ' · ' + REGIME_LABEL[s.regime] + ' · ' + LEAN_LABEL[s.lean] + '</b>　<span class="sc-msg">' + msg + '</span>' + planLine + '</div>';
      return el;
    }

    function switchMode(key) {
      if (key === currentMode) return;
      currentMode = key;
      checks[key] = {}; // 每次切换清空重勾
      renderNav();
      renderMobileTabs();
      renderMode();
    }

    function toggle(itemId) {
      // 只更新被点的那一行 + 进度，不整表重渲染 —— 避免勾选后滚动位置跳回顶部
      const on = !checks[currentMode][itemId];
      checks[currentMode][itemId] = on;
      const row = document.querySelector('#bodyScroll .item[data-item-id="' + itemId + '"]');
      if (row) row.classList.toggle("checked", on);
      updateProgress();
    }

    /* ============ 进度 / 校验 ============ */
    function sectionSatisfied(sec) {
      const checkedCount = sec.items.filter(it => checks[currentMode][it.id]).length;
      if (sec.rule === "any") return checkedCount >= 1;
      return checkedCount === sec.items.length;
    }

    function allSatisfied() {
      return MODES[currentMode].sections.every(sectionSatisfied);
    }

    function updateProgress() {
      const m = MODES[currentMode];
      const bar = document.getElementById("actionBar");
      const btn = document.getElementById("fireBtn");
      const hint = document.getElementById("progHint");

      if (m.kind === "stance") {
        const set = stanceHasAny()
          ? (dailyStance.curve ? 1 : 0) + (dailyStance.regime ? 1 : 0) + (dailyStance.lean ? 1 : 0)
          : 0;
        document.getElementById("progFill").style.width = (set / 3 * 100) + "%";
        document.getElementById("progText").textContent = set + " / 3";
        hint.textContent = "已定调";
        bar.className = "action-bar stance";
        const ready = set === 3;
        btn.textContent = ready ? ("计划已定 · 去「" + MODES[LEAN_ROUTE[dailyStance.lean]].navLabel + "」预演 →") : "选完曲线 / 情绪 / 动作";
        btn.className = "fire-btn " + (ready ? "ready" : "locked");
        return;
      }
      hint.textContent = "条件已确认";
      for (const sec of m.sections) {
        const c = sec.items.filter(it => checks[currentMode][it.id]).length;
        const label = document.querySelector('.s-prog[data-sec="' + sec.name + '"]');
        if (label) label.textContent = c + " / " + sec.items.length + (sectionSatisfied(sec) ? " ✓" : "");
      }
      let done = 0, total = 0;
      for (const sec of m.sections) {
        if (sec.rule === "any") { total += 1; done += sectionSatisfied(sec) ? 1 : 0; }
        else { total += sec.items.length; done += sec.items.filter(it => checks[currentMode][it.id]).length; }
      }
      const pct = total ? Math.round((done / total) * 100) : 0;
      document.getElementById("progFill").style.width = pct + "%";
      document.getElementById("progText").textContent = done + " / " + total;

      const ready = allSatisfied();
      bar.className = "action-bar " + m.kind;
      btn.textContent = ready ? m.fireIdle : "还差几步 · 点我检查";
      btn.className = "fire-btn " + (ready ? "ready" : "locked");
    }

    /* ============ 复盘草稿 ============ */
    function buildReviewDraft() {
      const m = MODES[currentMode];
      const today = new Date().toISOString().slice(0, 10);
      const parts = [];
      for (const sec of m.sections) {
        const picked = sec.items.filter(it => checks[currentMode][it.id]).map(it => it.label);
        if (picked.length) parts.push(sec.name + "：" + picked.join("、"));
      }
      const closing = currentMode === "sell_tp"
        ? "→ 判断明天大概率不涨，按纪律止盈退出，不恋战。"
        : "→ 买入逻辑已证伪，果断止损离场，反抽即退出窗口。";
      return "【" + m.navLabel + " · " + today + "】" + parts.join("；") + "。" + closing;
    }
    async function copyReviewDraft() {
      const text = buildReviewDraft();
      let ok = false;
      try { await navigator.clipboard.writeText(text); ok = true; } catch { }
      if (!ok) {
        const ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        try { ok = document.execCommand("copy"); } catch { }
        ta.remove();
      }
      toast(ok ? "复盘草稿已复制到剪贴板" : "复制失败，请手动选择");
    }

    /* ============ Modal ============ */
    function missingItems() {
      const m = MODES[currentMode];
      const miss = [];
      for (const sec of m.sections) {
        if (sectionSatisfied(sec)) continue;
        if (sec.rule === "any") {
          miss.push({ label: "至少命中一条触发条件", sec: sec.name });
        } else {
          for (const it of sec.items) {
            if (!checks[currentMode][it.id]) miss.push({ label: it.label, sec: sec.name });
          }
        }
      }
      return miss;
    }

    function showWarn() {
      const m = MODES[currentMode];
      const modal = document.getElementById("modal");
      modal.className = "modal warn shake";
      document.getElementById("mBadge").textContent = "⚠️";
      document.getElementById("mTitle").textContent = "先别动手——你忘了吃过的亏了吗？";
      document.getElementById("mSub").textContent = "下面这些条件还没确认成立。跳过它们扣扳机，就是在重复上一次的错误。";
      const q = document.getElementById("mQuote");
      q.style.display = "block";
      q.innerHTML = m.warnQuote;

      const miss = missingItems();
      const list = document.getElementById("mList");
      list.style.display = "block";
      list.innerHTML =
        '<div class="ml-head">还没确认 · ' + miss.length + ' 项</div><ul>' +
        miss.map(x => '<li>' + x.label + '<span class="li-sec">· ' + x.sec + '</span></li>').join("") +
        '</ul>';

      const acts = document.getElementById("mActions");
      acts.innerHTML =
        '<button class="m-btn danger" id="mPass">我确实不满足 · 放弃这笔</button>' +
        '<button class="m-btn solid" id="mBack">回去补齐</button>';
      document.getElementById("mBack").onclick = closeModal;
      document.getElementById("mPass").onclick = closeModal;
      openOverlay();
    }

    function showPass() {
      const m = MODES[currentMode];
      const modal = document.getElementById("modal");
      modal.className = "modal pass";
      document.getElementById("mBadge").textContent = m.kind === "sell" ? "✅" : "🚀";
      document.getElementById("mTitle").textContent = m.passTitle;
      document.getElementById("mSub").textContent = m.passSub;
      const q = document.getElementById("mQuote");
      q.style.display = "block";
      q.innerHTML = "💡 " + m.passQuote;
      document.getElementById("mList").style.display = "none";

      const acts = document.getElementById("mActions");
      const draftBtn = m.kind === "sell" ? '<button class="m-btn" id="mDraft">📋 复制复盘草稿</button>' : "";
      acts.innerHTML =
        draftBtn +
        '<button class="m-btn" id="mReview">再看一眼</button>' +
        '<button class="m-btn go" id="mReset">已执行 · 清空重来</button>';
      if (m.kind === "sell") document.getElementById("mDraft").onclick = copyReviewDraft;
      document.getElementById("mReview").onclick = closeModal;
      document.getElementById("mReset").onclick = () => { closeModal(); checks[currentMode] = {}; renderMode(); };
      openOverlay();
    }

    function openOverlay() {
      document.getElementById("overlay").classList.add("show");
      if (EMBEDDED) window.parent.postMessage({ type: "xgs-need-viewport" }, "*");  // 让父页面回传当前可见区，弹窗落在视野里
    }
    function closeModal() {
      document.getElementById("overlay").classList.remove("show");
      document.getElementById("modal").classList.remove("shake");
    }

    document.getElementById("fireBtn").onclick = () => {
      if (MODES[currentMode].kind === "stance") {
        if (stanceIsToday()) switchMode(LEAN_ROUTE[dailyStance.lean]);
        return;
      }
      const passed = allSatisfied();
      if (passed) showPass();
      else showWarn();
      saveAudit(passed);   // 留痕：放行和拦截都记
    };
    document.getElementById("overlay").addEventListener("click", e => {
      if (e.target === document.getElementById("overlay")) closeModal();
    });
    window.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

    /* ============ Toast ============ */
    let toastTimer = null;
    function toast(msg) {
      let t = document.querySelector(".toast");
      if (!t) { t = document.createElement("div"); t.className = "toast"; document.body.appendChild(t); }
      t.textContent = msg; t.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
    }

    /* ============ 正文宽度拖拽（参考 reader） ============ */
    const MIN_W = 620;
    const DEFAULT_RATIO = 0.75;
    const WIDTH_KEY = "sop-main-w";
    let mainWPref = localStorage.getItem(WIDTH_KEY); // null | "full" | 数字字符串
    function maxMainW() { return Math.max(MIN_W, window.innerWidth - 300); }
    function defaultMainW() { return Math.max(MIN_W, Math.round(maxMainW() * DEFAULT_RATIO)); }
    function applyMainW() {
      let w;
      if (mainWPref === null || mainWPref === "full") w = defaultMainW();
      else w = Math.max(MIN_W, Math.min(parseInt(mainWPref, 10) || defaultMainW(), maxMainW()));
      document.documentElement.style.setProperty("--main-w", w + "px");
    }
    (function initResize() {
      const handle = document.getElementById("resizeRight");
      const col = document.getElementById("mainCol");
      handle.addEventListener("mousedown", e => {
        e.preventDefault();
        const startX = e.clientX;
        const startW = col.getBoundingClientRect().width;
        handle.classList.add("dragging");
        document.body.classList.add("dragging-col");
        function move(ev) {
          let w = startW + (ev.clientX - startX);
          w = Math.max(MIN_W, Math.min(maxMainW(), w));
          document.documentElement.style.setProperty("--main-w", w + "px");
          mainWPref = String(Math.round(w));
        }
        function up() {
          handle.classList.remove("dragging");
          document.body.classList.remove("dragging-col");
          localStorage.setItem(WIDTH_KEY, mainWPref);
          window.removeEventListener("mousemove", move);
          window.removeEventListener("mouseup", up);
        }
        window.addEventListener("mousemove", move);
        window.addEventListener("mouseup", up);
      });
      handle.addEventListener("dblclick", () => {
        mainWPref = null; localStorage.removeItem(WIDTH_KEY); applyMainW();
        toast("正文宽度已恢复为 75%");
      });
      window.addEventListener("resize", applyMainW);
      applyMainW();
      const hintKey = "ymos-sop-resize-hint-seen";
      if (!localStorage.getItem(hintKey) && window.innerWidth > 860) {
        const hint = document.getElementById("resizeHint");
        requestAnimationFrame(() => hint.classList.add("show"));
        setTimeout(() => hint.classList.remove("show"), 5000);
        localStorage.setItem(hintKey, "1");
      }
    })();

    /* ============ 键盘：1-4 切模式 ============ */
    if (location.protocol === "file:") {
      for (const link of document.querySelectorAll("[data-file-href]")) {
        link.href = link.dataset.fileHref;
      }
    }

    window.addEventListener("keydown", e => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= ORDER.length) switchMode(ORDER[n - 1]);
    });

    /* ============ 嵌入版（iframe）自适应高度协议 ============
     * 独立打开时 window.self === window.top，一切照旧（满屏 App，内部滚动）。
     * 被 iframe 嵌入（WordPress 短代码）时进入 embedded 流式布局：不设固定高度，
     * 把真实内容高度报给父页面，父页面据此调整 iframe 高度 —— 整页只有一条滚动条。
     */
    var EMBEDDED = false;
    try { EMBEDDED = window.self !== window.top; } catch (e) { EMBEDDED = true; }
    if (EMBEDDED) document.body.classList.add("embedded");

    function reportHeight() {
      if (!EMBEDDED) return;
      // 只量 body 的内容高度：documentElement.scrollHeight 会被 iframe 当前高度顶住，
      // 放进 max 会变成「只涨不缩」的棘轮，切到选项少的模式时缩不回来。
      const h = Math.max(document.body.scrollHeight, document.body.offsetHeight);
      window.parent.postMessage({ type: "xgs-height", height: h }, "*");
    }
    window.addEventListener("message", (e) => {
      const d = e.data || {};
      if (d.type === "xgs-viewport") {   // 父页面告知：iframe 当前可见区的 top 偏移与高度
        document.documentElement.style.setProperty("--vis-top", (d.top || 0) + "px");
        document.documentElement.style.setProperty("--vis-height", (d.height || 0) + "px");
      }
    });
    if (EMBEDDED) {
      window.addEventListener("load", reportHeight);
      window.addEventListener("resize", reportHeight);
      // 字体加载完 / 稍后再补报几次，兜住 reflow 引起的高度变化
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(reportHeight);
      setTimeout(reportHeight, 120);
      setTimeout(reportHeight, 450);
      window.parent.postMessage({ type: "xgs-ready" }, "*");  // 通知父页面：请回传可见区信息
    }

    /* ============ vault 连接状态 ============ */
    /* 决策台可以完全脱机用（勾选状态存 localStorage）。
       但只要 Console/server.py 在跑，每次扣扳机/被拦截就会留痕到你自己的 Obsidian。 */
    let vaultOnline = false;

    function renderVaultChip() {
      if (EMBEDDED) return;                     // 嵌在别处时不显示，避免干扰宿主页面
      let chip = document.getElementById("vaultChip");
      if (!chip) {
        chip = document.createElement("div");
        chip.id = "vaultChip";
        // 放右上角：右下角是「扣扳机」按钮的位置，不能挡
        chip.style.cssText =
          "position:fixed;right:14px;top:12px;z-index:60;font-size:11.5px;line-height:1;" +
          "padding:6px 10px;border-radius:999px;border:1px solid var(--line,#e0ddd4);" +
          "background:var(--card,#fff);color:var(--muted,#77736a);box-shadow:0 1px 4px rgba(0,0,0,.06);" +
          "font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;cursor:default;" +
          "opacity:.85;pointer-events:none;";
        document.body.appendChild(chip);
      }
      chip.textContent = vaultOnline ? "🟢 已连 vault · 决策自动留痕" : "⚪️ 仅本地 · 未连 vault";
      chip.title = vaultOnline
        ? "每次扣扳机和每次被拦截，都会写进你 vault 的决策审计目录"
        : "跑 python3 server.py 后，决策会自动留痕到你的 Obsidian";
    }

    async function checkVault() {
      try {
        const r = await fetch("/api/health");
        vaultOnline = r.ok;
      } catch (e) { vaultOnline = false; }
      renderVaultChip();
    }

    /* ============ 决策留痕 ============ */
    function saveAudit(passed) {
      if (!vaultOnline) return;                     // 脱机时静默跳过，不打扰
      const m = MODES[currentMode];
      if (!m || m.kind === "stance") return;
      const gates = (m.sections || []).map(sec => ({
        label: sec.name,
        items: (sec.items || []).map(it => ({
          label: String(it.label || "").replace(/<[^>]+>/g, ""),
          checked: !!checks[currentMode][it.id],
          redline: !!it.redline,
        })),
      }));
      const payload = {
        date: todayStr(),
        mode: currentMode,
        modeLabel: (m.group ? m.group + " · " : "") + (m.navLabel || currentMode),
        passed: !!passed,
        stance: stanceIsToday() && dailyStance
          ? (REGIME_LABEL[dailyStance.regime] || "") + " · " + (LEAN_LABEL[dailyStance.lean] || "")
          : "",
        gates,
        missing: passed ? [] : missingItems().map(x => String(x.label).replace(/<[^>]+>/g, "")),
      };
      fetch("/api/audit/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      }).then(r => { if (r.ok) toast(passed ? "已留痕：放行" : "已留痕：拦截"); })
        .catch(() => { });
    }

    /* ============ 规则外置 ============ */
    /* 页面内置的是作者自己的一套参数，只是样例。
       想换成你自己的：把 rules.example.json 复制成 rules.json 改掉即可，
       启动时会自动覆盖；读不到就用内置默认，页面照常能跑。 */
    async function loadRules() {
      try {
        const r = await fetch("/rules.json");
        if (!r.ok) return;
        const rules = await r.json();
        if (rules && typeof rules === "object") {
          if (rules.sizeCap) Object.assign(SIZE_CAP, rules.sizeCap);
          if (rules.modes) {
            for (const [key, patch] of Object.entries(rules.modes)) {
              if (MODES[key] && patch && typeof patch === "object") Object.assign(MODES[key], patch);
            }
          }
        }
      } catch (e) { /* 没有后端 / 没有规则文件：用内置默认 */ }
    }

    /* init */
    (async () => {
      await loadRules();
      renderNav();
      renderMobileTabs();
      renderMode();
      checkVault();
    })();
  </script>
</body>
