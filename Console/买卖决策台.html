    /* ---- 指标卡 ---- */
    function buildMetrics() {
      const m = metrics();
      const wrap = document.createElement("div");
      wrap.className = "metrics";
      const card = (val, label, cls) =>
        '<div class="metric ' + (cls || "") + '"><div class="mt-val">' + val + '</div><div class="mt-label">' + label + '</div></div>';
      const ratioCls = !m.cap || !m.total ? "" : (m.ratio > account.maxSingleRatio ? "bad" : "ok");
      wrap.innerHTML =
        card(m.total ? fmtMoney(m.total) : "—", (currentMode === "buy_add" ? "调整后建仓计划" : "计划投入") + "（" + cur().label + "）") +
        card(m.cap && m.total ? (m.ratio * 100).toFixed(1) + "%" : "—", "占该账户（上限 " + (account.maxSingleRatio * 100).toFixed(0) + "%）", ratioCls) +
        card(prep.noStop ? "不设" : (m.stopPct ? "-" + m.stopPct.toFixed(1) + "%" : "—"), "止损幅度") +
        card(m.maxLoss ? fmtMoney(m.maxLoss) : "—", prep.noStop ? "最大风险（全额）" : "最大亏损额", m.maxLoss ? "bad" : "") +
        card(m.lossOfAcct ? (m.lossOfAcct * 100).toFixed(2) + "%" : "—", "占该账户");
      return wrap;
    }

    /* ---- 建仓准备的数字表单 ---- */
    function buildPrepForm() {
      const m = metrics();
      const isAdd = currentMode === "buy_add";
      const c = cur();
      const wrap = document.createElement("div");
      wrap.className = "pf-grid";
      const acc = prepAccount();
      const fundH = horizonBy(HORIZON_FUND, acc.horizonFund);
      const thIdx = horizonIdx(HORIZON_THESIS, prep.horizonThesis);
      const thLabel = thIdx < 0 ? "未选" : HORIZON_THESIS[thIdx].label;
      const clash = fundH && thIdx >= 0 && HORIZON_THESIS[thIdx].months > fundH.months;
      // 调整建仓计划：拖的是「调整后的计划总额」，下限锁在已建仓金额。
      const amt = isAdd ? m.total : num(prep.amount);
      const amtMax = Math.max(m.cap || c.max, amt);
      const floor = isAdd ? Math.max(0, Math.round(m.floor)) : 0;
      const targetPct = m.cap ? Math.max(0, Math.min(200, Math.round(amt / m.cap * 100))) : 0;
      const amountControl = isAdd
        ? '<div class="slider-row"><input class="pf-range" type="range" min="' + floor + '" max="' + Math.max(amtMax, floor + 1) + '" step="' + c.step + '" value="' + amt + '" id="pfAmtRange" />' +
          '<input class="pf-input num" type="number" step="' + c.step + '" id="pfAmt" value="' + (amt || "") + '" placeholder="0" /></div>' +
          '<div class="slider-ticks"><span>已建 ' + fmtMoney(floor) + '</span><span>原计划 ' + fmtMoney(m.base) + '</span><span>' + fmtMoney(amtMax) + '</span></div>'
        : '<div class="slider-row"><input class="pf-range" type="range" min="0" max="' + amtMax + '" step="' + c.step + '" value="' + amt + '" id="pfAmtRange" />' +
          '<input class="pf-input num" type="number" step="' + c.step + '" id="pfAmt" value="' + (amt || "") + '" placeholder="0" /></div>';
      const amountHint = !isAdd ? ''
        : (m.add > 0
          ? '在原计划 <b>' + fmtMoney(m.base) + '</b> 上<b>调大 ' + fmtMoney(m.add) + '</b>（' + targetPct + '% 账户）—— 这是加仓，下面的门要全绿。'
          : m.add < 0
            ? '把计划从 <b>' + fmtMoney(m.base) + '</b> <b>缩到 ' + fmtMoney(m.total) + '</b>（' + fmtMoney(m.add) + '）—— 降敞口不设门，但要写清为什么。'
            : '拖动或直接输入<b>调整后的计划总额</b>。下限 <b>' + fmtMoney(floor) + '</b> = 已经建进去的钱，改计划改不动它。');

      wrap.innerHTML =
        '<div class="pf-row wide"><div class="pf-label">用哪个账户 <span class="pf-unit">分市场记账，占比只跟这个账户比</span></div>' +
        '<div class="pf-opts" data-g="account">' +
        Object.keys(CURRENCY).map(k => {
          const a = account.accounts[k], ready = num(a.capital) > 0;
          return '<button class="pf-opt' + (prep.account === k ? " on" : "") + '" data-v="' + k + '">' + CURRENCY[k].sym + ' ' + CURRENCY[k].label +
            '<span class="opt-sub">' + (ready ? fmtMoney(a.capital, k) : "未设置") + '</span></button>';
        }).join("") + '</div>' +
        (m.cap ? '' : '<div class="pf-hint bad">这个账户还没在「账户参数」里填资金基数 —— 占比和期限都算不出来。</div>') + '</div>' +

        '<div class="pf-row wide"><div class="pf-label">论点兑现周期 <span class="pf-unit">这个逻辑要跑多久</span></div>' +
        '<div class="slider-row"><input class="pf-range" type="range" min="0" max="' + (HORIZON_THESIS.length - 1) + '" step="1" value="' + (thIdx < 0 ? 0 : thIdx) + '" id="pfTh" />' +
        '<span class="slider-val' + (thIdx < 0 ? " dim" : "") + '" id="pfThVal">' + thLabel + '</span></div>' +
        '<div class="slider-ticks">' + HORIZON_THESIS.map(h => '<span>' + h.label + '</span>').join("") + '</div>' +
        '<div class="pf-hint' + (clash ? " bad" : (fundH && thIdx >= 0 ? " ok" : "")) + '">' +
        (!fundH ? '这个账户还没定资金可用期限 —— 定了才能比对。'
          : thIdx < 0 ? '拖一下选周期，会立刻跟该账户的「资金可用 ' + fundH.label + '」比对。'
            : clash ? '⚠️ 期限错配：这个账户的钱只能放 ' + fundH.label + '，论点却要跑 ' + HORIZON_THESIS[thIdx].label + ' —— 方向对不对都不影响它爆。'
              : '✓ 资金可用 ' + fundH.label + ' ≥ 论点要跑 ' + HORIZON_THESIS[thIdx].label) + '</div></div>' +

        '<div class="pf-row wide"><div class="pf-label">' + (isAdd ? "调整后的建仓计划总额" : "计划投入金额") + ' <span class="pf-unit">' + c.sym + ' ' + c.label + '</span></div>' +
        amountControl +
        '<div class="pf-hint' + (m.cap && m.total && m.ratio > account.maxSingleRatio ? " bad" : "") + '">' +
        (m.cap ? amountHint + (amountHint ? '<br>' : '') + '单笔上限 <b>' + fmtMoney(m.cap * account.maxSingleRatio) + '</b>（该账户 ' + (account.maxSingleRatio * 100).toFixed(0) + '%）' +
          (m.total ? '　·　当前 <b>' + (m.ratio * 100).toFixed(1) + '%</b>' : '')
          : '先去账户参数填这个账户的资金基数') + '</div></div>' +

        (isAdd
          ? '<div class="pf-row wide"><div class="pf-label">调整理由 <span class="pf-unit">' + (m.trimming ? "必填" : "选填") + '</span></div>' +
            '<textarea class="i-text" id="pfPlanNote" rows="2" placeholder="' +
            (m.trimming ? "为什么把计划改小？论点变弱了、仓位不舒服、还是发现了更好的机会？" : "为什么现在要加？赔率哪里变好了？") +
            '">' + escapeHTML(prep.planNote || "") + '</textarea>' +
            '<div class="pf-hint' + (m.trimming && !(prep.planNote || "").trim() ? " bad" : "") + '">' +
            (m.trimming
              ? '缩减计划不设门，但<b>必须留下理由</b>。以后回看，「主动缩减」和「从没打算买那么多」是两件完全不同的事，只有这句话能把它们分开。'
              : '加仓的理由会连同压力测试一起写进决策文件。') + '</div></div>'
          : '') +

        '<div class="pf-row wide"><div class="pf-label">止损幅度 <span class="pf-unit">买入价是买的时候才知道的，这里只定幅度</span></div>' +
        '<div class="slider-row"><input class="pf-range" type="range" min="0" max="50" step="0.5" value="' + num(prep.stopPct) + '" id="pfStopPct"' + (prep.noStop ? " disabled" : "") + ' />' +
        '<span class="slider-val' + (prep.noStop || !num(prep.stopPct) ? " dim" : "") + '" id="pfStopVal">' + (prep.noStop ? "不设" : (num(prep.stopPct) ? "-" + num(prep.stopPct).toFixed(1) + "%" : "未定")) + '</span></div>' +
        '<div class="slider-ticks"><span>0</span><span>10%</span><span>20%</span><span>30%</span><span>40%</span><span>50%</span></div>' +
        '<label class="pf-check"><input type="checkbox" id="pfNoStop"' + (prep.noStop ? " checked" : "") + ' />' +
        '<span>本策略<b>不设价格止损</b>（长期持有 / 左侧建仓）</span></label>' +
        '<div class="pf-hint' + (prep.noStop ? " bad" : "") + '">' +
        (prep.noStop
          ? '不设价格止损 = <b>出局条件换成逻辑证伪</b>。那么最大风险就是这笔投入的<b>全部 ' + (m.total ? fmtMoney(m.total) : '金额') + '</b> —— 下面的「退出逻辑」必须写出<b>可观测的证伪信号</b>，否则这笔就没有出局条件了。'
          : (m.stopPct && m.total ? '打到止损亏 <b>' + fmtMoney(m.maxLoss) + '</b>，占该账户 <b>' + (m.lossOfAcct * 100).toFixed(2) + '%</b>' : '拖动定幅度；长期 / 左侧建仓可以勾上面那个不设。')) + '</div></div>' +

        '<div class="pf-row wide"><div class="pf-label">出局权归属 <span class="pf-unit">谁有权强制我平仓</span></div>' +
        '<div class="pf-opts" data-g="exitControl">' +
        Object.keys(EXIT_CONTROL).map(k => '<button class="pf-opt' + (prep.exitControl === k ? " on" + (EXIT_CONTROL[k].ok ? "" : " neg") : "") + '" data-v="' + k + '">' +
          EXIT_CONTROL[k].label + '<span class="opt-sub">' + EXIT_CONTROL[k].sub + '</span></button>').join("") + '</div>' +
        '<div class="pf-hint">出局条件必须<b>内生</b>。把「什么时候必须认输」签给一个跟你利益不一致的人，是结构性缺陷 —— 跟你看多看空对不对无关。</div></div>';

      const th = wrap.querySelector("#pfTh");
      th.addEventListener("input", () => {
        const i = parseInt(th.value, 10);
        prep.horizonThesis = HORIZON_THESIS[i].key;
        const v = wrap.querySelector("#pfThVal");
        v.textContent = HORIZON_THESIS[i].label; v.classList.remove("dim");
        markStarted();
      });
      th.addEventListener("change", () => renderMode());

      const amtRange = wrap.querySelector("#pfAmtRange"), amtNum = wrap.querySelector("#pfAmt");
      // 调整计划时写的是目标总额（planTarget）；新建仓时写的是计划金额（amount）。
      const setAmt = v => {
        if (isAdd) prep.planTarget = Math.max(floor, v); else prep.amount = v;
        markStarted(); updateProgress();
      };
      amtRange.addEventListener("input", () => { setAmt(num(amtRange.value)); if (amtNum) amtNum.value = num(amtRange.value) || ""; });
      amtRange.addEventListener("change", () => renderMode());
      if (amtNum) {
        amtNum.addEventListener("input", () => { setAmt(num(amtNum.value)); amtRange.value = Math.min(Math.max(num(amtNum.value), floor), amtMax); });
        amtNum.addEventListener("change", () => renderMode());
      }
      const planNote = wrap.querySelector("#pfPlanNote");
      if (planNote) planNote.addEventListener("input", e => { prep.planNote = e.target.value; markStarted(); updateProgress(); });

      const sp = wrap.querySelector("#pfStopPct");
      sp.addEventListener("input", () => {
        prep.stopPct = num(sp.value);
        const v = wrap.querySelector("#pfStopVal");
        v.textContent = num(sp.value) ? "-" + num(sp.value).toFixed(1) + "%" : "未定";
        v.classList.toggle("dim", !num(sp.value));
        markStarted(); updateProgress();
      });
      sp.addEventListener("change", () => renderMode());
      wrap.querySelector("#pfNoStop").addEventListener("change", e => { prep.noStop = e.target.checked; markStarted(); renderMode(); });

      wrap.querySelectorAll('.pf-opts[data-g="account"] .pf-opt').forEach(b => {
        b.onclick = () => { prep.account = b.dataset.v; markStarted(); renderMode(); };
      });
      wrap.querySelectorAll('.pf-opts[data-g="exitControl"] .pf-opt').forEach(b => {
        b.onclick = () => { prep.exitControl = (prep.exitControl === b.dataset.v ? "" : b.dataset.v); markStarted(); renderMode(); };
      });
      return wrap;
    }

    /* ---- 持仓事实：卖出 / 调整止损都必须先看到当前实际仓位 ---- */
    function buildPositionContext(purpose) {
      const p = activePosition(), el = document.createElement("div");
      el.className = "section";
      if (!p || !p.shares) {
        el.innerHTML = '<div class="section-title"><span class="s-name">当前持仓事实</span><span class="s-rule any">缺股数</span></div>' +
          '<div class="empty-note">这份老决策文件没有记录持仓股数。先去「确认建仓」补齐成交价和股数，才能算卖出后剩余仓位与止损风险。</div>';
        return el;
      }
      const code = p.plan.account || p.plan.currency || "CNY";
      const risk = p.plan.noStop ? "逻辑证伪退出" : (p.plan.stopPct ? "-" + num(p.plan.stopPct).toFixed(1) + "%" : "未定");
      const rows = [
        ["当前股数 / 份额", fmtShares(p.shares)],
        ["成本价", p.costPrice ? fmtMoney(p.costPrice, code) : "—"],
        ["持仓成本", p.costAmount ? fmtMoney(p.costAmount, code) : "—"],
        ["当前生效退出规则", risk],
      ];
      if (p.currentPrice) rows.splice(2, 0,
        ["现价", fmtMoney(p.currentPrice, code)],
        ["当前市值", fmtMoney(p.marketValue, code)],
        ["浮动盈亏", (p.pnl >= 0 ? "+" : "") + fmtMoney(p.pnl, code) + "（" + (p.pnlPct >= 0 ? "+" : "") + p.pnlPct.toFixed(1) + "%）"]
      );
      el.innerHTML = '<div class="section-title"><span class="s-name">当前持仓事实</span><span class="s-rule all">' +
        (purpose === "sell" ? "卖出前" : "调整前") + '</span></div>' +
        '<div class="tbl-scroll"><table class="m-tbl arch">' + rows.map(r => '<tr><td>' + r[0] + '</td><td><b>' + escapeHTML(String(r[1])) + '</b></td></tr>').join("") + '</table></div>' +
        (!p.currentPrice ? '<div class="empty-note">未拉取行情，所以只显示成本口径。去持仓总览拉一次价格后，这里会同时显示现价、市值和浮动盈亏。</div>' : '');
      return el;
    }

    function buildAdjustForm() {
      const p = activePosition(), plan = p ? p.plan : {}, code = plan.account || plan.currency || "CNY";
      const oldNoStop = !!plan.noStop, oldPct = num(plan.stopPct);
      const oldRule = oldNoStop
        ? "无价格止损 · " + (plan.exitRule || activeTexts.x4 || "按论点失效证据执行退出")
        : (oldPct ? "价格止损 -" + oldPct.toFixed(1) + "%" + (p && p.costPrice ? "（约 " + fmtMoney(p.costPrice * (1 - oldPct / 100), code) + "）" : "") : "未定义");
      const wrap = document.createElement("div");
      wrap.className = "pf-grid";
      wrap.innerHTML =
        '<div class="pf-row wide"><div class="pf-label">当前生效规则 <span class="pf-unit">只读 · 来自建仓准备 / 最近一次调整</span></div>' +
        '<div class="fill-sum">' + escapeHTML(oldRule) + '</div></div>' +
        '<div class="pf-row wide"><div class="pf-label">新的退出方式</div><div class="pf-opts" id="adjMode">' +
        '<button class="pf-opt' + (prep.adjustMode === "price" ? " on" : "") + '" data-v="price">价格止损<span class="opt-sub">按成本价的回撤幅度</span></button>' +
        '<button class="pf-opt' + (prep.adjustMode === "logic" ? " on" : "") + '" data-v="logic">不设价格止损<span class="opt-sub">改为论点证伪 / 退出策略</span></button></div></div>' +
        (prep.adjustMode === "price"
          ? '<div class="pf-row wide"><div class="pf-label">新止损幅度</div><div class="slider-row"><input class="pf-range" type="range" min="0" max="50" step="0.5" value="' + num(prep.adjustStopPct) + '" id="adjStop" />' +
            '<span class="slider-val">' + (num(prep.adjustStopPct) ? "-" + num(prep.adjustStopPct).toFixed(1) + "%" : "未定") + '</span></div>' +
            '<div class="pf-hint">' + (p && p.costPrice && num(prep.adjustStopPct) ? '对应价位约 <b>' + fmtMoney(p.costPrice * (1 - num(prep.adjustStopPct) / 100), code) + '</b>；全部剩余仓位触发时约亏 <b>' + fmtMoney(p.costAmount * num(prep.adjustStopPct) / 100, code) + '</b>。' : '选定幅度后，会按当前成本价和剩余股数计算风险。') + '</div></div>'
          : prep.adjustMode === "logic"
            ? '<div class="pf-row wide"><div class="pf-label">新的退出策略 <span class="pf-unit">必须可执行</span></div><textarea class="i-text" id="adjRule" rows="3" placeholder="例：收盘跌破关键位且 3 日无承接则全部退出；若两个季度未兑现则重新审查。">' + escapeHTML(prep.adjustExitRule || "") + '</textarea></div>'
            : '');
      wrap.querySelectorAll("#adjMode .pf-opt").forEach(b => { b.onclick = () => { prep.adjustMode = b.dataset.v; markStarted(); renderMode(); }; });
      const stop = wrap.querySelector("#adjStop");
      if (stop) {
        stop.addEventListener("input", () => {
          prep.adjustStopPct = num(stop.value);
          markStarted();
          stop.nextElementSibling.textContent = prep.adjustStopPct ? "-" + prep.adjustStopPct.toFixed(1) + "%" : "未定";
          updateProgress();
        });
        stop.addEventListener("change", () => renderMode());
      }
      const rule = wrap.querySelector("#adjRule");
      if (rule) rule.addEventListener("input", () => { prep.adjustExitRule = rule.value; markStarted(); updateProgress(); });
      return wrap;
    }

    /* ---- 卖出表单（降低风险不设闸门，但把卖前 / 卖后仓位算清楚） ---- */
    function buildSellForm() {
      const pos = sellPositionPreview();
      const wrap = document.createElement("div");
      wrap.className = "pf-grid";
      wrap.innerHTML =
        '<div class="pf-row"><div class="pf-label">卖出比例</div><div class="pf-opts" id="spOpts">' +
        Object.keys(SELL_PORTION).map(k =>
          '<button class="pf-opt' + (prep.sellPortion === k ? " on" + (k === "all" ? " neg" : "") : "") + '" data-k="' + k + '">' + SELL_PORTION[k].label + '</button>').join("") +
        '</div><div class="pf-hint">本次计划卖 <b>' + fmtShares(pos.sell) + '</b>，卖后剩 <b>' + fmtShares(pos.remain) + '</b>。选「全部清仓」会把决策文件归档；部分卖出会把剩余股数写回文件头。</div></div>' +
        '<div class="pf-row"><div class="pf-label">成交价 <span class="pf-unit">必填</span></div>' +
        '<input class="pf-input" type="number" step="0.01" id="spPrice" value="' + (prep.sellPrice || "") + '" placeholder="0.00" />' +
        '<div class="pf-hint' + (num(prep.sellPrice) > 0 ? "" : " bad") + '">' +
        (num(prep.sellPrice) > 0
          ? (function () {
            const p = activePosition();
            if (!p || !p.costPrice) return "已记录成交价。";
            const pnl = (num(prep.sellPrice) - p.costPrice) * pos.sell;
            const code = p.plan.account || p.plan.currency || "CNY";
            return "本次已实现盈亏 <b class=\"" + (pnl >= 0 ? "up" : "down") + "\">" + (pnl >= 0 ? "+" : "") + fmtMoney(pnl, code) +
              "</b>（成本价 " + p.costPrice + "）。<b>全部清仓时这个数会自动结转进账户资金基数。</b>";
          })()
          : "没有成交价就算不出已实现盈亏 —— 账户净值和资金基数都会停在原地，这正是「平仓了钱却没进账」的来源。") + '</div></div>' +
        '<div class="pf-row wide"><div class="pf-label">补充说明 <span class="pf-unit">选填</span></div>' +
        '<textarea class="i-text" id="spNote" rows="2" placeholder="当时的盘面、犹豫、执行偏差 —— 写一句，以后复盘时这句最值钱。">' + escapeHTML(prep.sellNote || "") + '</textarea></div>';
      wrap.querySelectorAll("#spOpts .pf-opt").forEach(b => {
        b.onclick = () => { prep.sellPortion = b.dataset.k; renderMode(); };
      });
      wrap.querySelector("#spPrice").addEventListener("input", e => { prep.sellPrice = num(e.target.value); });
      wrap.querySelector("#spNote").addEventListener("input", e => { prep.sellNote = e.target.value; });
      return wrap;
    }

    /* ---- section / item 渲染（支持 check / calc / text 三种条目） ---- */
    function buildSection(sec) {
      const secEl = document.createElement("div");
      secEl.className = "section";
      const ruleLabel = sec.rule === "any" ? (isGated() ? "至少 1 条" : "记录用 · 可空") : "全部必填";
      secEl.innerHTML =
        '<div class="section-title">' +
        '<span class="s-name">' + sec.name + '</span>' +
        '<span class="s-rule ' + sec.rule + '">' + ruleLabel + '</span>' +
        '<span class="s-prog" data-sec="' + escapeHTML(sec.name) + '"></span>' +
        '</div>' + (sec.note ? '<div class="i-note" style="margin:-4px 0 12px">' + sec.note + '</div>' : '');
      for (const it of sec.items) {
        if (it.type === "calc") secEl.appendChild(buildCalcItem(it));
        else if (it.type === "text") secEl.appendChild(buildTextItem(it));
        else secEl.appendChild(buildCheckItem(it));
      }
      return secEl;
    }

    function buildCheckItem(it) {
      const row = document.createElement("div");
      const on = cget(it);
      row.className = "item" + (it.redline ? " redline" : "") + (on ? " checked" : "");
      row.dataset.itemId = it.id;
      if (viewing()) row.classList.add("ro");
      else row.onclick = () => toggle(it);
      row.innerHTML =
        '<div class="cbox">' + CHECK_SVG + '</div>' +
        '<div class="i-body">' +
        '<div class="i-label">' + it.label + (it.redline ? '<span class="rl-tag">红线</span>' : '') + '</div>' +
        '<div class="i-note">' + it.note + '</div>' +
        '</div>';
      return row;
    }

    /* 计算型闸门：没有 onclick —— 界面上就没有「点一下变绿」的入口。 */
    function buildCalcItem(it) {
      const r = it.calc();
      const row = document.createElement("div");
      row.className = "item calc " + r.state + (it.redline ? " redline" : "");
      row.dataset.itemId = it.id;
      row.innerHTML =
        '<div class="cbox">' + (r.state === "pass" ? "✓" : r.state === "fail" ? "✕" : "?") + '</div>' +
        '<div class="i-body">' +
        '<div class="i-label">' + it.label + '<span class="req-tag">' + (r.state === "idle" && it.idleOk ? "未校验" : "计算型") + '</span>' +
        (it.redline ? '<span class="rl-tag">红线</span>' : '') + '</div>' +
        '<div class="i-note">' + it.note + '</div>' +
        '<div class="calc-detail">' + escapeHTML(r.detail) +
        (it.skippable && !prep.coolSkipped && r.state !== "pass" ? ' <button class="skip-btn" data-skip="1">跳过冷却期 →</button>' : '') +
        (it.skippable && prep.coolSkipped ? ' <button class="skip-btn undo" data-skip="0">撤销跳过</button>' : '') +
        '</div>' +
        '</div>';
      const sk = row.querySelector("[data-skip]");
      if (sk) sk.onclick = e => { e.stopPropagation(); prep.coolSkipped = sk.dataset.skip === "1"; persistPrep(); renderMode(); renderNav(); };
      return row;
    }

    function buildTextItem(it) {
      const val = tget(it);
      const row = document.createElement("div");
      row.className = "item txt " + (val.trim() ? "filled" : (it.required ? "empty" : ""));
      row.dataset.itemId = it.id;
      row.innerHTML =
        '<div class="i-label">' + it.label + (it.required ? '<span class="req-tag">必填</span>' : '') + '</div>' +
        '<div class="i-note">' + (it.note || "") + '</div>' +
        '<textarea class="i-text" rows="' + (it.rows || 2) + '" placeholder="' + escapeHTML(it.placeholder || "") + '"></textarea>';
      const ta = row.querySelector("textarea");
      ta.value = val;
      if (viewing()) { ta.readOnly = true; row.classList.add("ro"); return row; }
      ta.addEventListener("input", () => {
        tset(it, ta.value);
        markStarted();
        row.classList.toggle("filled", !!ta.value.trim());
        row.classList.toggle("empty", it.required && !ta.value.trim());
        updateProgress();
        if (currentMode === "buy_new") renderNav();   // 逻辑一通过，建仓准备立刻解锁
      });
      return row;
    }

    /* =====================================================================
       渲染 · 账户参数（独立 tab · 存状态机文件）
       ===================================================================== */
    function applyAccountChange(type, rawValue, note) {
      const a = account.accounts[accountEditCode], before = num(a.capital), value = num(rawValue);
      if (value < 0 || (type !== "set" && !value)) { toast("先填有效金额"); return; }
      const after = type === "add" ? before + value : type === "subtract" ? Math.max(0, before - value) : value;
      if (after === before) { toast("金额没有变化"); return; }
      a.capital = after;
      const labels = { add: "增加资金", subtract: "减少资金", set: "直接设定" };
      account.changes.push({
        ts: nowStamp(), account: accountEditCode, type, label: labels[type],
        amount: Math.abs(after - before), before, after, note: (note || "").trim(),
      });
      account.changes = account.changes.slice(-200);
      persistAccountLocal();
      renderMode();
      toast(labels[type] + "已记录，记得点底部保存写入 Obsidian");
    }

      L.push("");
      L.push("## 平仓结转台账");
      L.push("");

      L.push("## 资金变动记录");

      L.push("| 时间 | 账户 | 动作 | 变动金额 | 变更前 | 变更后 | 备注 |");

        if ((health.alerts || []).length) {
          for (const alert of health.alerts) {
            L.push("| " + (alert.severity === "critical" ? "🛑 紧急" : "⚠️ 关注") + " | " + mdCell(alert.type) + " | " + mdCell(alert.ticker || alert.name) + " | " + mdCell(alert.message) + " | " + mdCell((alert.suggestedPrompts || []).join(" → ")) + " | " + mdCell(alert.file) + " |");
          }
        } else {
          L.push("| ✅ | normal | 全部 | 未发现可由当前数据判定的结构或止损异常 | 日常组合检查可按需跑 P7 | — |");
        }
        L.push("");
        L.push("### 持仓明细与退出上下文");
        L.push("");
        L.push("| 标的 | Ticker | 账户 | 股数 | 成本 / 现价 | 市值 / 浮动盈亏 | 止损状态 | 失效信号 | 退出动作 | 建议调用 |");
        L.push("| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |");
        if ((snap.positions || []).length) {
          for (const p of snap.positions) {
            const code = CURRENCY[p.account] ? p.account : "CNY";
            const pnl = p.unrealizedPnl == null ? "—" : fmtMoney(num(p.unrealizedPnl), code) + " / " + num(p.pnlPct).toFixed(1) + "%";
            const stopLabel = { breached: "🛑 已跌破", near: "⚠️ 临近", within_limit: "✅ 未触发", logic_exit: "🧠 逻辑退出", price_unavailable: "— 缺价格" }[p.stopStatus] || p.stopStatus || "—";
            const stopDetail = p.distanceToStopPct == null ? stopLabel : stopLabel + " / " + num(p.distanceToStopPct).toFixed(1) + "%";
            L.push("| " + mdCell(p.name) + " | " + mdCell(p.ticker) + " | " + CURRENCY[code].label + " | " + mdCell(p.shares) + " | " + mdCell(p.costPrice) + " / " + mdCell(p.lastPrice) + " | " + fmtMoney(num(p.marketValue), code) + " / " + pnl + " | " + mdCell(stopDetail) + " | " + mdCell(p.invalidationSignal) + " | " + mdCell(p.exitAction) + " | " + mdCell((p.suggestedPrompts || []).join(" → ")) + " |");
          }
        } else {
          L.push("| — | — | — | — | — | 暂无持仓 | — | — | — | — |");
        }
      } else {
        L.push("暂无快照。在「持仓总览」成功拉取一次行情后，会自动写入这里。");
      }
      L.push("");
      L.push("| 全局参数 | 值 |");
      L.push("| --- | --- |");
      L.push("| 单笔上限比例 | " + (account.maxSingleRatio * 100).toFixed(0) + "% |");
      L.push("| 更新时间 | " + account.updated + " |");
      L.push("");
      L.push("**资金可用期限为什么要按账户分开填**：港股账户可能是短钱、美股账户可能是十年不动的长钱 —— 它们能承载的论点周期本来就不同。这一项唯一的用途，是和每笔交易的「论点兑现周期」比对：用一笔半年内要用的钱，去承载一个要跑三年才兑现的叙事，就是期限错配，方向对不对都不影响它爆。");
      L.push("");
      L.push("<!-- ymos-trade-account：买卖决策台结构化数据，请勿手动修改 -->");
      L.push("```json");
      L.push(JSON.stringify(account, null, 2));
      L.push("```");
      L.push("");
      return L.join("\n");
    }

    async function writeAccountState() {
      const markdown = accountMarkdown();
      return api("/api/trade/account", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ markdown }) });
    }

    async function saveAccount() {
      account.updated = nowStamp();
      persistAccountLocal();
      try {
        await writeAccountState();
        await loadAccount();
        await loadTrades();
        restoreQuotes();
        renderAll();
        toast("账户参数已存入并刷新全局状态");
      } catch (e) {
        toast(location.protocol === "file:"
          ? "未写入 Markdown：当前只是页面草稿，请从本地服务地址打开"
          : "保存失败：本地服务未启动？");
      }
      if (!serverOk) renderMode();
    }

    /* =====================================================================
       切换 / 勾选 / 进度
       ===================================================================== */
    function switchStrategy(key) {
      if (key === currentStrategy) return;
      currentStrategy = key;
      renderAll();
    }
    function seedPrepareFromLogic() {
      for (const it of THESIS_GATE.items) {
        if (it.type !== "text") continue;
        const src = bank(texts, it, "buy_new")[it.id];
        const dst = bank(texts, it, "prepare");
        if (src != null && dst[it.id] == null) dst[it.id] = src;
      }
    }
    function switchMode(key) {
      if (key === currentMode) return;
      if (modeLocked(key)) { toast(key === "fill" ? "先完成并保存「② 建仓准备」" : "先在「① 买入逻辑」完成论点建档"); return; }
      if (key === "prepare" && !activeFile) seedPrepareFromLogic();
      currentMode = key;
      // 每次进模式清空重勾 —— 不留旧勾避免自欺。
      // 买入逻辑与建仓准备是同一笔的两个审视时点，共享论点输入。
      if (key !== "buy_new" && key !== "prepare") checks[currentStrategy + "/" + key] = {};
      renderNav(); renderMode();
    }
    function toggle(it) {
      const on = !cget(it);
      cset(it, on);
      const row = document.querySelector('#bodyScroll .item[data-item-id="' + it.id + '"]');
      if (row) row.classList.toggle("checked", on);
      markStarted();
      updateProgress();
      if (currentMode === "buy_new") renderNav();
    }

    function itemSatisfied(it) {
      if (it.type === "calc") {
        const s = it.calc().state;
        return s === "pass" || (s === "idle" && it.idleOk);
      }
      if (it.type === "text") return !it.required || !!tget(it).trim();
      return cget(it);
    }
    function sectionSatisfied(sec) {
      const done = sec.items.filter(itemSatisfied).length;
      return sec.rule === "any" ? done >= 1 : done === sec.items.length;
    }
    function allSatisfied() {
      if (currentMode === "buy_new") return !!(prep.symbol || "").trim() && currentSections().every(sectionSatisfied);
      return currentSections().every(sectionSatisfied);
    }

    /* 数字 / 文本变化时，计算型闸门也要同步重绘；只更新进度条会让结果已通过、卡片却仍停在旧颜色。 */
    function refreshCalcItems() {
      for (const sec of currentSections()) {
        for (const it of sec.items) {
          if (it.type !== "calc") continue;
          const row = document.querySelector('#bodyScroll .item.calc[data-item-id="' + CSS.escape(it.id) + '"]');
          if (row) row.replaceWith(buildCalcItem(it));
        }
      }
    }

    function updateProgress() {
      const meta = MODE_META[currentMode];
      const def = currentModeDef();
      const bar = document.getElementById("actionBar");
      const btn = document.getElementById("fireBtn");
      const hint = document.getElementById("progHint");
      bar.className = "action-bar " + (meta.kind === "prep" || meta.kind === "admin" ? "stance" : meta.kind);

      if (currentMode === "account") {
        const codes = Object.keys(account.accounts);
        const fields = [codes.some(k => num(account.accounts[k].capital) > 0), codes.some(k => !!account.accounts[k].horizonFund)];
        const done = fields.filter(Boolean).length;
        document.getElementById("progFill").style.width = (done / fields.length * 100) + "%";
        document.getElementById("progText").textContent = done + " / " + fields.length;
        hint.textContent = "账户参数已定";
        const ready = done === fields.length;
        btn.textContent = ready ? "💾 保存账户参数" : "填完资金与可用期限";
        btn.className = "fire-btn " + (ready ? "ready" : "locked");
        return;
      }

      if (currentMode === "buy_new" && activeFile) {
        document.getElementById("progFill").style.width = "100%";
        document.getElementById("progText").textContent = "回看";
        hint.textContent = "已保存的买入逻辑";
        btn.textContent = "＋ 新建一笔";
        btn.className = "fire-btn ready";
        return;
      }

      if (currentMode === "dash") {
        const held = trades.open.filter(tradeHasPosition).length;
        document.getElementById("progFill").style.width = "100%";
        document.getElementById("progText").textContent = held + " / " + trades.open.length;
        hint.textContent = "已有仓位 / 全部在途";
        btn.textContent = quotes.loading ? "拉取中…" : "🔄 刷新 + 拉行情";
        btn.className = "fire-btn ready";
        return;
      }

      if (currentMode === "fill") {
        const base = !!activeFile && needsFill() && activePrepared();
        const hasBatch = num(prep.fillPrice) > 0 && num(prep.fillShares) > 0;
        const filled = tradeFilledTotal(trades.open.find(x => x.file === activeFile));
        // 两种可提交：录一笔新的成交；或者不再买了、只把状态收口成持仓中。
        const finalizeOnly = !hasBatch && prep.fillComplete && filled.shares > 0;
        const ok = base && (hasBatch || finalizeOnly);
        document.getElementById("progFill").style.width = (ok ? 100 : 0) + "%";
        document.getElementById("progText").textContent = finalizeOnly ? "收口" : (num(prep.fillPrice) > 0 ? 1 : 0) + (num(prep.fillShares) > 0 ? 1 : 0) + " / 2";
        hint.textContent = finalizeOnly ? "不再追加 · 转持仓中" : (filled.batches ? "第 " + (filled.batches + 1) + " 笔 · 成交价 · 股数" : "成交价 · 股数");
        btn.textContent = !ok ? "填成交价与股数"
          : finalizeOnly ? "✅ 建仓收口 · 转入持仓中"
            : prep.fillComplete ? "确认建仓 · 收口转持仓中"
              : "确认这一笔 · 保持建仓中";
        btn.className = "fire-btn " + (ok ? "ready" : "locked");
        return;
      }

      // 已成交：只读档案；还在计划中：可以改计划
      if (currentMode === "prepare" && activeFile && !activeIsPlan()) {
        document.getElementById("progFill").style.width = "100%";
        document.getElementById("progText").textContent = "档案";
        hint.textContent = "只读回看 · 变更走事件";
        btn.textContent = "⇅ 要改投入金额 · 去「变更建仓计划」";
        btn.className = "fire-btn ready";
        return;
      }
      if (currentMode === "prepare" && !activeFile && !logicPassed()) {
        document.getElementById("progFill").style.width = "0%";
        document.getElementById("progText").textContent = "0 / 0";
        hint.textContent = "逻辑未通过";
        btn.textContent = "🔒 先去「① 买入逻辑」";
        btn.className = "fire-btn locked";
        return;
      }

      refreshCalcItems();
      const secs = currentSections();
      for (const sec of secs) {
        const c = sec.items.filter(itemSatisfied).length;
        const label = document.querySelector('.s-prog[data-sec="' + CSS.escape(sec.name) + '"]');
        if (label) label.textContent = c + " / " + sec.items.length + (sectionSatisfied(sec) ? " ✓" : "");
      }
      let done = 0, total = 0;
      for (const sec of secs) {
        if (sec.rule === "any") { total += 1; done += sectionSatisfied(sec) ? 1 : 0; }
        else { total += sec.items.length; done += sec.items.filter(itemSatisfied).length; }
      }
      document.getElementById("progFill").style.width = (total ? Math.round(done / total * 100) : 0) + "%";
      document.getElementById("progText").textContent = done + " / " + total;

      // 变更建仓计划：按方向换按钮，别让「缩减」页面上写着「确认加仓」。
      if (currentMode === "buy_add") {
        const m = metrics();
        if (Math.abs(m.add) < 0.01) {
          hint.textContent = "计划未变更";
          btn.textContent = "拖动或输入新的建仓计划";
          btn.className = "fire-btn locked";
          return;
        }
        if (m.trimming) {
          const ready = !!(prep.planNote || "").trim();
          document.getElementById("progFill").style.width = (ready ? 100 : 0) + "%";
          document.getElementById("progText").textContent = ready ? "1 / 1" : "0 / 1";
          hint.textContent = ready ? "缩减理由已写" : "还差理由";
          btn.textContent = ready
            ? "➖ 确认缩减 · 计划改为 " + fmtMoney(m.total)
            : "填一句为什么要改小";
          btn.className = "fire-btn " + (ready ? "ready" : "locked");
          return;
        }
      }

      if (!isGated()) {
        // 非对称摩擦：降低风险的方向永远可执行，进度条只是留痕的提示。
        // 唯一的硬要求是卖出成交价 —— 它不是摩擦，是记账。
        if (meta.kind === "sell" && !(num(prep.sellPrice) > 0)) {
          hint.textContent = "还差成交价";
          btn.textContent = "填成交价（算盈亏用）";
          btn.className = "fire-btn locked";
          return;
        }
        hint.textContent = "理由已记录（可空）";
        btn.textContent = def ? def.fireIdle : "确认";
        btn.className = "fire-btn ready";
        return;
      }
      hint.textContent = "条件已确认";
      const ready = allSatisfied();
      btn.textContent = ready ? (def ? def.fireIdle : "确认") : "还差几步 · 点我检查";
      btn.className = "fire-btn " + (ready ? "ready" : "locked");
    }

    /* =====================================================================
       Modal
       ===================================================================== */
    function missingItems() {
      const miss = [];
      if (currentMode === "buy_new" && !(prep.symbol || "").trim()) miss.push({ label: "还没填标的", sec: "标的" });
      for (const sec of currentSections()) {
        if (sectionSatisfied(sec)) continue;
        if (sec.rule === "any") { miss.push({ label: "至少满足一条", sec: sec.name }); continue; }
        for (const it of sec.items) {
          if (itemSatisfied(it)) continue;
          const extra = it.type === "calc" ? "（" + it.calc().detail + "）" : it.type === "text" ? "（未填写）" : "";
          miss.push({ label: it.label + extra, sec: sec.name });
        }
      }
      return miss;
    }

    function decisionAuditPayload(passed, tradeFile) {
      const file = tradeFile || activeFile || "";
      const item = trades.open.concat(trades.closed).find(x => x.file === file) || null;
      const front = item ? (item.front || {}) : {};
      const def = currentModeDef();
      const gates = currentSections().map(sec => ({
        label: sec.name,
        items: sec.items.map(it => ({
          label: stripTags(it.label || it.id || ""),
          checked: it.type === "calc"
            ? it.calc().state === "pass"
            : it.type === "text" ? !!tget(it, currentMode).trim() : !!cget(it, currentMode),
          redline: !!it.redline,
        })),
      }));
      return {
        schemaVersion: 1,
        date: todayStr(),
        mode: currentMode,
        modeLabel: def ? def.title : (MODE_META[currentMode] || {}).navLabel,
        passed: !!passed,
        target: front["标的"] || (prep.symbol || "").trim() || file,
        ticker: front.Ticker || (prep.ticker || "").trim().toUpperCase(),
        tradeFile: file,
        gates: gates,
        missing: passed ? [] : missingItems().map(x => stripTags(x.label)),
      };
    }

    async function saveDecisionAudit(passed, tradeFile) {
      if (!serverOk) return;
      await api("/api/audit/save", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(decisionAuditPayload(passed, tradeFile)),
      });
    }

    function showWarn() {
      saveDecisionAudit(false).catch(() => toast("未能写入本次拦截审计，请检查本地服务"));
      const def = currentModeDef();
      const modal = document.getElementById("modal");
      modal.className = "modal warn shake";
      document.getElementById("mBadge").textContent = "⚠️";
      document.getElementById("mTitle").textContent = "先别动手 —— 你忘了吃过的亏了吗？";
      document.getElementById("mSub").textContent = "下面这些条件还没成立。跳过它们扣扳机，就是在重复上一次的错误。";
      const q = document.getElementById("mQuote");
      q.style.display = "block";
      q.innerHTML = (def && def.warnQuote) || "计算型的红线点不绿 —— 回去改数字，别在这里说服自己。";

      const miss = missingItems();
      const list = document.getElementById("mList");
      list.style.display = "block";
      list.innerHTML = '<div class="ml-head">还没成立 · ' + miss.length + ' 项</div><ul>' +
        miss.map(x => '<li>' + escapeHTML(stripTags(x.label)) + '<span class="li-sec">· ' + escapeHTML(x.sec) + '</span></li>').join("") + '</ul>';

      document.getElementById("mActions").innerHTML =
        '<button class="m-btn danger" id="mPass">我确实不满足 · 放弃这笔</button>' +
        '<button class="m-btn solid" id="mBack">回去补齐</button>';
      document.getElementById("mBack").onclick = closeModal;
      document.getElementById("mPass").onclick = closeModal;
      openOverlay();
    }

    /* 加仓不弹「确认」，弹压力测试 —— 信念峰值即风险峰值。 */
    function stressHTML() {
      const m = metrics();
      const after = m.total * (1 - STRESS_DROP);
      const loss = m.total * STRESS_DROP;
      const lossPct = m.cap ? (loss / m.cap * 100).toFixed(2) + "%" : "—";
      const stopGap = m.stopPct ? (m.stopPct - STRESS_DROP * 100).toFixed(1) : null;
      return '<table class="m-tbl">' +
        '<tr><th>项目</th><th>现在</th><th>再跌 ' + (STRESS_DROP * 100) + '% 之后</th></tr>' +
        '<tr><td>持仓市值</td><td>' + fmtMoney(m.total) + '</td><td><b>' + fmtMoney(after) + '</b></td></tr>' +
        '<tr class="bad"><td>浮亏金额</td><td>—</td><td><b>' + fmtMoney(loss) + '</b></td></tr>' +
        '<tr class="bad"><td>占账户</td><td>' + (m.cap ? (m.ratio * 100).toFixed(1) + '%' : '—') + '</td><td><b>亏掉账户 ' + lossPct + '</b></td></tr>' +
        '<tr><td>距止损位</td><td>' + (m.stopPct ? '-' + m.stopPct.toFixed(1) + '%' : '未设') + '</td><td><b>' +
        (stopGap === null ? '未设止损' : (stopGap > 0 ? '还差 ' + stopGap + '%' : '已击穿止损 ' + Math.abs(stopGap) + '%')) + '</b></td></tr>' +
        '</table>';
    }

    function showPass() {
      const def = currentModeDef();
      const meta = MODE_META[currentMode];
      const modal = document.getElementById("modal");
      modal.className = "modal pass";
      document.getElementById("mBadge").textContent = meta.kind === "sell" ? "✅" : meta.kind === "admin" ? "⚖️" : "🚀";
      document.getElementById("mTitle").textContent = def.passTitle;
      document.getElementById("mSub").textContent = def.passSub;
      const q = document.getElementById("mQuote");
      q.style.display = "block";
      q.innerHTML = "💡 " + def.passQuote;

      const list = document.getElementById("mList");
      if (currentMode === "fill") {
        const o = effectivePlan(), code = o.account || o.currency || "CNY";
        const planned = num(o.amount), actual = num(prep.fillPrice) * num(prep.fillShares);
        const diff = planned ? (actual - planned) / planned * 100 : 0;
        list.style.display = "block";
        list.innerHTML = '<div class="ml-head">计划 vs 实际</div><table class="m-tbl">' +
          '<tr><td>计划投入</td><td><b>' + fmtMoney(planned, code) + '</b></td></tr>' +
          '<tr><td>实际投入</td><td><b>' + fmtMoney(actual, code) + '</b></td></tr>' +
          '<tr' + (Math.abs(diff) > 10 ? ' class="bad"' : '') + '><td>偏差</td><td><b>' + (diff >= 0 ? "+" : "") + diff.toFixed(1) + '%</b></td></tr>' +
          '<tr><td>成交价 × 股数</td><td><b>' + num(prep.fillPrice) + ' × ' + num(prep.fillShares) + '</b></td></tr></table>';
      } else if (currentMode === "buy_add" && !metrics().trimming) {
        list.style.display = "block";
        list.innerHTML = '<div class="ml-head">压力测试 · 加完之后如果再跌 ' + (STRESS_DROP * 100) + '%</div>' + stressHTML();
      } else if (currentMode === "prepare") {
        const mins = prep.startedAt ? Math.floor((Date.now() - prep.startedAt) / 60000) : 0;
        list.style.display = "block";
        list.innerHTML = '<div class="ml-head">决策用时 · ' + mins + ' 分钟</div>' +
          '<div class="i-note" style="padding:2px 0">' +
          (mins < COOL_MIN * 2
            ? '决策创建到扣扳机的间隔越短，这套流程越接近<em>事后合法化</em>。这个数字会写进决策文件，以后能看出系统有没有在腐化。'
            : '想得够久。这个数字会写进决策文件 —— 它是系统有没有腐化的观测点。') + '</div>';
      } else {
        list.style.display = "none";
      }

      // 买入逻辑一通过就建档；建仓准备是同一文件的第二个审视时点。
      if (currentMode === "buy_new") {
        document.getElementById("mActions").innerHTML =
          '<button class="m-btn" id="mReview">再看一眼</button>' +
          '<button class="m-btn go" id="mGo">' + (serverOk ? '确认保存 · 去建仓准备 →' : '去建仓准备 →') + '</button>';
        document.getElementById("mReview").onclick = closeModal;
        document.getElementById("mGo").onclick = () => {
          if (serverOk) commit();
          else { closeModal(); switchMode("prepare"); }
        };
        openOverlay();
        return;
      }

      const closing = meta.kind === "sell" && prep.sellPortion === "all";
      document.getElementById("mActions").innerHTML =
        '<button class="m-btn" id="mReview">再看一眼</button>' +
        '<button class="m-btn go" id="mGo">' + (serverOk
          ? (closing ? "确认 · 填结果验证并归档" : "确认 · 写入决策文件")
          : "确认（当前无法保存）") + '</button>';
      document.getElementById("mReview").onclick = closeModal;
      document.getElementById("mGo").onclick = () => {
        if (!serverOk) { closeModal(); resetMode(); toast("已确认（未连本地服务，未写盘）"); return; }
        if (closing) showCloseForm(); else commit();
      };
      openOverlay();
    }

    /* 平仓：先填结果验证，再归档。这是整套系统里唯一一次「回头对账」的机会。 */
    function showCloseForm() {
      const modal = document.getElementById("modal");
      modal.className = "modal pass";
      document.getElementById("mBadge").textContent = "🧾";
      document.getElementById("mTitle").textContent = "结果验证 · 这笔交易的收口";
      document.getElementById("mSub").textContent = "填完就归档到 已平仓/。这几栏是以后唯一能拿来审判今天这个判断的东西。";
      const q = document.getElementById("mQuote");
      q.style.display = "block";
      q.innerHTML = "💡 结构层的教训是可以从别人的尸体上免费学会的，但只有你自己的这份记录，能告诉你该在哪一步装闸门。";

      const list = document.getElementById("mList");
      list.style.display = "block";
      // 已实现盈亏由成交价算出来，不再手抄：它要被结转进账户资金基数，必须是个数。
      const cp = activePosition(), cpos = sellPositionPreview(), cItem = activeTradeItem();
      const cCode = cItem ? tradeAcct(cItem) : prep.account;
      const priorPnl = cItem ? tradeRealizedPnl(cItem) : 0;              // 之前减仓已实现的部分
      const closePnl = cp && cp.costPrice && num(prep.sellPrice)
        ? +((num(prep.sellPrice) - cp.costPrice) * cpos.sell).toFixed(2) : 0;
      const totalPnl = +(priorPnl + closePnl).toFixed(2);
      const pnlPct = cp && cp.costPrice && cpos.sell ? (num(prep.sellPrice) - cp.costPrice) / cp.costPrice * 100 : null;
      const pnlText = (totalPnl >= 0 ? "+" : "") + fmtMoney(totalPnl, cCode) +
        (pnlPct == null ? "" : "（本次 " + (pnlPct >= 0 ? "+" : "") + pnlPct.toFixed(2) + "%）");
      list.innerHTML =
        '<div class="m-form">' +
        '<div><div class="m-field-label">实际盈亏 · 系统结算</div>' +
        '<div class="fill-sum ' + (totalPnl >= 0 ? "ok" : "bad") + '">' + pnlText + '</div>' +
        '<div class="pf-hint">成交价 ' + (num(prep.sellPrice) || "—") + ' × 成本价 ' + (cp && cp.costPrice || "—") + ' × ' + fmtShares(cpos.sell) + ' 股' +
        (priorPnl ? '，含之前减仓已实现 ' + fmtMoney(priorPnl, cCode) : '') + '。' +
        '<br><b>归档后这 ' + fmtMoney(totalPnl, cCode) + ' 会自动并入' + (CURRENCY[cCode] ? CURRENCY[cCode].label : cCode) + '账户的资金基数</b>，并在「账户参数 · 资金变动记录」留一条平仓结转。</div></div>' +
        '<div><div class="m-field-label">建仓时的假设 vs 实际发生</div><textarea id="cfDiff" rows="3" placeholder="当时以为会怎样，实际怎样。哪条失效信号被触发了？还是根本没触发、我自己走的？"></textarea></div>' +
        '<div><div class="m-field-label">这笔错在哪一层</div><div class="pf-opts" id="cfLayer">' +
        ["策略内核（看错方向）", "结构约束（仓位·期限·出局权）", "操盘执行（没按纪律走）", "没错（正常概率）"]
          .map(l => '<button class="pf-opt" data-v="' + l + '">' + l + '</button>').join("") +
        '</div></div>' +
        '<div><div class="m-field-label">该在哪里加拦截点</div><textarea id="cfGate" rows="2" placeholder="下次同类情况，系统应该在哪一步拦住我？"></textarea></div>' +
        '</div>';
      let layer = "";
      list.querySelectorAll("#cfLayer .pf-opt").forEach(b => {
        b.onclick = () => {
          layer = b.dataset.v;
          list.querySelectorAll("#cfLayer .pf-opt").forEach(x => x.classList.toggle("on", x === b));
        };
      });

      document.getElementById("mActions").innerHTML =
        '<button class="m-btn" id="mBack2">先不归档</button>' +
        '<button class="m-btn go" id="mArchive">归档这笔交易</button>';
      document.getElementById("mBack2").onclick = closeModal;
      document.getElementById("mArchive").onclick = () => commit({
        pnl: pnlText,
        realizedPnl: totalPnl,
        account: cCode,
        diff: (list.querySelector("#cfDiff").value || "").trim(),
        layer: layer,
        gate: (list.querySelector("#cfGate").value || "").trim(),
      });
    }

    /* 作废：唯一一个「让记录消失在主流程之外」的出口，所以必须写清为什么。
       它回答的是「这条记录本就不该存在」，不是「我改主意了」—— 后者应该去改建仓计划。 */
    function showVoidForm(item) {
      if (!item) return;
      if (!tradeVoidable(item)) {
        toast("这笔已经有真实成交 —— 有仓位就必须有出场记录，请走止损 / 平仓");
        return;
      }
      const f = item.front || {}, plan = decisionPlan(item), code = tradeAcct(item);
      const modal = document.getElementById("modal");
      modal.className = "modal warn";
      document.getElementById("mBadge").textContent = "🗑";
      document.getElementById("mTitle").textContent = "作废这份建仓计划";
      document.getElementById("mSub").textContent =
        (f["标的"] || item.file) + " · 计划投入 " + fmtMoney(num(plan.amount), code) + " · 一笔都没成交";
      const q = document.getElementById("mQuote");
      q.style.display = "block";
      q.innerHTML = "💡 作废是给「这条记录本就不该存在」用的：标的填错、重复建档、想法当天就被自己否了。" +
        "如果你只是<b>改主意想少买点</b>，那不该作废 —— 去「变更建仓计划」把金额改小，那样这次改变本身也会被记下来。";
      const list = document.getElementById("mList");
      list.style.display = "block";
      list.innerHTML =
        '<div class="m-form">' +
        '<div><div class="m-field-label">作废原因 · 必填</div>' +
        '<textarea id="vfReason" rows="3" placeholder="为什么这条建档不该存在？（标的 / 代码填错、重复建档、当天就否了这个想法…）"></textarea></div>' +
        '</div>' +
        '<div class="flag warn"><span>⚠️</span><div>文件会追加一条 <b>作废事件</b> 并移进 <b>已作废/</b>，不会被删除。' +
        '作废后它不再占用「待建计划」和「剩余可开」。</div></div>';
      document.getElementById("mActions").innerHTML =
        '<button class="m-btn" id="mVoidBack">先不作废</button>' +
        '<button class="m-btn go" id="mVoidGo">确认作废</button>';
      document.getElementById("mVoidBack").onclick = closeModal;
      document.getElementById("mVoidGo").onclick = async () => {
        const reason = (list.querySelector("#vfReason").value || "").trim();
        if (!reason) { toast("作废必须写原因 —— 否则半年后你只会看到一条凭空消失的记录"); return; }
        await voidTrade(item, reason);
      };
      openOverlay();
    }

    async function voidTrade(item, reason) {
      const plan = decisionPlan(item), code = tradeAcct(item);
      const name = (item.front || {})["标的"] || item.file;
      const L = [];
      L.push("### " + nowStamp() + " · 🗑 作废建仓计划");
      L.push("");
      L.push("**作废原因：** " + reason);
      L.push("");
      L.push("| 项目 | 值 |");
      L.push("| --- | --- |");
      L.push("| 作废日 | " + todayStr() + " |");
      L.push("| 当时的计划投入 | " + fmtMoney(num(plan.amount), code) + " |");
      L.push("| 实际成交 | 无（零成交计划） |");
      L.push("");
      L.push("> 本笔从未成交，作废不产生盈亏，也不影响账户资金基数。");
      L.push("");
      L.push("<!-- ymos-trade-event -->");
      L.push("```json");
      L.push(JSON.stringify({
        schemaVersion: 1, ts: nowStamp(), kind: "void",
        void: { reason: reason, voidDate: todayStr(), plannedAmount: num(plan.amount), account: code, filledAmount: 0 },
        changesPositionFacts: false,
      }, null, 2));
      L.push("```");
      try {
        const j = await api("/api/trade/void", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ file: item.file, voidDate: todayStr(), block: L.join("\n") }),
        });
        if (activeFile === item.file) activeFile = "";
        closeModal();
        await loadTrades();
        renderAll();
        toast("已作废 " + name + " · 归档到 " + j.rel);
      } catch (e) {
        toast(e.status === 409 ? "只有零成交的计划能作废 —— 有仓位请走平仓" : "作废失败：" + (e.message || "服务未启动？"));
      }
    }

    function openOverlay() {
      document.getElementById("overlay").classList.add("show");
    }
    function closeModal() {
      document.getElementById("overlay").classList.remove("show");
      document.getElementById("modal").classList.remove("shake");
    }

    /* =====================================================================
       写盘：把当前动作变成决策文件里的一段
       ===================================================================== */
    const KIND_ICON = { open: "🧠", prepare: "🧱", revise: "✏️", fill: "✅", add: "➕", trim: "➖", tp: "🟢", sl: "🔻", adjust: "⚖️", close: "🧾" };
    const KIND_LABEL = { open: "买入逻辑建档", prepare: "建仓准备", revise: "建仓准备修订", fill: "确认建仓", add: "加仓 · 调大建仓计划", trim: "缩减建仓计划", tp: "止盈 / 减仓", sl: "止损", adjust: "调整止损", close: "全部平仓" };
    function modeKind() {
      if (currentMode === "buy_new") return "open";
      if (currentMode === "prepare") return activePrepared() ? "revise" : "prepare";
      if (currentMode === "fill") return "fill";
      return currentMode === "buy_add" ? (metrics().trimming ? "trim" : "add")
        : currentMode === "sell_tp" ? "tp" : currentMode === "sell_sl" ? "sl" : "adjust";
    }

    /* 每个事件只记当下审视的内容：open 记买入逻辑，prepare 记复核后的论点与结构参数。 */
    function summarySections() { return currentSections(); }
    function modeOf() { return currentMode; }
    function pickedSummary() {
      const out = [];
      for (const sec of summarySections()) {
        const md = modeOf(sec);
        const ok = it => it.type === "calc" ? (it.calc().state === "pass" || (it.calc().state === "idle" && it.idleOk)) : cget(it, md);
        // 未校验的计算型闸门要如实标出来 —— 记录里不能让「没数据」看起来像「已通过」
        const picked = sec.items.filter(it => it.type !== "text" && ok(it))
          .map(it => it.label + (it.type === "calc" && it.calc().state === "idle" ? "（未校验）" : ""));
        if (picked.length) out.push("- **" + sec.name + "**：" + picked.join("、"));
      }
      return out;
    }
    function textSummary() {
      const out = [];
      for (const sec of summarySections()) {
        const md = modeOf(sec);
        for (const it of sec.items) {
          if (it.type !== "text") continue;
          const v = tget(it, md).trim();
          if (v) out.push("**" + it.label + "：** " + v);
        }
      }
      return out;
    }

    function eventJSON(kind, extra) {
      const m = metrics();
      const c = {}, x = {};
      for (const sec of summarySections()) {
        const md = modeOf(sec);
        for (const it of sec.items) {
          if (it.type === "text") { const v = tget(it, md); if (v) x[it.id] = v; }
          else if (it.type !== "calc" && cget(it, md)) c[it.id] = true;
        }
      }
      const j = {
        schemaVersion: 1, ts: nowStamp(), kind: kind, strategy: currentStrategy, checks: c, texts: x,
        metrics: {
          account: prep.account, capital: m.cap, amount: m.total, ratio: +m.ratio.toFixed(4),
          horizonFund: prepAccount().horizonFund || "", horizonThesis: prep.horizonThesis || "",
          maxSingleRatio: account.maxSingleRatio, exitControl: prep.exitControl || "",
          noStop: !!prep.noStop, stopPct: prep.noStop ? null : +m.stopPct.toFixed(2), maxLoss: Math.round(m.maxLoss),
        },
      };
      if (kind === "add" || kind === "trim") {
        // 改的是「建仓计划总额」：持仓股数 / 成本价这些事实仍然只由 fill 事件写。
        // 服务端收到这个事件会重设 建仓计划 与状态，实际成交回「③ 确认建仓」分批录。
        const filled = tradeFilledTotal(activeTradeItem());
        j.planOnly = true;
        j.changesPositionFacts = false;
        j.changesPlanAmount = true;
        j.plannedTotal = m.total;
        j.plan = {
          previousTotal: m.base, newTotal: m.total, delta: +m.add.toFixed(2),
          direction: kind === "trim" ? "decrease" : "increase",
          filledAmount: filled.amount, filledShares: filled.shares,
          // 缩到刚好等于已建仓 = 这笔到此为止，服务端会顺手收口成持仓中
          settlesBuild: m.total <= filled.amount + 0.01,
          reason: (prep.planNote || "").trim(),
        };
      }
      if (kind === "fill") {
        const o = effectivePlan(), before = tradeFilledTotal(activeTradeItem());
        const price = num(prep.fillPrice), shares = num(prep.fillShares);
        // finalizeOnly = 这一次不再买了，只是把「建仓中」收口成「持仓中」
        const finalizeOnly = !(price > 0 && shares > 0);
        const amount = finalizeOnly ? 0 : +(price * shares).toFixed(2);
        j.fill = {
          batchIndex: before.batches + (finalizeOnly ? 0 : 1),
          finalizeOnly: finalizeOnly,
          complete: !!prep.fillComplete,
          price: finalizeOnly ? null : price,
          shares: finalizeOnly ? 0 : shares,
          actualAmount: amount,
          sharesBefore: before.shares, sharesAfter: before.shares + (finalizeOnly ? 0 : shares),
          filledBefore: before.amount, filledAfter: +(before.amount + amount).toFixed(2),
          plannedAmount: num(o.amount), note: prep.fillNote || "",
        };
        j.fill.progressPct = j.fill.plannedAmount ? +((j.fill.filledAfter / j.fill.plannedAmount) * 100).toFixed(2) : null;
        j.fill.deviationPct = j.fill.plannedAmount ? +(((j.fill.filledAfter - j.fill.plannedAmount) / j.fill.plannedAmount) * 100).toFixed(2) : null;
        j.fill.remaining = j.fill.plannedAmount ? +Math.max(0, j.fill.plannedAmount - j.fill.filledAfter).toFixed(2) : 0;
      }
      if (prep.startedAt) j.deliberationMin = Math.floor((Date.now() - prep.startedAt) / 60000);
      // 冷却期跳没跳过要如实记录 —— 事后能把「跳过的交易」和「等满的交易」分开算胜率
      j.coolSkipped = !!prep.coolSkipped;
      if (MODE_META[currentMode].kind === "sell") {
        const p = activePosition(), pos = sellPositionPreview(), sellPrice = num(prep.sellPrice);
        j.sell = {
          portion: prep.sellPortion, ratio: SELL_PORTION[prep.sellPortion].ratio,
          beforeShares: pos.before, sellShares: pos.sell, remainingShares: pos.remain,
          costPrice: p ? p.costPrice : null, price: sellPrice || null,
          realizedPnl: sellPrice && p && p.costPrice ? +((sellPrice - p.costPrice) * pos.sell).toFixed(2) : null,
          note: prep.sellNote || "",
        };
      }
      if (kind === "adjust") {
        const p = activePosition(), old = p ? p.plan : {};
        j.adjust = {
          previous: { noStop: !!old.noStop, stopPct: old.noStop ? null : num(old.stopPct), exitRule: old.exitRule || activeTexts.x4 || "" },
          mode: prep.adjustMode,
          noStop: prep.adjustMode === "logic",
          stopPct: prep.adjustMode === "price" ? num(prep.adjustStopPct) : null,
          exitRule: prep.adjustMode === "logic" ? (prep.adjustExitRule || "").trim() : "",
          shares: p ? p.shares : null,
          costPrice: p ? p.costPrice : null,
          stopPrice: p && p.costPrice && prep.adjustMode === "price" ? +(p.costPrice * (1 - num(prep.adjustStopPct) / 100)).toFixed(4) : null,
          maxLoss: p && prep.adjustMode === "price" ? +(p.costAmount * num(prep.adjustStopPct) / 100).toFixed(2) : null,
        };
      }
      return Object.assign(j, extra || {});
    }

    function buildEventBlock(kind, extra) {
      const L = [];
      L.push("### " + nowStamp() + " · " + KIND_ICON[kind] + " " + KIND_LABEL[kind] +
        (kind === "tp" || kind === "sl" ? " · " + SELL_PORTION[prep.sellPortion].label : ""));
      L.push("");
      const picked = pickedSummary();
      if (picked.length) { L.push.apply(L, picked); L.push(""); }
      else if (MODE_META[currentMode].kind === "sell") { L.push("- **未勾选任何触发条件** —— 如实记录：这次卖出没有对上预设条件。"); L.push(""); }
      const txts = textSummary();
      if (txts.length) { txts.forEach(t => { L.push(t); L.push(""); }); }
      if (MODE_META[currentMode].kind === "sell") {
        const pos = sellPositionPreview();
        const bits = ["比例 " + SELL_PORTION[prep.sellPortion].label, "卖出 " + fmtShares(pos.sell), "剩余 " + fmtShares(pos.remain)];
        if (num(prep.sellPrice)) bits.push("成交价 " + prep.sellPrice);
        L.push("执行：" + bits.join(" · "));
        if ((prep.sellNote || "").trim()) { L.push(""); L.push("> " + prep.sellNote.trim()); }
        L.push("");
      }
      if (kind === "adjust") {
        const p = activePosition(), old = p ? p.plan : {}, code = old.account || old.currency || "CNY";
        const oldRule = old.noStop ? "逻辑退出：" + (old.exitRule || activeTexts.x4 || "按原论点失效信号") : (num(old.stopPct) ? "价格止损 -" + num(old.stopPct).toFixed(1) + "%" : "未定义");
        const newRule = prep.adjustMode === "logic" ? "逻辑退出：" + prep.adjustExitRule.trim() : "价格止损 -" + num(prep.adjustStopPct).toFixed(1) + "%";
        L.push("| 调整项 | 调整前 | 调整后 |");
        L.push("| --- | --- | --- |");
        L.push("| 生效退出规则 | " + String(oldRule).replace(/\|/g, "\\|") + " | **" + String(newRule).replace(/\|/g, "\\|") + "** |");
        if (p && p.costPrice && prep.adjustMode === "price") {
          L.push("| 对应价位 | — | " + fmtMoney(p.costPrice * (1 - num(prep.adjustStopPct) / 100), code) + " |");
          L.push("| 全仓最大亏损 | — | " + fmtMoney(p.costAmount * num(prep.adjustStopPct) / 100, code) + " |");
        }
        L.push("");
      }
      if (kind === "fill") {
        const o = effectivePlan(), code = o.account || o.currency || "CNY";
        const before = tradeFilledTotal(activeTradeItem());
        const price = num(prep.fillPrice), shares = num(prep.fillShares);
        const finalizeOnly = !(price > 0 && shares > 0);
        const batch = finalizeOnly ? 0 : price * shares;
        const planned = num(o.amount), after = before.amount + batch;
        const sharesAfter = before.shares + (finalizeOnly ? 0 : shares);
        const diff = planned ? (after - planned) / planned * 100 : 0;
        L.push("| 项目 | 本次 | 累计 | 计划 |");
        L.push("| --- | --- | --- | --- |");
        L.push("| 投入金额 | " + (finalizeOnly ? "—（仅收口）" : fmtMoney(batch, code)) + " | **" + fmtMoney(after, code) + "** | " +
          fmtMoney(planned, code) + (planned ? "（进度 " + (after / planned * 100).toFixed(1) + "% · 偏差 " + (diff >= 0 ? "+" : "") + diff.toFixed(1) + "%）" : "") + " |");
        L.push("| 成交价 / 股数 | " + (finalizeOnly ? "— | —" : price + " × " + fmtShares(shares) + " | " + fmtShares(sharesAfter) + " 股（均价 " + (sharesAfter ? +(after / sharesAfter).toFixed(4) : 0) + "）") + " | — |");
        L.push("| 建仓批次 | 第 " + (before.batches + (finalizeOnly ? 0 : 1)) + " 笔 | " + (prep.fillComplete ? "**建仓收口 · 转持仓中**" : "**未建满 · 保持建仓中**") + " | — |");
        L.push("");
        if ((prep.fillNote || "").trim()) { L.push("> " + prep.fillNote.trim()); L.push(""); }
      }
      if (kind === "trim") {
        const m = metrics(), filled = tradeFilledTotal(activeTradeItem());
        const code = prep.account || "CNY";
        L.push("**缩减的是建仓计划，不是已经买进去的仓位。** 已建仓的 " + fmtMoney(filled.amount, code) + " 一股没动。");
        L.push("");
        L.push("| 项目 | 调整前 | 调整后 |");
        L.push("| --- | --- | --- |");
        L.push("| 建仓计划 | " + fmtMoney(m.base, code) + " | **" + fmtMoney(m.total, code) + "**（" + fmtMoney(m.add, code) + "） |");
        L.push("| 已建仓 | " + fmtMoney(filled.amount, code) + " | " + fmtMoney(filled.amount, code) + "（不变） |");
        L.push("| 还需建仓 | " + fmtMoney(Math.max(0, m.base - filled.amount), code) + " | **" + fmtMoney(Math.max(0, m.total - filled.amount), code) + "** |");
        L.push("| 占账户 | " + (m.cap ? (m.base / m.cap * 100).toFixed(1) + "%" : "—") + " | " + (m.cap ? (m.ratio * 100).toFixed(1) + "%" : "—") + " |");
        L.push("");
        if ((prep.planNote || "").trim()) { L.push("> " + prep.planNote.trim()); L.push(""); }
        if (m.total <= filled.amount + 0.01) {
          L.push("_计划已缩到等于已建仓金额 —— 本笔建仓就此收口，状态转「持仓中」。_");
          L.push("");
        }
      }
      if (kind === "add") {
        const m = metrics();
        L.push("**加仓改的是建仓计划，不是持仓事实** —— 实际成交仍然回「③ 确认建仓」分批录入，状态回到「建仓中」。");
        L.push("");
        if ((prep.planNote || "").trim()) { L.push("> " + prep.planNote.trim()); L.push(""); }
        L.push("加仓后计划总投入 " + fmtMoney(m.total) + "（占账户 " + (m.ratio * 100).toFixed(1) + "%）；" +
          "压力测试 —— 再跌 " + (STRESS_DROP * 100) + "% 则浮亏 " + fmtMoney(m.total * STRESS_DROP) +
          "，占账户 " + (m.cap ? (m.total * STRESS_DROP / m.cap * 100).toFixed(2) : "—") + "%。");
        L.push("");
      }
      if (prep.startedAt) {
        L.push("_决策用时 " + Math.floor((Date.now() - prep.startedAt) / 60000) + " 分钟_");
        L.push("");
      }
      L.push("<!-- ymos-trade-event -->");
      L.push("```json");
      L.push(JSON.stringify(eventJSON(kind, extra), null, 2));
      L.push("```");
      return L.join("\n");
    }

    function buildOpenMarkdown() {
      const strat = STRATEGIES[currentStrategy];
      const symbol = (prep.symbol || "").trim();
      const openJSON = {
        schemaVersion: 1, version: 3, kind: "open", stage: "buy_logic", symbol: symbol,
        ticker: (prep.ticker || "").trim().toUpperCase(), strategy: currentStrategy, openDate: todayStr(),
        coolSkipped: !!prep.coolSkipped,
      };
      const L = [];
      L.push("---");
      L.push("ymos_trade: v1");
      L.push("标的: " + (symbol || "—"));
      if ((prep.ticker || "").trim()) L.push("Ticker: " + prep.ticker.trim().toUpperCase());
      L.push("策略: " + strat.label);
      L.push("建仓决策日: " + todayStr());
      L.push("状态: " + ST_PLAN);
      L.push("---");
      L.push("");
      L.push("# " + (symbol || "未命名") + " · 买卖决策记录");
      L.push("");
      L.push("> 本文件 **append-only**：买入逻辑已建档；建仓准备的复核与修改都以新事件追加，不覆盖当时的判断。");
      L.push("");
      L.push("## 买入逻辑档案");
      L.push("");
      L.push("| 项目 | 值 |");
      L.push("| --- | --- |");
      L.push("| 冷却期 | " + (prep.coolSkipped ? "⚠️ 已跳过（短线 / 补录）" : "已等满 " + COOL_MIN + " 分钟") + " |");
      L.push("| 策略 | " + strat.label + " |");
      if (symbol) L.push("| 关联备忘录 | [[持仓与关注/持仓/" + symbol + "/买入卖出备忘录]] |");
      L.push("");
      const txts = textSummary();
      if (txts.length) { txts.forEach(t => { L.push(t); L.push(""); }); }
      L.push("<!-- ymos-trade-open -->");
      L.push("```json");
      L.push(JSON.stringify(openJSON, null, 2));
      L.push("```");
      L.push("");
      L.push("---");
      L.push("");
      L.push("## 决策事件流");
      L.push("");
      L.push(buildEventBlock("open"));
      L.push("");
      return L.join("\n");
    }

    function buildCloseBlock(result) {
      const L = [];
      L.push(buildEventBlock("close", { closing: true, exitKind: modeKind(), result: result }));
      L.push("");
      L.push("---");
      L.push("");
      L.push("## 结果验证");
      L.push("");
      L.push("| 项目 | 内容 |");
      L.push("| --- | --- |");
      const code = result.account || prep.account || "CNY";
      L.push("| 平仓日 | " + todayStr() + " |");
      L.push("| 实际盈亏 | " + (result.pnl || "—") + " |");
      L.push("| 资金结转 | " + (result.realizedPnl == null ? "—" :
        (num(result.realizedPnl) >= 0 ? "+" : "") + fmtMoney(num(result.realizedPnl), code) + " 并入 " +
        (CURRENCY[code] ? CURRENCY[code].label : code) + "账户资金基数") + " |");
      L.push("| 错在哪一层 | " + (result.layer || "—") + " |");
      L.push("");
      if (result.diff) { L.push("**建仓假设 vs 实际发生：** " + result.diff); L.push(""); }
      if (result.gate) { L.push("**该在哪里加拦截点：** " + result.gate); L.push(""); }
      return L.join("\n");
    }

    async function commit(result) {
      const kind = modeKind();
      let savedFile = activeFile;
      try {
        if (kind === "open") {
          const j = await api("/api/trade/open", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: (prep.symbol || "").trim(), code: (prep.ticker || "").trim().toUpperCase(), date: todayStr(), markdown: buildOpenMarkdown() }),
          });
          activeFile = j.file;
          savedFile = j.file;
          toast("已写入 " + j.rel);
        } else if (!activeFile) {
          toast("没选持仓 —— 先在顶部选一笔决策文件"); return;
        } else if (kind === "fill") {
          // 分批建仓：这里送的是「本次这一笔」的增量，累加与加权成本由服务端按文件事实算。
          const price = num(prep.fillPrice), shares = num(prep.fillShares);
          const finalizeOnly = !(price > 0 && shares > 0);
          const j = await api("/api/trade/fill", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              file: activeFile, fillDate: todayStr(), block: buildEventBlock("fill"),
              shares: finalizeOnly ? 0 : shares,
              costPrice: finalizeOnly ? 0 : price,
              actualAmount: finalizeOnly ? 0 : +(price * shares).toFixed(2),
              complete: !!prep.fillComplete,
              finalizeOnly: finalizeOnly,
            }),
          });
          toast(finalizeOnly ? "建仓已收口 · 转入持仓中"
            : prep.fillComplete ? "第 " + j.batch + " 笔已录入 · 建仓完成" : "第 " + j.batch + " 笔已录入 · 仍在建仓中");
        } else if (result) {
          const closingItem = activeTradeItem();
          const closingFile = activeFile;
          const closingName = (closingItem && closingItem.front && closingItem.front["标的"]) || (activeOpen && activeOpen.symbol) || closingFile;
          const j = await api("/api/trade/close", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ file: activeFile, closeDate: todayStr(), block: buildCloseBlock(result) }),
          });
          activeFile = "";
          // 归档成功之后才结转 —— 文件没落地就动资金基数，会留下一笔对不上账的钱。
          await settleClosedTrade({
            file: closingFile, symbol: closingName,
            account: result.account || (closingItem ? tradeAcct(closingItem) : prep.account),
            amount: num(result.realizedPnl), closeDate: todayStr(),
          });
          toast("已归档 " + j.rel + " · 盈亏已结转进资金基数");
        } else if ((kind === "tp" || kind === "sl") && prep.sellPortion !== "all") {
          const p = activePosition(), pos = sellPositionPreview();
          const j = await api("/api/trade/sell", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              file: activeFile, block: buildEventBlock(kind),
              remainingShares: pos.remain,
              costPrice: p ? p.costPrice : "",
            }),
          });
          toast("已减仓并更新剩余股数 · " + j.rel);
        } else {
          const j = await api("/api/trade/append", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ file: activeFile, block: buildEventBlock(kind) }),
          });
          toast("已追加进 " + j.rel);
        }
      } catch (e) {
        if (e.status === 409) { toast("这个标的今天已有决策文件 —— 用「加仓」往那份文件追加"); }
        else {
          toast(location.protocol === "file:"
            ? "未写入 Markdown：请启动 Console/server.py 后从本地地址打开"
            : "写入失败：" + (e.message || "服务未启动？"));
          serverOk = false;
        }
        closeModal();
        return;
      }
      try {
        await saveDecisionAudit(true, savedFile);
      } catch (e) {
        toast("动作已写盘，但决策审计留痕失败");
      }
      closeModal();
      // 每次写入后立即重读全局列表与当前文件：下一环节直接拿到最新参数，不再依赖手动点「重读文件」。
      if (kind === "open") {
        clearBuckets("buy_new");
        currentMode = "prepare";
        await loadTrades();
        await selectTrade(savedFile);
        toast("买入逻辑已建档 · 请完成建仓准备");
        return;
      }
      resetMode();
      await loadTrades();
      if (activeFile) await selectTrade(activeFile);
      else renderAll();
    }

    /* 平仓结转：把这一笔的已实现盈亏并进该账户的资金基数。
       资金基数是所有仓位比例、单笔上限、期限判断的分母 —— 它必须跟着实际盈亏滚动，
       否则赚了三年，系统还以为你只有起始那点钱（反过来亏了也一样危险）。
       结转过的文件写进 settlements 台账，账户净值里就不再重复加一次它的已实现盈亏。 */
    async function settleClosedTrade(info) {
      const code = CURRENCY[info.account] ? info.account : "CNY";
      const a = account.accounts[code];
      if (!a) return;
      const amount = num(info.amount);
      const before = num(a.capital);
      const after = Math.max(0, +(before + amount).toFixed(2));
      const label = "平仓结转 · " + (info.symbol || info.file);
      a.capital = after;
      account.changes.push({
        ts: nowStamp(), account: code, type: amount >= 0 ? "settle_profit" : "settle_loss",
        label: label, amount: Math.abs(+(after - before).toFixed(2)), before: before, after: after,
        note: "平仓归档 " + (info.symbol || info.file) + "，已实现盈亏 " +
          (amount >= 0 ? "+" : "") + fmtMoney(amount, code) + " 并入资金基数",
      });
      account.changes = account.changes.slice(-200);
      account.settlements = (account.settlements || []).concat([{
        ts: nowStamp(), file: info.file, symbol: info.symbol || "", account: code,
        realizedPnl: amount, closeDate: info.closeDate || todayStr(),
        capitalBefore: before, capitalAfter: after,
      }]).slice(-500);
      account.updated = nowStamp();
      persistAccountLocal();
      try {
        await writeAccountState();
      } catch (e) {
        toast("交易已归档，但资金基数没写进状态机 —— 去「账户参数」点一次保存");
      }
    }

    function clearBuckets(mode) {
      for (const pre of ["shared", "generic"]) { delete checks[pre + "/" + mode]; delete texts[pre + "/" + mode]; }
    }
    function resetMode() {
      // 分批建仓：清掉本次那一笔的输入，但不清 activeFile —— 下一笔通常紧接着录。
      if (currentMode === "fill") { prep.fillPrice = 0; prep.fillShares = 0; prep.fillNote = ""; prep.fillComplete = false; persistPrep(); return; }
      if (currentMode === "prepare" && activeFile) return;   // 改计划：留在原地，接着看
      clearBuckets(currentMode);
      if (currentMode === "prepare") {
        // 一笔走完：逻辑那一步也清掉，下一笔从头审
        clearBuckets("buy_new");
        const keepAccount = prep.account;
        prep = blankPrep();
        prep.account = keepAccount;
        currentMode = "buy_new";
      }
      if (currentMode === "buy_add") { prep.addAmount = 0; prep.planTarget = 0; prep.planNote = ""; }
      prep.sellPrice = 0; prep.sellNote = ""; prep.sellPortion = "all";
      persistPrep();
    }

    document.getElementById("fireBtn").onclick = () => {
      if (currentMode === "account") { if (accountReady()) saveAccount(); return; }
      if (currentMode === "buy_new" && activeFile) { selectTrade(""); return; }
      if (currentMode === "dash") {
        (async () => {
          await Promise.all([loadTrades(), loadAccount()]);
          renderAll();
          await loadQuotes(true);
        })();
        return;
      }
      if (currentMode === "fill") {
        const filled = tradeFilledTotal(trades.open.find(x => x.file === activeFile));
        if (!activePrepared()) toast("先完成并保存「② 建仓准备」");
        else if (num(prep.fillPrice) > 0 && num(prep.fillShares) > 0) showPass();
        else if (prep.fillComplete && filled.shares > 0) showPass();   // 只收口，不再追加
        else toast("填本次成交价和股数；或者不再买了，就勾「这笔建仓已完成」直接收口");
        return;
      }
      if (currentMode === "prepare" && activeFile && !activeIsPlan()) { switchMode("buy_add"); return; }
      if (currentMode === "prepare" && !activeFile && !logicPassed()) { switchMode("buy_new"); return; }
      if (viewing() && currentMode === "buy_new") { toast("回看模式 —— 想建新的一笔，点上面「＋ 新建一笔」"); return; }
      // 卖出是零摩擦的，但成交价例外：没有它就算不出已实现盈亏，平仓时也没法把钱结转回资金基数。
      if (MODE_META[currentMode].kind === "sell" && !(num(prep.sellPrice) > 0)) {
        toast("先填成交价 —— 没有它，这笔的盈亏结转不进账户");
        return;
      }
      if (currentMode === "buy_add") {
        const m = metrics();
        if (Math.abs(m.add) < 0.01) { toast("计划总额没有变化 —— 拖一下或直接输入新的建仓计划"); return; }
        if (m.total < m.floor - 0.01) { toast("不能低于已建仓的 " + fmtMoney(m.floor) + " —— 想到此为止，去「③ 确认建仓」勾建仓已完成"); return; }
        if (m.trimming && !(prep.planNote || "").trim()) { toast("缩减计划必须写理由 —— 这句话决定了以后能不能看懂当时发生了什么"); return; }
      }
      if (!isGated() || allSatisfied()) showPass();
      else showWarn();
    };
    document.getElementById("overlay").addEventListener("click", e => {
      if (e.target === document.getElementById("overlay")) closeModal();
    });
    window.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

    /* ============ Toast ============ */
    let toastTimer = null;
    function toast(msg) {
      let t = document.querySelector(".toast");
      if (!t) { t = document.createElement("div"); t.className = "toast"; document.body.appendChild(t); }
      t.textContent = msg; t.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
    }

    function renderAll() { renderCtxBar(); renderNav(); renderMode(); }

    /* ============ 正文宽度拖拽（参考 reader） ============ */
    const SIDEBAR_W = 300;
    const MIN_W = 620;
    const DEFAULT_RATIO = 0.75;
    const WIDTH_KEY = "sop-main-w";
    let mainWPref = localStorage.getItem(WIDTH_KEY); // null | 旧版 "full" | 数字字符串
    function maxMainW() { return Math.max(MIN_W, window.innerWidth - SIDEBAR_W); }
    function defaultMainW() { return Math.max(MIN_W, Math.round(maxMainW() * DEFAULT_RATIO)); }
    function applyMainW() {
      let w;
      if (mainWPref === null || mainWPref === "full") w = defaultMainW();
      else w = Math.max(MIN_W, Math.min(parseInt(mainWPref, 10) || defaultMainW(), maxMainW()));
      document.documentElement.style.setProperty("--main-w", w + "px");
    }
    (function initResize() {
      const handle = document.getElementById("resizeRight");
      const col = document.getElementById("mainCol");
      handle.addEventListener("mousedown", e => {
        e.preventDefault();
        const startX = e.clientX;
        const startW = col.getBoundingClientRect().width;
        handle.classList.add("dragging");
        document.body.classList.add("dragging-col");
        function move(ev) {
          let w = startW + (ev.clientX - startX);
          w = Math.max(MIN_W, Math.min(maxMainW(), w));
          document.documentElement.style.setProperty("--main-w", w + "px");
          mainWPref = String(Math.round(w));
        }
        function up() {
          handle.classList.remove("dragging");
          document.body.classList.remove("dragging-col");
          localStorage.setItem(WIDTH_KEY, mainWPref);
          window.removeEventListener("mousemove", move);
          window.removeEventListener("mouseup", up);
        }
        window.addEventListener("mousemove", move);
        window.addEventListener("mouseup", up);
      });
      handle.addEventListener("dblclick", () => {
        mainWPref = null; localStorage.removeItem(WIDTH_KEY); applyMainW();
        toast("正文宽度已恢复为 75%");
      });
      window.addEventListener("resize", applyMainW);
      applyMainW();
      const hintKey = "ymos-decide-resize-hint-seen";
      if (!localStorage.getItem(hintKey) && window.innerWidth > 860) {
        const hint = document.getElementById("resizeHint");
        requestAnimationFrame(() => hint.classList.add("show"));
        setTimeout(() => hint.classList.remove("show"), 5000);
        localStorage.setItem(hintKey, "1");
      }
    })();

    /* ============ 键盘：数字键切模式 ============ */
    window.addEventListener("keydown", e => {
      const tag = e.target.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= ORDER.length) switchMode(ORDER[n - 1]);
    });

    /* ============ 启动 ============ */
    try { const raw = localStorage.getItem(PREP_KEY); if (raw) prep = Object.assign(blankPrep(), JSON.parse(raw)); } catch (e) { }
    if (location.protocol === "file:") {
      for (const link of document.querySelectorAll("[data-file-href]")) link.href = link.dataset.fileHref;
    }
    (async function bootstrap() {
      await loadExternalRules();
      await Promise.all([loadAccount(), loadTrades()]);
      restoreQuotes();
      // 账户已设好就先看总览，新建时从「买入逻辑」开始
      if (accountReady() && currentMode === "account") currentMode = "dash";   // 有账户就先看总览
      renderAll();
    })();
  </script>
</body>
