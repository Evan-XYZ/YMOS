    function persistAccountLocal() { try { localStorage.setItem(ACCOUNT_KEY, JSON.stringify(account)); } catch (e) { } }

    function currentModeDef() {
      if (currentMode === "adjust") return ADJUST_MODE;
      if (currentMode === "prepare") return PREPARE_MODE;
      if (currentMode === "fill") return FILL_MODE;
      if (currentMode === "account" || currentMode === "dash") return null;
      return STRATEGIES[currentStrategy].modes[currentMode] || null;
    }
    function currentSections() {
      const m = currentModeDef();
      if (!m) return [];
      const own = m.sections || [];
      if (currentMode === "buy_new") return [THESIS_GATE].concat(own, [DISCIPLINE_GATE]);
      // 同一论点在买入逻辑与建仓准备两个时点各审一遍。
      if (currentMode === "prepare") return [THESIS_GATE, RISK_GATE, EXIT_GATE];
      if (currentMode === "fill") return [];
      if (currentMode === "buy_add") return metrics().trimming ? [] : [RISK_GATE].concat(own);
      return own;
    }
    /* 非对称摩擦：只有增加风险的方向会被锁。 */
    /* 非对称摩擦：只有增加风险的方向会被锁。
       缩减建仓计划是降低敞口，跟止损同类 —— 不设门，只要求写清理由。 */
    function isGated() {
      if (currentMode === "buy_add") return !metrics().trimming;
      return ["buy_new", "prepare", "adjust"].indexOf(currentMode) !== -1;
    }
    // 当前选中的这笔处于什么状态
    function activeStatus() {
      const it = trades.open.find(x => x.file === activeFile);
      return it ? (it.front["状态"] || ST_PLAN) : "";
    }
    function activeIsPlan() { return activeStatus() === ST_PLAN; }
    /* 需要录成交的两种情况：还没成交的计划；以及老文件——状态写着持仓中但从没记过股数。 */
    function needsFill() {
      const it = trades.open.find(x => x.file === activeFile);
      if (!it) return false;
      const st = tradeStatus(it);
      // 计划中 = 一笔都没成交；建仓中 = 建了一部分，还能继续分批录。
      if (st === ST_PLAN || st === ST_FILLING) return true;
      return !num(it.front["持仓股数"]);   // 老文件：写着持仓中却从没记过股数
    }
    /* 第一步只是买入逻辑建档；有 prepare/revise 事件后才算完成建仓准备。
       旧版文件把结构参数直接写在 open 里，保留兼容。 */
    function tradePrepared(it) {
      if (!it) return false;
      if ((it.events || []).some(e => e.kind === "prepare" || e.kind === "revise")) return true;
      const o = it.open || {};
      return num(o.amount) > 0 && !!o.horizonThesis && !!o.exitControl;
    }
    function activePrepared() { return tradePrepared(trades.open.find(x => x.file === activeFile)); }

    /* 买入逻辑（第一步）是否已通过 —— 决定「建仓准备」这一步开不开 */
    function logicPassed() {
      const m = STRATEGIES[currentStrategy].modes.buy_new;
      const secs = [THESIS_GATE].concat(m.sections || [], [DISCIPLINE_GATE]);
      const ok = it => {
        if (it.type === "calc") { const s = it.calc().state; return s === "pass" || (s === "idle" && it.idleOk); }
        if (it.type === "text") return !it.required || !!tget(it, "buy_new").trim();
        return cget(it, "buy_new");
      };
      return secs.every(sec => {
        const done = sec.items.filter(ok).length;
        return sec.rule === "any" ? done >= 1 : done === sec.items.length;
      });
    }
    // 至少有一个账户填了资金与期限，就算设好了
    function accountReady() {
      return Object.keys(account.accounts).some(k => num(account.accounts[k].capital) > 0 && !!account.accounts[k].horizonFund);
    }
    function firstReadyAccount() {
      return Object.keys(account.accounts).find(k => num(account.accounts[k].capital) > 0 && !!account.accounts[k].horizonFund) || "CNY";
    }

    /* 正式数据 API：只访问 YMOS 本地服务。 */
    async function api(path, opts) {
      const res = await fetch(path, opts);
      const j = await res.json().catch(() => ({}));
      if (!res.ok) { const e = new Error(j.error || res.status); e.status = res.status; e.payload = j; throw e; }
      serverOk = true;
      return j;
    }

    /* 账户参数：状态机文件优先，localStorage 兜底（和交易计划台一个套路） */
    async function loadAccount() {
      try { const raw = localStorage.getItem(ACCOUNT_KEY); if (raw) account = migrateAccount(JSON.parse(raw)); } catch (e) { }
      try {
        const j = await api("/api/trade/account");
        if (j.found && j.account) account = migrateAccount(j.account);   // v1 单账户会被搬到对应币种下
      } catch (e) { serverOk = false; }
      if (!num(prepAccount().capital)) prep.account = firstReadyAccount();
      persistAccountLocal();
    }

    async function loadTrades() {
      try {
        trades = await api("/api/trade/list");
        if (activeFile && !trades.open.some(t => t.file === activeFile)) activeFile = "";
      } catch (e) { serverOk = false; trades = { open: [], closed: [], voided: [] }; }
      if (!Array.isArray(trades.voided)) trades.voided = [];
    }

    /* 选中一笔持仓：把建仓档案回填进 prep，让结构层用真实数字重算 */
    async function selectTrade(file) {
      activeFile = file || "";
      activeOpen = null; activeChecks = {}; activeTexts = {};
      if (!activeFile) { renderAll(); return; }
      try {
        const j = await api("/api/trade/load?file=" + encodeURIComponent(activeFile));
        if (j.found && j.open) {
          const o = j.open;
          activeOpen = o;
          if (o.strategy && STRATEGIES[o.strategy]) currentStrategy = o.strategy;
          const plan = Object.assign({}, o);
          for (const e of (j.events || [])) {
            if (!e.metrics) continue;
            if (["prepare", "revise"].indexOf(e.kind) !== -1) Object.assign(plan, e.metrics);
            // 再次加仓时，基数必须是「上次加完之后的计划总额」，不能退回原始计划。
            else if ((e.kind === "add" || e.kind === "trim") && num(e.metrics.amount)) plan.amount = num(e.metrics.amount);
          }
          prep = Object.assign(blankPrep(), {
            symbol: o.symbol || o.name || "",
            ticker: o.ticker || "",
            account: plan.account || plan.currency || "CNY",
            horizonThesis: plan.horizonThesis || "",
            amount: num(plan.amount), stopPct: num(plan.stopPct), noStop: !!plan.noStop,
            exitControl: plan.exitControl || "",
            startedAt: Date.now() - COOL_MIN * 60000 - 1000,   // 已有仓位：冷却期不重复计
          });
          persistPrep();
        }
        // 回填「当时勾了什么、写了什么」：买入逻辑 → 建仓准备 → 后续修订依次叠加。
        for (const e of (j.events || [])) {
          if (["open", "prepare", "revise"].indexOf(e.kind) === -1) continue;
          Object.assign(activeChecks, e.checks || {});
          Object.assign(activeTexts, e.texts || {});
        }
        const latestRule = Object.assign({}, activeOpen || {});
        for (const e of (j.events || [])) {
          if (["prepare", "revise"].indexOf(e.kind) !== -1 && e.metrics) Object.assign(latestRule, e.metrics);
          if (e.kind === "adjust" && e.adjust) {
            latestRule.noStop = !!e.adjust.noStop;
            latestRule.stopPct = e.adjust.stopPct;
            latestRule.exitRule = e.adjust.exitRule || "";
          }
        }
        prep.adjustMode = latestRule.noStop ? "logic" : "price";
        prep.adjustStopPct = latestRule.noStop ? 0 : num(latestRule.stopPct);
        prep.adjustExitRule = latestRule.exitRule || activeTexts.x4 || "";
        // 建仓准备是第二个审视时点：用文件中的最新论点/结构值预填，但保持可编辑。
        clearBuckets("prepare");
        for (const sec of [THESIS_GATE, RISK_GATE, EXIT_GATE]) {
          for (const it of sec.items) {
            if (it.type === "text" && activeTexts[it.id] != null) bank(texts, it, "prepare")[it.id] = activeTexts[it.id];
            else if (it.type !== "calc" && activeChecks[it.id]) bank(checks, it, "prepare")[it.id] = true;
          }
        }
      } catch (e) { serverOk = false; }
      renderAll();
    }

    /* =====================================================================
       渲染 · 顶部上下文条
       ===================================================================== */
    function renderCtxBar() {
      const seg = document.getElementById("stratSeg");
      seg.innerHTML = "";
      for (const key of Object.keys(STRATEGIES)) {
        const s = STRATEGIES[key];
        const b = document.createElement("button");
        b.className = "strat-btn" + (key === currentStrategy ? " on" : "");
        b.textContent = s.label;
        b.title = s.desc;
        b.onclick = () => switchStrategy(key);
        seg.appendChild(b);
      }

      const pick = document.getElementById("posPick");
      pick.innerHTML = "";
      if (!serverOk) {
        const tag = document.createElement("span");
        tag.className = "conn-tag";
        tag.textContent = "未连本地服务 · 不写盘";
        tag.title = "跑 python3 server.py 后刷新，就能把每个动作写进本地决策文件。";
        pick.appendChild(tag);
        return;
      }
      const label = document.createElement("span");
      label.textContent = "持仓";
      pick.appendChild(label);
      const sel = document.createElement("select");
      sel.innerHTML = '<option value="">— 未选（开新仓不需要）—</option>' +
        trades.open.map(t => {
          const f = t.front || {};
          return '<option value="' + escapeHTML(t.file) + '"' + (t.file === activeFile ? " selected" : "") + '>' +
            escapeHTML((f["标的"] || t.file) + " · " + (f["状态"] || ST_PLAN) + " · " + (f["建仓决策日"] || f["开仓决策日"] || "")) + '</option>';
        }).join("");
      sel.onchange = () => selectTrade(sel.value);
      pick.appendChild(sel);
      const tag = document.createElement("span");
      tag.className = "conn-tag ok";
      const nHeld = trades.open.filter(x => tradeStatus(x) === ST_HELD).length;
      const nFilling = trades.open.filter(x => tradeStatus(x) === ST_FILLING).length;
      tag.textContent = "持仓 " + nHeld + (nFilling ? " · 建仓中 " + nFilling : "") +
        " · 计划 " + (trades.open.length - nHeld - nFilling) + " · 已平 " + trades.closed.length;
      pick.appendChild(tag);
      // 重读本地 Markdown 真相源。
      const rf = document.createElement("button");
      rf.className = "mini-btn";
      rf.textContent = "🔄 重读文件";
      rf.title = "重新读取 买入卖出决策/ 下的所有决策文件与账户参数";
      rf.onclick = async () => {
        rf.textContent = "读取中…";
        await Promise.all([loadTrades(), loadAccount()]);
        if (activeFile) await selectTrade(activeFile); else renderAll();
        toast("已重读决策文件");
      };
      pick.appendChild(rf);
    }

    /* =====================================================================
       渲染 · 侧栏 / 移动端 chip
       ===================================================================== */
    function modeLocked(key) {
      if (key === "prepare") return !activeFile && !logicPassed();   // 回看 / 改计划时不锁
      if (key === "fill") return !activeFile || !needsFill() || !activePrepared();
      return false;
    }
    function renderNav() {
      const nav = document.getElementById("modeNav");
      nav.innerHTML = "";
      let lastGroup = null;
      for (const key of ORDER) {
        const m = MODE_META[key];
        if (m.group !== lastGroup) {
          const gh = document.createElement("div");
          gh.className = "group-head";
          gh.textContent = m.group;
          nav.appendChild(gh);
          lastGroup = m.group;
        }
        const locked = modeLocked(key);
        const btn = document.createElement("div");
        btn.className = "mode-btn " + m.kind + (key === currentMode ? " on" : "") + (locked ? " locked" : "");
        btn.onclick = () => switchMode(key);
        if (locked) btn.title = key === "fill" ? "先保存建仓准备，才能纳入建仓数据（建仓中的可以一直纳入，直到你勾选建仓完成）" : "先在「① 买入逻辑」完成论点建档";
        btn.innerHTML =
          '<div class="m-icon">' + (locked ? "🔒" : m.icon) + '</div>' +
          '<div class="m-txt"><div class="m-label">' + m.navLabel + '</div>' +
          '<div class="m-desc">' + (locked ? (key === "fill" ? "锁 · 建仓准备未保存" : "锁 · 买入逻辑未建档")
            : key === "fill" && activeFile && tradeStatus(activeTradeItem()) === ST_FILLING
              ? "建仓中 · 已建 " + tradeBuildProgress(activeTradeItem()).pct.toFixed(0) + "%"
              : m.navDesc) + '</div></div>' +
          '<div class="m-mark"></div>';
        nav.appendChild(btn);
      }

      const wrap = document.getElementById("mobileTabs");
      if (!wrap) return;
      wrap.innerHTML = "";
      for (const key of ORDER) {
        const m = MODE_META[key];
        const chip = document.createElement("div");
        chip.className = "mtb-chip " + m.kind + (key === currentMode ? " on" : "");
        chip.textContent = (modeLocked(key) ? "🔒 " : "") + m.navLabel;
        chip.onclick = () => switchMode(key);
        wrap.appendChild(chip);
      }
    }

    /* =====================================================================
       渲染 · 主区
       ===================================================================== */
    function renderMode() {
      const meta = MODE_META[currentMode];
      const def = currentModeDef();
      document.getElementById("kicker").textContent = currentMode === "account" ? "账户 · 系统化参数" : (def ? def.kicker : meta.navLabel);
      document.getElementById("title").textContent = currentMode === "account" ? "账户参数" : (def ? def.title : meta.navLabel);
      document.getElementById("tagline").innerHTML = currentMode === "account"
        ? "这一页设一次就好，之后每笔交易都拿它当分母。它<em>不属于任何一笔交易</em> —— 所以单独放在这里，存成本地状态机文件。"
        : (def ? def.tagline : "");

      const banner = document.getElementById("coreBanner");
      if (def && def.banner) {
        banner.style.display = "flex";
        banner.className = "core-banner " + meta.kind;
        banner.innerHTML = '<span class="cb-icon">' + (meta.kind === "sell" ? "⚖️" : "🧭") + '</span><div>' + def.banner + '</div>';
      } else {
        banner.style.display = "none";
      }

      const scroll = document.getElementById("bodyScroll");
      scroll.innerHTML = "";
      if (location.protocol === "file:") scroll.appendChild(filePreviewNotice());

      if (currentMode === "dash") {
        renderDash(scroll);
        updateProgress(); scroll.scrollTop = 0;
        return;
      }

      if (currentMode === "account") {
        renderAccount(scroll);
        updateProgress(); scroll.scrollTop = 0;
        return;
      }

      if (currentMode === "fill") {
        if (!activeFile || !needsFill()) scroll.appendChild(fillNotice());
        else { scroll.appendChild(buildFillForm()); appendTips(scroll, FILL_MODE); }
        updateProgress(); scroll.scrollTop = 0;
        return;
      }

      // 已成交的：建仓准备变成只读档案；还在计划中的：可以继续改（改的是计划，不是历史）
      if (currentMode === "prepare" && activeFile && !activeIsPlan()) {
        scroll.appendChild(newTradeBar());
        renderArchive(scroll);
        updateProgress(); scroll.scrollTop = 0;
        return;
      }
      if (currentMode === "prepare" && activeFile && activeIsPlan()) {
        scroll.appendChild(reviseNotice());
        scroll.appendChild(newTradeBar());
        if (!accountReady()) scroll.appendChild(accountNotice());
        scroll.appendChild(buildMetrics());
        scroll.appendChild(buildPrepForm());
        for (const sec of currentSections()) scroll.appendChild(buildSection(sec));
        updateProgress(); scroll.scrollTop = 0;
        return;
      }

      if (currentMode === "prepare" && !activeFile && !logicPassed()) {
        scroll.appendChild(lockedNotice());
        updateProgress(); scroll.scrollTop = 0;
        return;
      }

      if (currentMode === "buy_new") {
        if (activeFile) scroll.appendChild(viewBar("买入逻辑"));
        else scroll.appendChild(buildSymbolBar());
      }
      if (currentMode !== "buy_new" && currentMode !== "prepare") {
        const need = buildTradeNeeded();
        if (need) scroll.appendChild(need);
      }
      if (currentMode === "prepare" || currentMode === "buy_add") {
        if (!accountReady()) scroll.appendChild(accountNotice());
        scroll.appendChild(buildMetrics());
        scroll.appendChild(buildPrepForm());
      }
      if (MODE_META[currentMode].kind === "sell" && activeFile) {
        scroll.appendChild(buildPositionContext("sell"));
        scroll.appendChild(buildSellForm());
      }
      if (currentMode === "adjust" && activeFile) {
        scroll.appendChild(buildPositionContext("adjust"));
        scroll.appendChild(buildAdjustForm());
      }

      for (const sec of currentSections()) scroll.appendChild(buildSection(sec));
      appendTips(scroll, def);
      updateProgress();
      scroll.scrollTop = 0;
    }

    function appendTips(scroll, m) {
      if (!m || !m.tips || !m.tips.length) return;
      const tipsEl = document.createElement("div");
      tipsEl.className = "tips";
      for (const t of m.tips) {
        const tip = document.createElement("div");
        tip.className = "tip";
        tip.innerHTML = '<span class="tip-icon">⚠️</span><div>' + t + '</div>';
        tipsEl.appendChild(tip);
      }
      scroll.appendChild(tipsEl);
    }

    /* =====================================================================
       持仓总览（数字版 Dashboard）
       持仓事实来自单笔决策文件；现价优先从账户状态机的最近快照恢复。
       页面再用当前股数 / 成本 / 计划金额重算总览，不把快照当成持仓账本。
       ===================================================================== */
    function decisionPlan(item) {
      const o = Object.assign({}, item.open || {});
      for (const e of (item.events || [])) {
        if (["prepare", "revise"].indexOf(e.kind) !== -1 && e.metrics) Object.assign(o, e.metrics);
        // 加仓 / 缩减改的都是「建仓计划总额」，不是持仓事实 —— 实际仓位一律走「确认建仓」录入。
        if ((e.kind === "add" || e.kind === "trim") && e.metrics && num(e.metrics.amount)) o.amount = num(e.metrics.amount);
        if (e.kind === "adjust" && e.adjust) {
          o.noStop = !!e.adjust.noStop;
          o.stopPct = e.adjust.noStop ? null : num(e.adjust.stopPct);
          o.exitRule = e.adjust.exitRule || "";
        }
      }
      return o;
    }
    function activeTradeItem() { return trades.open.find(x => x.file === activeFile) || null; }
    function activePosition() {
      const item = activeTradeItem();
      if (!item) return null;
      const f = item.front || {}, plan = decisionPlan(item), live = tradeLive(item);
      const shares = num(f["持仓股数"]), costPrice = num(f["成本价"]);
      return {
        item, plan, shares, costPrice, costAmount: shares * costPrice,
        currentPrice: live ? live.price : 0,
        marketValue: live ? live.marketValue : 0,
        pnl: live ? live.pnl : null, pnlPct: live ? live.pnlPct : null,
      };
    }
    function fmtShares(v) {
      if (!isFinite(v)) return "—";
      return (+v.toFixed(4)).toLocaleString("en-US", { maximumFractionDigits: 4 });
    }
    function sellPositionPreview() {
      const p = activePosition();
      if (!p || !p.shares) return { before: 0, sell: 0, remain: 0 };
      const ratio = (SELL_PORTION[prep.sellPortion] || SELL_PORTION.all).ratio;
      const sell = prep.sellPortion === "all" ? p.shares : p.shares * ratio;
      return { before: p.shares, sell, remain: Math.max(0, p.shares - sell) };
    }
    function tradeAmount(item) {
      const f = item.front || {}, o = decisionPlan(item);
      const shares = num(f["持仓股数"]), cost = num(f["成本价"]), actual = num(f["实际投入"]);
      if (actual) return actual;
      if (shares && cost) return shares * cost;
      return num(o.amount);                       // 还没成交：按计划金额占位
    }
    function tradeAcct(item) { const o = decisionPlan(item); return o.account || o.currency || "CNY"; }
    function tradeRealizedPnl(item) {
      return (item.events || []).reduce((sum, e) => sum + (e.sell && e.sell.realizedPnl != null ? num(e.sell.realizedPnl) : 0), 0);
    }
    function tradeStatus(item) { return (item && item.front && item.front["状态"]) || ST_PLAN; }
    /* 能不能作废：只有「一笔都没成交的计划」可以。
       有过真实成交的一律走平仓 —— 有仓位就必须有出场记录，这是账要对得上的底线。 */
    function tradeVoidable(item) {
      if (!item) return false;
      if (tradeStatus(item) !== ST_PLAN) return false;
      return !(item.events || []).some(e => e.kind === "fill");
    }
    /* 有真实成交的两种状态：建仓中（建了一部分）与持仓中（建满了）。
       两者都要算进账户敞口 —— 「还没建满」不等于「没风险」。 */
    function tradeHasPosition(item) {
      const st = tradeStatus(item);
      return st === ST_FILLING || st === ST_HELD;
    }
    /* 累计建仓：只看 fill 事件的累加，不因为后来减仓而回退。
       front matter 里的股数是「当前还剩多少」，这里要的是「一共建了多少」。 */
    function tradeFilledTotal(item) {
      let shares = 0, amount = 0, batches = 0, done = false;
      for (const e of ((item && item.events) || [])) {
        if (e.kind !== "fill" || !e.fill) continue;
        if (e.fill.complete) done = true;
        if (e.fill.finalizeOnly) continue;
        shares += num(e.fill.shares);
        amount += num(e.fill.actualAmount) || num(e.fill.shares) * num(e.fill.price);
        batches++;
      }
      if (!batches) {                              // 老文件：没有 fill 事件，用 front matter 兜底
        const f = (item && item.front) || {};
        shares = num(f["持仓股数"]);
        amount = num(f["实际投入"]) || shares * num(f["成本价"]);
        if (shares || amount) { batches = 1; done = tradeStatus(item) === ST_HELD; }
      }
      return { shares, amount, batches, done, avgCost: shares ? amount / shares : 0 };
    }
    /* 建仓进度：已建 / 计划。允许超过 100%（实际买超了要看得见，不藏）。 */
    function tradeBuildProgress(item) {
      const planned = num(decisionPlan(item).amount);
      const t = tradeFilledTotal(item);
      return {
        planned, filled: t.amount, shares: t.shares, batches: t.batches,
        pct: planned ? t.amount / planned * 100 : 0,
        remaining: Math.max(0, planned - t.amount),
        over: planned ? Math.max(0, t.amount - planned) : 0,
      };
    }
    /* 这笔的已实现盈亏是不是已经结转进资金基数了 —— 结转过就不能再算进净值。 */
    function tradeSettled(item) {
      const file = (item && item.file) || "";
      return !!file && (account.settlements || []).some(s => s.file === file);
    }
    function accountSnapshot(code) {
      const mine = t => tradeAcct(t) === code;
      // 持仓 = 建仓中 + 持仓中：只要有真实成交，敞口就已经在市场里了。
      const held = trades.open.filter(t => tradeHasPosition(t) && mine(t));
      const filling = trades.open.filter(t => tradeStatus(t) === ST_FILLING && mine(t));
      const planned = trades.open.filter(t => tradeStatus(t) === ST_PLAN && mine(t));
      const costBasis = held.reduce((s, t) => s + tradeAmount(t), 0);
      const marketValue = held.reduce((s, t) => { const lv = tradeLive(t); return s + (lv ? lv.marketValue : tradeAmount(t)); }, 0);
      const unrealizedPnl = held.reduce((s, t) => { const lv = tradeLive(t); return s + (lv ? lv.pnl : 0); }, 0);
      // 已结转的那几笔，盈亏已经涨进资金基数里了 —— 再加一遍就是重复计算。
      const realizedPnl = trades.open.concat(trades.closed)
        .filter(t => mine(t) && !tradeSettled(t))
        .reduce((s, t) => s + tradeRealizedPnl(t), 0);
      const settledPnl = trades.open.concat(trades.closed)
        .filter(t => mine(t) && tradeSettled(t))
        .reduce((s, t) => s + tradeRealizedPnl(t), 0);
      // 待建计划 = 计划中的全额 + 建仓中「还没建满」的那一截
      const pending = planned.reduce((s, t) => s + tradeAmount(t), 0) +
        filling.reduce((s, t) => s + tradeBuildProgress(t).remaining, 0);
      const capital = num((account.accounts[code] || {}).capital);
      const nav = capital + realizedPnl + unrealizedPnl;
      return {
        code, held, filling, planned, capital, costBasis, marketValue,
        unrealizedPnl, realizedPnl, settledPnl, pending, nav,
        available: nav - marketValue - pending,
      };
    }

    /* 账户级快照：单笔 Markdown 仍是持仓事实源，这里只记录「最后一次行情刷新时看到的汇总结果」。
       页面恢复后仍会用当前交易文件重算，不会把快照当成第二套持仓账本。 */
    function buildPortfolioSnapshot() {
      const byAccount = {};
      for (const code of Object.keys(CURRENCY)) {
        const s = accountSnapshot(code);
        byAccount[code] = {
          capital: s.capital, nav: s.nav, costBasis: s.costBasis, marketValue: s.marketValue,
          unrealizedPnl: s.unrealizedPnl, realizedPnl: s.realizedPnl,
          pending: s.pending, available: s.available,
          heldCount: s.held.length, plannedCount: s.planned.length,
        };
      }
      const held = trades.open.filter(tradeHasPosition);
      const positions = held.map(item => {
        const f = item.front || {}, live = tradeLive(item), code = tradeAcct(item);
        const plan = decisionPlan(item), context = tradeDecisionContext(item);
        const shares = num(f["持仓股数"]), costPrice = num(f["成本价"]), costAmount = shares * costPrice;
        const stopStatus = plan.noStop ? "logic_exit"
          : !live || live.toStopPct == null ? "price_unavailable"
            : live.toStopPct < 0 ? "breached" : live.toStopPct < 5 ? "near" : "within_limit";
        return {
          file: item.file, name: f["标的"] || item.file, ticker: tradeTicker(item), account: code,
          shares, costPrice, lastPrice: live ? live.price : null,
          costAmount, marketValue: live ? live.marketValue : costAmount,
          unrealizedPnl: live ? live.pnl : null, pnlPct: live ? live.pnlPct : null,
          exposurePct: byAccount[code] && byAccount[code].nav ? (live ? live.marketValue : costAmount) / byAccount[code].nav * 100 : null,
          noStop: !!plan.noStop,
          stopPct: plan.noStop ? null : num(plan.stopPct) || null,
          stopPrice: live ? live.stopPrice : (plan.noStop || !costPrice || !num(plan.stopPct) ? null : costPrice * (1 - num(plan.stopPct) / 100)),
          distanceToStopPct: live ? live.toStopPct : null,
          stopStatus,
          horizonThesis: plan.horizonThesis || "",
          thesis: context.thesis,
          invalidationSignal: context.invalidationSignal,
          catalyst: context.catalyst,
          exitAction: plan.exitRule || context.exitAction || "",
          source: live ? (live.source || "") : "",
        };
      });
      const health = portfolioHealth();
      for (const position of positions) {
        const related = health.alerts.filter(a => a.file === position.file);
        position.alerts = related.map(a => ({ severity: a.severity, type: a.type, message: a.message }));
        position.suggestedPrompts = Array.from(new Set(related.flatMap(a => a.suggestedPrompts || [])));
      }
      return {
        schemaVersion: 1,
        asOf: quotes.asOf || nowStamp(),
        savedAt: nowStamp(),
        prices: quotes.prices || {},
        resolved: quotes.resolved || {},
        unresolved: quotes.unresolved || [],
        sources: quotes.sources || {},
        accounts: byAccount,
        positions,
        health,
        agentRouting: {
          purpose: "Agent 日常持仓扫描入口；先读 health，只在有告警时打开 sourceFile 与对应 P 系列提示词。",
          sourceOfTruth: "单笔交易 Markdown 是持仓事实源；本快照是最近一次行情时点的派生视图。",
          defaultPortfolioPrompt: "P7",
          suggestedRuns: health.suggestedRuns,
        },
      };
    }

    function tradeTicker(item) {
      const o = decisionPlan(item), f = item.front || {};
      return (o.ticker || f["Ticker"] || quotes.resolved[f["标的"]] || "").toUpperCase();
    }
    /* 行情派生：只有「有股数 + 有成本价 + 拿到现价」三者齐全才算得出浮盈。
       缺一个就退回成本口径，不猜、不补零。 */
    function tradeLive(item) {
      const f = item.front || {}, o = decisionPlan(item);
      const q = quotes.prices[tradeTicker(item)];
      const shares = num(f["持仓股数"]), cost = num(f["成本价"]);
      if (!q || !shares || !cost) return null;
      const price = num(q.price);
      if (!price) return null;
      const mv = price * shares, costAmt = cost * shares;
      const stopPct = o.noStop ? 0 : num(o.stopPct);
      return {
        price, pctChg: q.pctChg == null ? null : num(q.pctChg), source: q.source,
        marketValue: mv, costAmount: costAmt, pnl: mv - costAmt,
        pnlPct: costAmt ? (mv - costAmt) / costAmt * 100 : 0,
        // 距止损：现价相对「成本 ×(1-止损幅度)」还有多远
        stopPrice: stopPct ? cost * (1 - stopPct / 100) : null,
        toStopPct: stopPct ? (price - cost * (1 - stopPct / 100)) / price * 100 : null,
      };
    }

    function tradeDecisionContext(item) {
      const texts = {};
      for (const event of (item.events || [])) {
        if (["open", "prepare", "revise"].indexOf(event.kind) !== -1 && event.texts) Object.assign(texts, event.texts);
      }
      return {
        thesis: texts.x1 || "",
        invalidationSignal: texts.x2 || "",
        catalyst: texts.x3 || "",
        exitAction: texts.x4 || "",
      };
    }

    function portfolioHealth() {
      const held = trades.open.filter(tradeHasPosition);
      const planned = trades.open.filter(t => tradeStatus(t) === ST_PLAN);
      const alerts = [];
      const add = (severity, type, item, message, prompts) => {
        const f = (item && item.front) || {}, name = f["标的"] || (item && item.file) || "账户级";
        alerts.push({
          severity, type, name,
          ticker: item ? tradeTicker(item) : "",
          file: item ? item.file : "",
          message,
          suggestedPrompts: prompts || [],
        });
      };

      for (const item of trades.open) {
        const plan = decisionPlan(item), code = tradeAcct(item), acct = account.accounts[code] || {};
        const name = item.front["标的"] || item.file, capital = num(acct.capital) || num(plan.capital), amount = tradeAmount(item);
        if (capital && amount / capital > account.maxSingleRatio + 1e-9) {
          add("critical", "position_limit_exceeded", item,
            name + " 占账户 " + (amount / capital * 100).toFixed(1) + "%，超出单笔上限 " + (account.maxSingleRatio * 100).toFixed(0) + "%",
            ["P7", "P12"]);
        }
        const fund = horizonBy(HORIZON_FUND, plan.horizonFund), thesis = horizonBy(HORIZON_THESIS, plan.horizonThesis);
        if (fund && thesis && thesis.months > fund.months) {
          add("critical", "horizon_mismatch", item,
            name + " 资金期限 " + fund.label + " 短于论点周期 " + thesis.label,
            ["P6", "P7", "P12"]);
        }
        if (plan.exitControl && EXIT_CONTROL[plan.exitControl] && !EXIT_CONTROL[plan.exitControl].ok) {
          add("critical", "external_exit_control", item,
            name + " 的出局权外生：" + EXIT_CONTROL[plan.exitControl].label,
            ["P6", "P12"]);
        }
        if (plan.noStop) {
          add("warning", "logic_exit_review", item,
            name + " 不设价格止损，需要核对论点失效信号",
            ["P2", "P6"]);
        }
      }

      for (const item of held) {
        const live = tradeLive(item), name = item.front["标的"] || item.file;
        if (live && live.toStopPct != null && live.toStopPct < 0) {
          add("critical", "stop_breached", item,
            name + " 现价已跌破止损位 " + Math.abs(live.toStopPct).toFixed(1) + "%",
            ["P2", "P6", "P12"]);
        } else if (live && live.toStopPct != null && live.toStopPct < 5) {
          add("warning", "near_stop", item,
            name + " 距止损位只剩 " + live.toStopPct.toFixed(1) + "%",
            ["P6", "P12"]);
        }
      }

      const skipped = trades.open.concat(trades.closed).filter(t => (t.open || {}).coolSkipped).length;
      if (skipped) {
        add("warning", "cooldown_skipped", null,
          "跳过冷却期的交易 " + skipped + " / " + (trades.open.length + trades.closed.length),
          ["P7", "P12"]);
      }

      const suggestions = [], seen = new Set();
      for (const alert of alerts) {
        if (!alert.suggestedPrompts.length) continue;
        const key = (alert.ticker || "portfolio") + ":" + alert.suggestedPrompts.join("+");
        if (seen.has(key)) continue;
        seen.add(key);
        suggestions.push({
          scope: alert.ticker ? "position" : "portfolio",
          name: alert.name,
          ticker: alert.ticker,
          prompts: alert.suggestedPrompts,
          reason: alert.message,
          sourceFile: alert.file,
        });
      }
      const criticalCount = alerts.filter(x => x.severity === "critical").length;
      const warningCount = alerts.filter(x => x.severity === "warning").length;
      return {
        status: criticalCount ? "critical" : warningCount ? "attention" : "normal",
        summary: {
          heldCount: held.length,
          plannedCount: planned.length,
          pricedCount: held.filter(item => !!tradeLive(item)).length,
          criticalCount,
          warningCount,
          stopBreachedCount: alerts.filter(x => x.type === "stop_breached").length,
          nearStopCount: alerts.filter(x => x.type === "near_stop").length,
          logicExitReviewCount: alerts.filter(x => x.type === "logic_exit_review").length,
        },
        alerts,
        suggestedRuns: suggestions,
      };
    }

    function hasQuotes() { return Object.keys(quotes.prices || {}).length > 0; }

    function persistQuotes() {
      if (!hasQuotes()) return;
      try {
        localStorage.setItem(QUOTES_KEY, JSON.stringify({
          prices: quotes.prices || {}, resolved: quotes.resolved || [], unresolved: quotes.unresolved || [],
          asOf: quotes.asOf || nowStamp(), sources: quotes.sources || {}, savedAt: nowStamp(),
        }));
      } catch (e) { }
    }

    function restoreQuotes() {
      let saved = null, restoredFrom = "";
      const snapshot = account && account.portfolioSnapshot;
      if (snapshot && snapshot.prices && Object.keys(snapshot.prices).length) {
        saved = snapshot;
        restoredFrom = "obsidian";
      }
      try {
        if (!saved) {
          const raw = localStorage.getItem(QUOTES_KEY);
          const cached = raw ? JSON.parse(raw) : null;
          if (cached && cached.prices && Object.keys(cached.prices).length) {
            saved = cached;
            restoredFrom = "browser";
          }
        }
      } catch (e) { }
      if (saved) {
        quotes = Object.assign(quotes, saved, {
          loading: false, tried: true, restored: true, restoredFrom, lastError: "",
        });
      }
    }

    function quoteBar() {
      const el = document.createElement("div");
      const held = trades.open.filter(tradeHasPosition);
      const got = held.filter(x => quotes.prices[tradeTicker(x)]).length;
      if (quotes.loading) {
        el.className = "stance-ctx none";
        el.innerHTML = '<span class="sc-icon">📡</span><div>正在拉行情…（走 YMOS 自己的价格路由器：美股 Finnhub / A股 Tushare / 港股 Yahoo）</div>';
        return el;
      }
      if (!quotes.tried) {
        el.className = "stance-ctx none";
        el.innerHTML = '<span class="sc-icon">📡</span><div>下面是<b>成本口径</b>的数字（不联网，开源版默认就是这样）。' +
          '<br><button class="new-btn" id="qGo">📡 打通动态价格</button>' +
          '<span class="sc-msg" style="display:block;margin-top:6px">走 YMOS 自己的价格路由器，跟投资雷达同一个源。现价不写进单笔决策文件；成功后会连同总览写入<b>账户状态机快照</b>。</span></div>';
        el.querySelector("#qGo").onclick = () => loadQuotes(true);
        return el;
      }
      const un = (quotes.unresolved || []);
      const s = quotes.sources || {};
      const srcTxt = [
        "美股/Crypto → " + (s.finnhub ? "Finnhub" : "Yahoo 兜底（未配 FINNHUB_API_KEY）"),
        "A股 → " + (s.tushare ? "Tushare" : "Yahoo 兜底（未配 TUSHARE_TOKEN）"),
        "港股 → Yahoo",
      ].join("　·　");
      el.className = "stance-ctx " + (got ? "good" : "warn");
      const statusText = quotes.restored
        ? ('当前按' + (quotes.restoredFrom === "obsidian" ? ' Obsidian 状态机快照' : '浏览器备用缓存') + '显示')
        : '本次行情已更新，总览快照已写入状态机';
      el.innerHTML = '<span class="sc-icon">📡</span><div>最近行情 <b>' + got + ' / ' + held.length + '</b>　·　上次更新 <b>' + escapeHTML(quotes.asOf || "未知") + '</b>' +
        '　<a class="sc-link" id="qGo">重新拉取 →</a>' +
        '<br><span class="sc-msg">' + statusText + '。' + escapeHTML(srcTxt) + '</span>' +
        (quotes.lastError ? '<br><span class="sc-msg">⚠️ ' + escapeHTML(quotes.lastError) + '</span>' : '') +
        (un.length ? '<br><span class="sc-msg">查不到 ticker：<b>' + un.map(escapeHTML).join("、") + '</b> —— 在「建仓准备」的 Ticker 栏补一个，或先加进持仓 / Watchlist 状态机。</span>' : '') + '</div>';
      el.querySelector("#qGo").onclick = () => loadQuotes(true);
      return el;
    }

    async function loadQuotes(force) {
      if (!serverOk) return;
      quotes.loading = true; renderMode();
      try {
        const j = await api("/api/trade/prices" + (force ? "?force=1" : ""));
        if (j && j.prices && Object.keys(j.prices).length) {
          quotes = Object.assign(quotes, j, { loading: false, tried: true, restored: false, restoredFrom: "", lastError: "" });
          persistQuotes();
          try {
            account.portfolioSnapshot = buildPortfolioSnapshot();
            persistAccountLocal();
            await writeAccountState();
          } catch (snapshotError) {
            quotes.lastError = "行情已更新，但 Obsidian 总览快照写入失败。";
          }
        } else {
          quotes.loading = false; quotes.tried = true;
          quotes.lastError = hasQuotes() ? "本次拉取没有返回有效价格，继续显示上一次行情。" : "本次拉取没有返回有效价格。";
        }
      } catch (e) {
        quotes.loading = false; quotes.tried = true;
        quotes.lastError = hasQuotes() ? "本次拉取失败，继续显示上一次行情。" : "本次拉取失败。";
      }
      renderMode();
    }

    function renderDash(scroll) {
      const held = trades.open.filter(t => tradeStatus(t) === ST_HELD);
      const filling = trades.open.filter(t => tradeStatus(t) === ST_FILLING);
      const plan = trades.open.filter(t => tradeStatus(t) === ST_PLAN);

      /* ---- 各账户敞口 ---- */
      const accBox = document.createElement("div");
      accBox.className = "section";
      let accRows = "";
      for (const code of Object.keys(CURRENCY)) {
        const a = account.accounts[code], cap = num(a.capital);
        if (!cap) continue;
        const s = accountSnapshot(code);
        const totalPnl = s.realizedPnl + s.unrealizedPnl;
        accRows +=
          '<tr><td><b>' + CURRENCY[code].sym + ' ' + CURRENCY[code].label + '</b></td>' +
          '<td>' + fmtMoney(cap, code) + '</td>' +
          '<td><b>' + fmtMoney(s.nav, code) + '</b>' +
          (totalPnl ? '<span class="sub ' + (totalPnl > 0 ? "up" : "down") + '"> · ' + (totalPnl > 0 ? "+" : "") + fmtMoney(totalPnl, code) + '</span>' : '') + '</td>' +
          '<td>' + fmtMoney(s.costBasis, code) + '</td>' +
          '<td><b>' + fmtMoney(s.marketValue, code) + '</b></td>' +
          '<td>' + (s.pending ? fmtMoney(s.pending, code) + '<span class="sub"> · ' + (s.planned.length + s.filling.length) + ' 笔</span>' : '—') + '</td>' +
          '<td class="' + (s.available < 0 ? "neg" : "") + '"><b>' + fmtMoney(s.available, code) + '</b></td>' +
          '<td>' + s.held.length + ' 笔' + (s.filling.length ? '<span class="sub"> · 建仓中 ' + s.filling.length + '</span>' : '') + '</td></tr>';
      }
      accBox.innerHTML = '<div class="section-title"><span class="s-name">账户敞口</span><span class="s-rule all">' +
        (hasQuotes() ? "净值 + 市值口径" : "成本口径（待拉行情）") + '</span></div>' +
        (accRows
          ? '<div class="tbl-scroll"><table class="m-tbl dash"><tr><th>账户</th><th>资金基数</th><th>账户净值</th><th>持仓成本</th><th>持仓市值</th><th>待建计划</th><th>剩余可开</th><th>持仓数</th></tr>' + accRows + '</table></div>' +
            '<div class="empty-note">账户净值 = 资金基数 + <b>未结转</b>已实现盈亏 + 浮动盈亏；剩余可开 = 账户净值 − 持仓市值 − 待建计划。' +
            '<br>每笔<b>平仓归档时，该笔盈亏会自动并入资金基数</b>（在「账户参数 · 资金变动记录」里留痕），所以资金基数是滚动的，不是一开始那个数。' +
            '<br>待建计划 = 计划中的全额 + 建仓中还没建满的那一截。未拉行情时，市值暂按剩余成本计。</div>'
          : '<div class="empty-note">还没启用任何账户 —— 先去「账户参数」设置资金基数。</div>');
      scroll.appendChild(accBox);

      /* ---- 结构层体检：只报能从数据里查出来的问题 ---- */
      const health = portfolioHealth();
      const flags = health.alerts.map(alert => ({
        lv: alert.severity === "critical" ? "bad" : "warn",
        txt: (alert.name && alert.name !== "账户级" ? "<b>" + escapeHTML(alert.name) + "</b> · " : "") +
          escapeHTML(alert.message.replace(alert.name + " ", "")) +
          (alert.suggestedPrompts.length ? "<span class=\"sub\"> · 建议 " + alert.suggestedPrompts.join(" → ") + "</span>" : ""),
      }));

      const chk = document.createElement("div");
      chk.className = "section";
      chk.innerHTML = '<div class="section-title"><span class="s-name">结构层体检</span>' +
        '<span class="s-rule ' + (flags.some(f => f.lv === "bad") ? "any" : "all") + '">' + (flags.length ? flags.length + " 项" : "无异常") + '</span></div>' +
        (flags.length
          ? flags.map(f => '<div class="flag ' + f.lv + '"><span>' + (f.lv === "bad" ? "🛑" : "⚠️") + '</span><div>' + f.txt + '</div></div>').join("")
          : '<div class="empty-note">当前持仓与计划都在结构层之内。这不代表方向对，只代表<b>你还在牌桌上</b>。</div>');
      scroll.appendChild(chk);

      /* ---- 持仓明细：建仓中单列一张表 —— 「还没建满」是一个需要动作的状态 ---- */
      scroll.appendChild(tradeTable("持仓中（已建满）", held, "held"));
      if (filling.length) scroll.appendChild(tradeTable("建仓中（分批未建满）", filling, "filling"));
      scroll.appendChild(tradeTable("计划中（等待建仓）", plan, "plan"));

      /* ---- 已作废：不参与任何统计，只是留着让你知道自己否掉过什么 ---- */
      const voided = (trades.voided || []);
      if (voided.length) {
        const vb = document.createElement("div");
        vb.className = "section";
        vb.innerHTML = '<div class="section-title"><span class="s-name">已作废的计划</span><span class="s-rule all">' + voided.length + ' 笔</span></div>' +
          '<div class="tbl-scroll"><table class="m-tbl dash"><tr><th>标的</th><th>建档日</th><th>作废日</th><th>原因</th></tr>' +
          voided.slice(0, 10).map(v => {
            const f = v.front || {};
            const ev = (v.events || []).find(e => e.kind === "void" && e.void) || { void: {} };
            return '<tr><td>' + escapeHTML(f["标的"] || v.file) + '</td>' +
              '<td>' + escapeHTML(f["建仓决策日"] || "—") + '</td>' +
              '<td>' + escapeHTML(f["作废日"] || "—") + '</td>' +
              '<td>' + escapeHTML((ev.void.reason || "—")) + '</td></tr>';
          }).join("") + '</table></div>' +
          '<div class="empty-note">这些是<b>一笔都没成交</b>就被否掉的建档，已经不占「待建计划」和「剩余可开」。留着它们，是因为「我否掉过什么」和「我做过什么」一样值得回看。</div>';
        scroll.appendChild(vb);
      }

      /* ---- 已平仓错因分布 ---- */
      const layers = {};
      for (const t2 of trades.closed) {
        const ev = (t2.events || []).find(e => e.closing && e.result && e.result.layer);
        const k = ev ? ev.result.layer : "未填";
        layers[k] = (layers[k] || 0) + 1;
      }
      const cl = document.createElement("div");
      cl.className = "section";
      cl.innerHTML = '<div class="section-title"><span class="s-name">已平仓复盘</span><span class="s-rule all">' + trades.closed.length + ' 笔</span></div>' +
        (trades.closed.length
          ? '<div class="tbl-scroll"><table class="m-tbl dash"><tr><th>错在哪一层</th><th>笔数</th></tr>' +
          Object.keys(layers).map(k => '<tr><td>' + escapeHTML(k) + '</td><td><b>' + layers[k] + '</b></td></tr>').join("") + '</table></div>' +
          '<div class="empty-note">哪一层出现得最多，就该在哪一层加拦截点 —— 这张表是整套系统里唯一会告诉你「下一版该改哪里」的东西。</div>'
          : '<div class="empty-note">还没有平掉的交易。第一笔平仓后，这里会开始积累「错在哪一层」的分布。</div>');
      scroll.appendChild(cl);
      // 行情只针对「持仓中」文件拉取；把取价状态放在总览最底下，不打断上方体检。
      if (serverOk) scroll.appendChild(quoteBar());
    }

    /* kind: "held" 已建满 · "filling" 建仓中 · "plan" 还没成交 */
    function tradeTable(title, list, kind) {
      if (kind === true) kind = "held";
      if (kind === false) kind = "plan";
      const isHeld = kind === "held" || kind === "filling";
      const isFilling = kind === "filling";
      const showLive = isHeld && hasQuotes();
      const box = document.createElement("div");
      box.className = "section";
      let rows = "";
      for (const it of list) {
        const o = decisionPlan(it), f = it.front || {}, code = tradeAcct(it);
        const a = account.accounts[code] || {}, cap = num(a.capital) || num(o.capital);
        const amt = tradeAmount(it);
        const shares = num(f["持仓股数"]), cost = num(f["成本价"]);
        const th = horizonBy(HORIZON_THESIS, o.horizonThesis);
        const over = cap && amt / cap > account.maxSingleRatio + 1e-9;
        const lv = isHeld ? tradeLive(it) : null;
        const exposureDenom = isHeld && lv ? accountSnapshot(code).nav : cap;
        const exposureAmount = isHeld && lv ? lv.marketValue : amt;
        const pnlText = !lv ? "—" : lv.pnl > 0 ? "浮盈 +" + lv.pnlPct.toFixed(1) + "%" : lv.pnl < 0 ? "浮亏 " + lv.pnlPct.toFixed(1) + "%" : "持平 0.0%";
        const live = isHeld && showLive
          ? '<td>' + (lv ? lv.price : '<span class="sub">—</span>') + '</td>' +
            '<td class="' + (lv && lv.pnl > 0 ? "up" : lv && lv.pnl < 0 ? "down" : "") + '">' + pnlText + '</td>' +
            '<td class="' + (lv && lv.toStopPct != null && lv.toStopPct < 5 ? "neg" : "") + '">' +
            (lv ? (lv.toStopPct == null ? "无止损" : (lv.toStopPct >= 0 ? "还有 " + lv.toStopPct.toFixed(1) + "%" : "已破 " + Math.abs(lv.toStopPct).toFixed(1) + "%")) : "—") + '</td>'
          : '';
        const prog = tradeBuildProgress(it);
        const progCell = isFilling
          ? '<td><b>' + prog.pct.toFixed(0) + '%</b><span class="sub"> · ' + fmtMoney(prog.filled, code) + ' / ' + fmtMoney(prog.planned, code) +
            (prog.batches ? ' · ' + prog.batches + ' 笔' : '') + '</span></td>' +
            '<td class="' + (prog.remaining ? "" : "neg") + '">' + (prog.remaining ? fmtMoney(prog.remaining, code) : (prog.over ? "超 " + fmtMoney(prog.over, code) : "已建满")) + '</td>'
          : kind === "plan"
            ? '<td>' + (prog.batches ? fmtMoney(prog.filled, code) : '<span class="sub">未开始</span>') + '</td>'
            : '';
        rows += '<tr>' +
          '<td><b>' + escapeHTML(f["标的"] || it.file) + '</b><span class="sub"> · ' + escapeHTML(f["策略"] || "") + '</span></td>' +
          '<td>' + CURRENCY[code].sym + '</td>' +
          '<td>' + fmtMoney(lv ? lv.marketValue : amt, code) + '</td>' +
          (isHeld ? '<td>' + fmtMoney(lv ? lv.costAmount : amt, code) + '</td>' : '') +
          progCell +
          '<td class="' + (over ? "neg" : "") + '">' + (exposureDenom ? (exposureAmount / exposureDenom * 100).toFixed(1) + "%" : "—") + '</td>' +
          (isHeld ? '<td>' + (shares ? shares.toLocaleString("en-US") : "—") + '</td><td>' + (cost || "—") + '</td>' : '') +
          live +
          '<td>' + (o.noStop ? "逻辑证伪" : (o.stopPct ? "-" + num(o.stopPct).toFixed(1) + "%" : "—")) + '</td>' +
          '<td>' + (th ? th.label : "—") + '</td>' +
          '<td><button class="mini-btn" data-file="' + escapeHTML(it.file) + '">打开</button>' +
          (kind === "plan" && tradeVoidable(it)
            ? '<button class="mini-btn void" data-void="' + escapeHTML(it.file) + '" title="这条建档本就不该存在（标的填错 / 重复建档 / 想法已否）">🗑 作废</button>'
            : '') + '</td>' +
          '</tr>';
      }
      box.innerHTML = '<div class="section-title"><span class="s-name">' + title + '</span><span class="s-rule ' + (isFilling ? "any" : "all") + '">' + list.length + ' 笔</span></div>' +
        (list.length
          ? '<div class="tbl-scroll"><table class="m-tbl dash"><tr><th>标的</th><th>币</th><th>' +
          (isHeld ? "持仓市值" : "计划投入") + '</th>' +
          (isHeld ? '<th>持仓成本</th>' : '') +
          (isFilling ? '<th>建仓进度</th><th>还差</th>' : kind === "plan" ? '<th>已建</th>' : '') +
          '<th>占账户</th>' +
          (isHeld ? '<th>股数</th><th>成本价</th>' : '') +
          (showLive ? '<th>现价</th><th>浮盈亏</th><th>距止损</th>' : '') +
          '<th>止损</th><th>论点周期</th><th></th></tr>' + rows + '</table></div>' +
          (isFilling ? '<div class="empty-note">这些标的<b>已经有真实仓位</b>，只是计划还没建满 —— 敞口已按实际成交算进账户。要继续加、或者就此收口，都去「③ 确认建仓」。</div>' : '')
          : '<div class="empty-note">' + (isHeld ? "还没有已成交的持仓。走完「② 建仓准备」再到「③ 确认建仓」，这里就有了。" : "没有等待建仓的计划。") + '</div>');
      box.querySelectorAll(".mini-btn[data-file]").forEach(b => {
        b.onclick = async () => { await selectTrade(b.dataset.file); switchMode(isFilling ? "fill" : "prepare"); };
      });
      box.querySelectorAll(".mini-btn[data-void]").forEach(b => {
        b.onclick = () => showVoidForm(list.find(x => x.file === b.dataset.void));
      });
      return box;
    }

    /* 当前有效规则 = 买入逻辑建档 + prepare/revise + 后续止损调整。 */
    function effectivePlan() {
      const base = Object.assign({}, activeOpen || {});
      const it = trades.open.find(x => x.file === activeFile);
      const evs = (it && it.events) || [];
      let revisions = 0, adds = 0;
      for (const e of evs) {
        if (["prepare", "revise"].indexOf(e.kind) !== -1 && e.metrics) {
          revisions++;
          Object.assign(base, e.metrics);
        }
        // 加仓改的是建仓计划总额 —— 确认建仓必须跟「加仓之后」那版计划对账，
        // 否则加完仓回来录成交，进度还按老计划算，永远显示超买。
        if ((e.kind === "add" || e.kind === "trim") && e.metrics && num(e.metrics.amount)) {
          adds++;
          base.amount = num(e.metrics.amount);
        }
        if (e.kind === "adjust" && e.adjust) {
          base.noStop = !!e.adjust.noStop;
          base.stopPct = e.adjust.noStop ? null : num(e.adjust.stopPct);
          base.exitRule = e.adjust.exitRule || "";
        }
      }
      base._revisions = revisions;
      base._adds = adds;
      return base;
    }

    /* ---- 确认建仓表单 ---- */
    function fillNotice() {
      const el = document.createElement("div");
      el.className = "stance-ctx none";
      const it = trades.open.find(x => x.file === activeFile);
      el.innerHTML = '<span class="sc-icon">✅</span><div>' +
        (!activeFile
          ? '先在顶部选一笔<b>计划中</b>或<b>建仓中</b>的决策文件 —— 确认建仓是把某一笔的「计划」分批变成「实际成交」。'
          : !activePrepared()
            ? '这笔只完成了<b>买入逻辑建档</b>。先去「② 建仓准备」复核论点、补齐仓位与退出动作并保存，再来确认成交。'
          : '这笔已经<b>建仓完成</b>（' + escapeHTML(activeStatus()) + ' · ' + escapeHTML((it || { front: {} }).front["持仓股数"] || "") + ' 股）。' +
            '想再买，去「变更建仓计划」先把计划调大 —— 变更的是计划，实际成交仍然回到这里录。') + '</div>';
      return el;
    }

    function buildFillForm() {
      const o = effectivePlan();
      const item = trades.open.find(x => x.file === activeFile);
      const code = o.account || o.currency || "CNY", c = CURRENCY[code] || CURRENCY.CNY;
      const planned = num(o.amount);
      const done = tradeFilledTotal(item);                 // 之前累计建了多少
      const batch = num(prep.fillPrice) * num(prep.fillShares);   // 本次这一笔
      const after = done.amount + batch;
      const pctAfter = planned ? after / planned * 100 : 0;
      const remainAfter = Math.max(0, planned - after);
      const diff = planned ? (after - planned) / planned * 100 : 0;
      const isFirst = done.batches === 0;
      const wrap = document.createElement("div");
      wrap.className = "pf-grid";
      wrap.innerHTML =
        '<div class="pf-row wide"><div class="pf-label acct-head"><span>' + escapeHTML(o.symbol || activeFile) + '</span>' +
        '<span class="pf-unit">建仓计划 ' + fmtMoney(planned, code) + '（' + c.sym + ' ' + c.label + '账户' +
        (o._revisions ? ' · 已修订 ' + o._revisions + ' 次' : '') + '）</span></div>' +
        '<div class="pf-hint">' + (isFirst
          ? '建仓可以分多笔。这里填<b>本次这一笔</b>的成交价和股数 —— 没建满就先留在「建仓中」，下次回来接着录。'
          : '这是第 <b>' + (done.batches + 1) + '</b> 笔。已建 <b>' + fmtMoney(done.amount, code) + '</b>（' + fmtShares(done.shares) + ' 股 · 均价 ' + (+done.avgCost.toFixed(4)) + '），' +
            (planned ? '距计划还差 <b>' + fmtMoney(Math.max(0, planned - done.amount), code) + '</b>。' : '')) + '</div></div>' +

        (isFirst ? '' :
          '<div class="pf-row wide"><div class="pf-label">已建仓进度</div>' +
          '<div class="fill-sum ' + (done.amount >= planned && planned ? "ok" : "") + '">' +
          (planned ? (done.amount / planned * 100).toFixed(0) + '%' : '—') +
          '　<span class="sub">' + fmtMoney(done.amount, code) + ' / ' + fmtMoney(planned, code) + '　·　' + done.batches + ' 笔成交</span></div></div>') +

        '<div class="pf-row"><div class="pf-label">本次成交价 <span class="pf-unit">' + c.sym + '</span></div>' +
        '<input class="pf-input" type="number" step="0.01" id="flPrice" value="' + (prep.fillPrice || "") + '" placeholder="0.00" /></div>' +

        '<div class="pf-row"><div class="pf-label">本次股数 / 份额</div>' +
        '<input class="pf-input" type="number" step="1" id="flShares" value="' + (prep.fillShares || "") + '" placeholder="0" />' +
        '<div class="pf-hint">只记股数就够 —— 现价由 YMOS 行情源另行拉取，不在这里手抄。多笔建仓的成本价由系统按加权平均自动算。</div></div>' +

        '<div class="pf-row wide"><div class="pf-label">本次投入 / 累计建仓</div>' +
        '<div class="fill-sum ' + (Math.abs(diff) > 10 && after ? "bad" : (after ? "ok" : "")) + '">' +
        (batch || done.amount
          ? (batch ? fmtMoney(batch, code) + '　' : '') + '<span class="sub">累计 ' + fmtMoney(after, code) +
            (planned ? ' / ' + fmtMoney(planned, code) + '（<b>' + pctAfter.toFixed(0) + '%</b>）' : '') + '</span>'
          : '填完价格和股数就会算出来') +
        '</div>' +
        (planned && after > planned * 1.001
          ? '<div class="pf-hint bad">累计已经<b>超出建仓计划 ' + fmtMoney(after - planned, code) + '</b>（+' + diff.toFixed(1) + '%）。买超本身不被拦，但会如实写进决策文件 —— <b>实际比计划买得多</b>是最常见的一种失控，它通常发生在「盘中看着还会涨」的那一刻。想正大光明地加，去「变更建仓计划」把计划调大。</div>'
          : remainAfter
            ? '<div class="pf-hint">这一笔录完还差 <b>' + fmtMoney(remainAfter, code) + '</b>。不勾下面那个开关，这笔就留在<b>建仓中</b>，首页能看到进度。</div>'
            : '<div class="pf-hint">偏差会如实记录。长期看，这个数比任何一次单笔的对错都更能说明问题。</div>') + '</div>' +

        '<div class="pf-row wide"><div class="pf-label">本笔建仓是否收口</div>' +
        '<label class="pf-check"><input type="checkbox" id="flDone"' + (prep.fillComplete ? " checked" : "") + ' />' +
        '<span><b>这笔建仓已完成</b> —— 转入「持仓中」，不再分批买入</span></label>' +
        '<div class="pf-hint' + (prep.fillComplete ? "" : " bad") + '">' +
        (prep.fillComplete
          ? '收口后状态变成<b>持仓中</b>。之后想再买，要先去「变更建仓计划」把计划调大 —— 那一步有压力测试。'
          : '不勾 = 保持<b>建仓中</b>。' + (done.batches || batch ? '仓位已经真实存在，账户敞口按实际成交算，不会因为「还没建满」而漏掉风险。' : '') +
            '<br>没建满就没建满，别为了让状态好看而假装建完了 —— 这一栏的唯一用途，是让你自己知道<b>手里的计划还有多少没执行</b>。') + '</div></div>' +

        '<div class="pf-row wide"><div class="pf-label">成交备注 <span class="pf-unit">选填</span></div>' +
        '<textarea class="i-text" id="flNote" rows="2" placeholder="这一笔为什么在这个位置买？有没有追价？跟计划不一样的地方，写一句。">' + escapeHTML(prep.fillNote || "") + '</textarea></div>';

      const bind = (id, fn) => {
        const el = wrap.querySelector("#" + id);
        el.addEventListener("input", () => { fn(el.value); updateProgress(); });
        el.addEventListener("change", () => renderMode());
      };
      bind("flPrice", v => prep.fillPrice = num(v));
      bind("flShares", v => prep.fillShares = num(v));
      wrap.querySelector("#flDone").addEventListener("change", e => { prep.fillComplete = e.target.checked; persistPrep(); renderMode(); });
      wrap.querySelector("#flNote").addEventListener("input", e => { prep.fillNote = e.target.value; });
      return wrap;
    }

    /* 已建仓的档案回看：档案本身不可改（append-only），要变更走「调整止损」事件 */
    function renderArchive(scroll) {
      const o = effectivePlan();
      const head = document.createElement("div");
      head.className = "stance-ctx good";
      head.innerHTML = '<span class="sc-icon">📄</span><div>正在回看 <b>' + escapeHTML(activeFile) + '</b> 的建仓档案。' +
        '<span class="sc-msg">要建新的一笔？把顶部持仓选择器切回「未选」。</span></div>';

        const e = document.createElement("div");
        e.className = "stance-ctx none";
        e.innerHTML = '<span class="sc-icon">⏳</span><div>正在读取建仓档案…（读不到的话，这份文件可能是手改过的，缺 <b>ymos-trade-open</b> 数据块）</div>';
        scroll.appendChild(e);
        return;
      }

      const code = o.account || o.currency || "CNY";
      const f = horizonBy(HORIZON_FUND, o.horizonFund), th = horizonBy(HORIZON_THESIS, o.horizonThesis);
      const ec = EXIT_CONTROL[o.exitControl];

        ["最大风险", fmtMoney(num(o.maxLoss), code)],

        ["冷却期", o.coolSkipped ? "⚠️ 已跳过" : "已等满"],

      const box = document.createElement("div");
      box.className = "section";

        '<span class="s-rule all">不可修改</span></div>' +

      scroll.appendChild(box);

      const why = document.createElement("div");

      why.innerHTML =
        '<div class="tip"><span class="tip-icon">🔒</span><div>建仓档案<em>故意不给改</em>。它记录的是「我当时是怎么想的」—— 事后改它，就等于把过去的自己改成跟现在一致，那这份文件就再也证明不了任何事。<br>' +
        '<b>不给改，不等于不能变</b> —— 每一种变更都有自己的入口，走过去就会留下一条事件：<br>' +
        '· 要改<em>投入金额</em>：走 <em>「变更建仓计划」</em>。调大就是加仓（走压力测试），调小是缩减敞口（要写理由）。下限是已经买进去的钱。<br>' +
        '· 要改<em>止损或失效条件</em>：走 <em>「调整止损」</em>。<br>' +
        '· 想<em>就此收手不再买</em>：去 <em>「③ 确认建仓」</em> 勾「这笔建仓已完成」。<br>' +
        '旧的那条永远留在原处 —— 你能看到的不只是最后的决定，还有你是怎么一步步走到那个决定的。</div></div>' +
        '<div class="tip"><span class="tip-icon">📖</span><div>想看完整的事件流（每次加仓 / 止盈 / 调整的正文与理由），去 Reader 侧栏 <em>YMOS → 买入卖出决策</em> 打开这份 md。</div></div>';
      scroll.appendChild(why);
    }

      const el = document.createElement("div");

      el.onclick = () => switchMode("account");
      el.innerHTML = '<span class="sc-icon">🏦</span><div>账户参数还没设 —— <b>资金基数</b>和<b>资金可用期限</b>是结构层的分母，没有它们算不出占比、也判不了期限冲突。<span class="sc-msg">点这里去设 →</span></div>';
      return el;
    }
    function buildTradeNeeded() {
      if (activeFile) return null;
      const el = document.createElement("div");
      el.className = "stance-ctx none";
      el.innerHTML = '<span class="sc-icon">📂</span><div>' +
        (serverOk
          ? '还没选持仓 —— 上方选一笔<b>持仓中 / 建仓中</b>的决策文件，这个动作才知道往哪个文件追加。（没有的话先走「① 买入逻辑 → ② 建仓准备」建一笔。）'
          : '未连本地服务：可以照常勾选做判断，但<b>不会写盘</b>。跑 <b>python3 server.py</b> 后刷新即可。') + '</div>';

        '<br>这里填写的内容不会形成可供 Agent 复盘的 Markdown 真相源。请先在 <b>Console</b> 目录运行 <code>python3 server.py</code>，再从 ' +

    /* ---- 标的：一个字段就够，名称或代码都行 ---- */
    function buildSymbolBar() {
      const wrap = document.createElement("div");
      wrap.className = "pf-grid";
      wrap.innerHTML =
        '<div class="pf-row wide"><div class="pf-label">标的 <span class="pf-unit">名称或代码，写你自己认得的那个</span></div>' +
        '<input class="pf-input" type="text" id="pfSymbol" value="' + escapeHTML(prep.symbol || "") + '" placeholder="例：苹果" />' +
        '<div class="pf-hint">文件名由服务端根据 <b>标的 + Ticker（若有）+ 日期</b> 生成，不接受前端路径。</div></div>' +
        '<div class="pf-row wide"><div class="pf-label">Ticker <span class="pf-unit">选填 · 只为总览拉行情用</span></div>' +
        '<input class="pf-input" type="text" id="pfTicker" value="' + escapeHTML(prep.ticker || "") + '" placeholder="例：AAPL / 688008.SS / 0700.HK" />' +
        '<div class="pf-hint">不填也行 —— 总览会先按标的名去<b>持仓 / Watchlist 状态机</b>里查。查不到才需要在这里补一个。</div></div>';
      const el = wrap.querySelector("#pfSymbol");

      el.addEventListener("change", () => renderMode());
      const tk = wrap.querySelector("#pfTicker");
      tk.addEventListener("input", () => { prep.ticker = tk.value.trim().toUpperCase(); persistPrep(); });
      return wrap;
