<!doctype html>
<html lang="zh" data-edition="open-source-generic">

<head>
  <meta charset="utf-8" />
  <title>买卖决策台 · YMOS V4</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#faf9f5" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="决策台" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg: #faf9f5;
      --bg-sidebar: #f4f2ea;
      --bg-elev: #ffffff;
      --ink: #1f1e1c;
      --ink-2: #4a4844;
      --ink-3: #8a857c;
      --line: #e7e3d8;
      --line-strong: #d8d2c2;
      --accent: #cc785c;
      --accent-ink: #b56247;
      --accent-soft: rgba(204, 120, 92, 0.10);
      --green: #4f7a52;
      --green-soft: rgba(79, 122, 82, 0.10);
      --red: #b0483b;
      --red-soft: rgba(176, 72, 59, 0.09);
      --stance: #5f7d95;
      --stance-soft: rgba(95, 125, 149, 0.12);
      --main-w: 100%;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: grid;
      grid-template-columns: 300px 1fr;
      height: 100vh;
      height: 100dvh;
    }

    body.dragging-col {
      cursor: col-resize;
      user-select: none;
    }

    body.dragging-col * {
      cursor: col-resize !important;
    }

    /* ========== Sidebar ========== */
    aside {
      background: var(--bg-sidebar);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .brand {
      padding: 22px 22px 18px;
      font-family: "Source Serif 4", Georgia, serif;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--ink);
      display: flex;
      align-items: baseline;
      gap: 10px;
      border-bottom: 1px solid var(--line);
    }

    .brand .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex: 0 0 8px;
    }

    .brand .sub {
      margin-left: auto;
      font-family: "Inter", sans-serif;
      font-size: 11px;
      font-weight: 500;
      color: var(--ink-3);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .mode-nav {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0 24px;
    }

    .group-head {
      padding: 18px 22px 6px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    .mode-btn {
      margin: 3px 12px;
      padding: 11px 14px;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 11px;
      color: var(--ink-2);
      transition: background 0.12s, border-color 0.12s;
    }

    .mode-btn:hover {
      background: rgba(204, 120, 92, 0.06);
    }

    .mode-btn.on {
      background: var(--bg-elev);
      border-color: var(--line-strong);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
      color: var(--ink);
    }

    .mode-btn .m-icon {
      width: 26px;
      height: 26px;
      flex: 0 0 26px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      background: rgba(0, 0, 0, 0.04);
    }

    .mode-btn.on.buy .m-icon {
      background: var(--accent-soft);
    }

    .mode-btn.on.sell .m-icon {
      background: var(--green-soft);
    }

    .mode-btn.on.stance .m-icon {
      background: var(--stance-soft);
    }

    .mode-btn .m-txt {
      min-width: 0;
    }

    .mode-btn .m-label {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.25;
    }

    .mode-btn .m-desc {
      font-size: 11px;
      color: var(--ink-3);
      line-height: 1.3;
      margin-top: 1px;
    }

    .mode-btn.on .m-mark {
      margin-left: auto;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex: 0 0 6px;
      background: var(--accent);
    }

    .mode-btn.on.sell .m-mark {
      background: var(--green);
    }

    .mode-btn.on.stance .m-mark {
      background: var(--stance);
    }

    .side-foot {
      padding: 14px 20px 18px;
      border-top: 1px solid var(--line);
      font-size: 11px;
      color: var(--ink-3);
      line-height: 1.6;
    }

    .side-foot b {
      color: var(--ink-2);
      font-weight: 600;
    }

    .side-link {
      display: inline-block;
      margin-top: 8px;
      color: var(--accent-ink);
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      border-bottom: 1px dashed var(--accent-ink);
    }

    /* ========== Main (可拖拽宽度) ========== */
    main {
      position: relative;
      overflow: hidden;
      background: var(--bg);
      min-width: 0;
    }

    .main-col {
      position: relative;
      height: 100vh;
      height: 100dvh;
      width: var(--main-w);
      max-width: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border-right: 1px solid var(--line);
    }

    /* 移动端 / 嵌入版顶栏（桌面独立版隐藏，靠 @media 或 .embedded 打开） */
    .mobile-topbar {
      display: none;
      flex-direction: column;
      gap: 9px;
      flex: 0 0 auto;
      padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
      border-bottom: 1px solid var(--line);
      background: var(--bg-sidebar);
    }

    .mtb-brand {
      font-family: "Source Serif 4", Georgia, serif;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
    }

    .mtb-brand .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      flex: 0 0 7px;
    }

    .mtb-brand .mtb-sub {
      margin-left: auto;
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-3);
      font-family: "Inter", sans-serif;
    }

    .mtb-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .mtb-tabs::-webkit-scrollbar {
      display: none;
    }

    .mtb-chip {
      flex: 0 0 auto;
      padding: 8px 15px;
      border-radius: 20px;
      border: 1px solid var(--line-strong);
      background: var(--bg-elev);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-2);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    .mtb-chip.on.buy {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .mtb-chip.on.sell {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    .mtb-chip.on.stance {
      background: var(--stance);
      border-color: var(--stance);
      color: #fff;
    }

    .resize-handle {
      position: absolute;
      top: 0;
      bottom: 0;
      right: -4px;
      width: 9px;
      cursor: col-resize;
      z-index: 30;
      background: transparent;
      transition: background 0.15s;
    }

    .resize-handle:hover,
    .resize-handle.dragging {
      background: var(--accent-soft);
    }

    .resize-handle::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 3px;
      width: 2px;
      background: transparent;
      border-radius: 2px;
      transition: background 0.15s;
    }

    .resize-handle:hover::after,
    .resize-handle.dragging::after {
      background: var(--accent);
    }

    .resize-grip {
      position: absolute;
      right: -1px;
      top: 50%;
      transform: translateY(-50%);
      width: 5px;
      height: 46px;
      border-radius: 4px;
      z-index: 31;
      background: var(--line-strong);
      opacity: 0.55;
      pointer-events: none;
      transition: opacity 0.15s, background 0.15s;
    }

    .resize-handle:hover~.resize-grip,
    .main-col:hover .resize-grip {
      opacity: 0.9;
    }

    .resize-hint {
      position: absolute;
      right: 12px;
      top: 72px;
      z-index: 40;
      padding: 8px 11px;
      border-radius: 7px;
      background: var(--ink);
      color: #fff;
      font-size: 12px;
      line-height: 1.45;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
      opacity: 0;
      transform: translateX(8px);
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }

    .resize-hint.show {
      opacity: 1;
      transform: translateX(0);
    }

    .head {
      padding: 26px 40px 20px;
      border-bottom: 1px solid var(--line);
    }

    .head .kicker {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent-ink);
      margin-bottom: 8px;
    }

    .head h1 {
      font-family: "Source Serif 4", Georgia, serif;
      font-size: 27px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0 0 8px;
      color: var(--ink);
    }

    .head .tagline {
      font-size: 14px;
      color: var(--ink-2);
      line-height: 1.5;
    }

    .core-banner {
      margin: 20px 40px 0;
      padding: 13px 18px;
      border-radius: 10px;
      background: var(--accent-soft);
      border: 1px solid rgba(204, 120, 92, 0.25);
      font-size: 13.5px;
      color: var(--ink);
      line-height: 1.55;
      display: flex;
      gap: 11px;
      align-items: flex-start;
    }

    .core-banner.sell {
      background: var(--green-soft);
      border-color: rgba(79, 122, 82, 0.25);
    }

    .core-banner .cb-icon {
      flex: 0 0 auto;
      font-size: 16px;
    }

    .core-banner b {
      font-weight: 600;
    }

    .body-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 8px 40px 28px;
    }

    .section {
      margin-top: 26px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .section-title .s-name {
      font-family: "Source Serif 4", Georgia, serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--ink);
    }

    .section-title .s-rule {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 20px;
      letter-spacing: 0.02em;
    }

    .s-rule.all {
      background: var(--accent-soft);
      color: var(--accent-ink);
    }

    .s-rule.any {
      background: var(--green-soft);
      color: var(--green);
    }

    .section-title .s-prog {
      margin-left: auto;
      font-size: 12px;
      color: var(--ink-3);
      font-feature-settings: "tnum";
    }

    .item {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--bg-elev);
      margin-bottom: 9px;
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
      position: relative;
    }

    .item:hover {
      border-color: var(--line-strong);
    }

    .item.checked {
      border-color: rgba(204, 120, 92, 0.4);
      background: rgba(204, 120, 92, 0.035);
    }

    .item.redline {
      border-left: 3px solid var(--red);
    }

    .item.redline.checked {
      border-left-color: var(--red);
      background: var(--red-soft);
      border-color: rgba(176, 72, 59, 0.3);
    }

    .cbox {
      flex: 0 0 22px;
      width: 22px;
      height: 22px;
      margin-top: 1px;
      border-radius: 6px;
      border: 2px solid var(--line-strong);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s;
    }

    .item:hover .cbox {
      border-color: var(--accent);
    }

    .item.checked .cbox {
      background: var(--accent);
      border-color: var(--accent);
    }

    .item.redline.checked .cbox {
      background: var(--red);
      border-color: var(--red);
    }

    .cbox svg {
      width: 13px;
      height: 13px;
      opacity: 0;
      transform: scale(0.6);
      transition: all 0.12s;
    }

    .item.checked .cbox svg {
      opacity: 1;
      transform: scale(1);
    }

    .i-body {
      min-width: 0;
      flex: 1;
    }

    .i-label {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.4;
    }

    .i-label .rl-tag {
      font-size: 10px;
      font-weight: 700;
      color: var(--red);
      border: 1px solid rgba(176, 72, 59, 0.4);
      border-radius: 4px;
      padding: 0 5px;
      margin-left: 8px;
      vertical-align: 1px;
      letter-spacing: 0.03em;
    }

    .i-note {
      font-size: 12.5px;
      color: var(--ink-3);
      line-height: 1.5;
      margin-top: 4px;
    }

    .i-note em {
      color: var(--accent-ink);
      font-style: normal;
      font-weight: 500;
    }

    /* 提示卡（实盘提醒，非勾选项） */
    .tips {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tip {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      border: 1px solid rgba(176, 72, 59, 0.22);
      border-left: 3px solid var(--red);
      border-radius: 10px;
      background: var(--red-soft);
      padding: 12px 15px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--ink-2);
    }

    .tip .tip-icon {
      flex: 0 0 auto;
      font-size: 14px;
      line-height: 1.5;
    }

    .tip em {
      color: var(--red);
      font-style: normal;
      font-weight: 600;
    }

    /* ========== 每日定调：选择表单 ========== */
    .stance {
      padding-top: 6px;
    }

    .stance-q {
      margin-top: 22px;
    }

    .stance-q:first-child {
      margin-top: 8px;
    }

    .stance-q-title {
      font-family: "Source Serif 4", Georgia, serif;
      font-size: 16px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 12px;
    }

    .stance-opts {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .stance-opt {
      display: flex;
      flex-direction: column;
      gap: 3px;
      align-items: flex-start;
      text-align: left;
      padding: 14px 15px;
      border: 1px solid var(--line-strong);
      border-radius: 11px;
      background: var(--bg-elev);
      cursor: pointer;
      font-family: inherit;
      color: var(--ink-2);
      transition: all 0.12s;
    }

    .stance-opt:hover {
      border-color: var(--stance);
    }

    .stance-opt .so-main {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--ink);
    }

    .stance-opt .so-sub {
      font-size: 11.5px;
      color: var(--ink-3);
      line-height: 1.3;
    }

    .stance-opt.on {
      border-color: var(--stance);
      background: var(--stance-soft);
      box-shadow: 0 0 0 1px var(--stance) inset;
    }

    .stance-opt.on .so-sub {
      color: var(--stance);
    }

    .stance-note {
      margin-top: 24px;
      padding: 13px 16px;
      border-radius: 10px;
      background: var(--stance-soft);
      border: 1px solid rgba(95, 125, 149, 0.25);
      font-size: 13px;
      line-height: 1.6;
      color: var(--ink-2);
    }

    .stance-note em {
      color: var(--stance);
      font-style: normal;
      font-weight: 600;
    }

    .stance-plan {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 11px;
      border: 1px solid var(--line-strong);
      background: var(--bg-elev);
      color: var(--ink);
      font-family: inherit;
      font-size: 13.5px;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      min-height: 76px;
    }

    .stance-plan:focus {
      border-color: var(--stance);
      box-shadow: 0 0 0 3px var(--stance-soft);
    }

    .sc-plan {
      display: inline-block;
      margin-top: 5px;
      font-weight: 400;
      color: var(--ink-2);
      font-size: 12.5px;
      line-height: 1.5;
    }

    /* ========== 今日定调条：在其它 tab 顶部动态显示当天参数 ========== */
    .stance-ctx {
      margin: 6px 0 4px;
      padding: 11px 15px;
      border-radius: 10px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 13px;
      line-height: 1.5;
      border: 1px solid var(--line-strong);
      background: var(--bg-elev);
      color: var(--ink-2);
      cursor: pointer;
    }

    .stance-ctx .sc-icon {
      flex: 0 0 auto;
      font-size: 15px;
    }

    .stance-ctx b {
      color: var(--ink);
      font-weight: 600;
    }

    .stance-ctx.none {
      border-style: dashed;
    }

    .stance-ctx.good {
      background: var(--green-soft);
      border-color: rgba(79, 122, 82, 0.3);
    }

    .stance-ctx.good b,
    .stance-ctx.good .sc-msg {
      color: var(--green);
    }

    .stance-ctx.warn {
      background: var(--red-soft);
      border-color: rgba(176, 72, 59, 0.32);
    }

    .stance-ctx.warn b,
    .stance-ctx.warn .sc-msg {
      color: var(--red);
    }

    .stance-ctx .sc-msg {
      font-weight: 600;
    }

    body.embedded .stance-ctx {
      margin: 6px 0;
    }

    /* ========== Action bar（正常流式，固定在列底部） ========== */
    .action-bar {
      flex: 0 0 auto;
      background: var(--bg);
      border-top: 1px solid var(--line);
      padding: 16px 40px;
      display: flex;
      align-items: center;
      gap: 20px;
      z-index: 10;
    }

    .prog-wrap {
      flex: 1;
      min-width: 0;
    }

    .prog-label {
      font-size: 12px;
      color: var(--ink-2);
      margin-bottom: 7px;
      display: flex;
      gap: 8px;
      align-items: baseline;
    }

    .prog-label b {
      font-family: "Source Serif 4", serif;
      font-size: 15px;
      color: var(--ink);
      font-feature-settings: "tnum";
      white-space: nowrap;
      /* 窄屏下别把 "12 / 27" 折成两行 */
    }

    .prog-label .hint {
      color: var(--ink-3);
      font-size: 11.5px;
    }

    .prog-track {
      height: 7px;
      border-radius: 7px;
      background: var(--line);
      overflow: hidden;
    }

    .prog-fill {
      height: 100%;
      border-radius: 7px;
      background: var(--accent);
      width: 0;
      transition: width 0.25s ease;
    }

    .action-bar.sell .prog-fill {
      background: var(--green);
    }

    .action-bar.stance .prog-fill {
      background: var(--stance);
    }

    .fire-btn {
      flex: 0 0 auto;
      padding: 14px 30px;
      border-radius: 10px;
      border: none;
      font-family: "Inter", sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: all 0.14s;
      background: var(--line-strong);
      color: var(--bg-elev);
      white-space: nowrap;
    }

    .fire-btn.locked {
      background: #cfc8b8;
      color: #fff;
      box-shadow: none;
    }

    .fire-btn.ready {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 14px rgba(204, 120, 92, 0.35);
    }

    .action-bar.sell .fire-btn.ready {
      background: var(--green);
      box-shadow: 0 4px 14px rgba(79, 122, 82, 0.32);
    }

    .action-bar.stance .fire-btn.ready {
      background: var(--stance);
      box-shadow: 0 4px 14px rgba(95, 125, 149, 0.32);
    }

    .fire-btn.ready:hover {
      transform: translateY(-1px);
    }

    .fire-btn:active {
      transform: translateY(1px);
    }

    /* ========== Modal ========== */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(31, 30, 28, 0.42);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      transition: opacity 0.16s;
    }

    .overlay.show {
      display: flex;
      opacity: 1;
    }

    .modal {
      width: 100%;
      max-width: 520px;
      background: var(--bg-elev);
      border: 1px solid var(--line-strong);
      border-radius: 16px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.22);
      overflow: hidden;
      transform: translateY(8px) scale(0.99);
      transition: transform 0.18s;
      max-height: 90vh;
      overflow-y: auto;
    }

    .overlay.show .modal {
      transform: none;
    }

    .modal.shake {
      animation: shake 0.45s cubic-bezier(.36, .07, .19, .97) both;
    }

    @keyframes shake {

      10%,
      90% {
        transform: translateX(-1px);
      }

      20%,
      80% {
        transform: translateX(2px);
      }

      30%,
      50%,
      70% {
        transform: translateX(-4px);
      }

      40%,
      60% {
        transform: translateX(4px);
      }
    }

    .m-top {
      padding: 26px 28px 20px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .m-badge {
      flex: 0 0 auto;
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
    }

    .modal.warn .m-badge {
      background: var(--red-soft);
    }

    .modal.pass .m-badge {
      background: var(--green-soft);
    }

    .m-head {
      min-width: 0;
      flex: 1;
    }

    .m-title {
      font-family: "Source Serif 4", Georgia, serif;
      font-size: 21px;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .m-sub {
      font-size: 13.5px;
      color: var(--ink-2);
      line-height: 1.55;
    }

    .m-quote {
      margin: 0 28px;
      padding: 14px 16px;
      border-radius: 10px;
      background: var(--red-soft);
      border-left: 3px solid var(--red);
      font-size: 13.5px;
      color: var(--ink);
      line-height: 1.6;
    }

    .modal.pass .m-quote {
      background: var(--green-soft);
      border-left-color: var(--green);
    }

    .m-list {
      margin: 16px 28px 4px;
    }

    .m-list .ml-head {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 8px;
    }

    .m-list ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .m-list li {
      font-size: 13.5px;
      color: var(--ink);
      padding: 7px 0 7px 24px;
      position: relative;
      border-bottom: 1px dashed var(--line);
      line-height: 1.45;
    }

    .m-list li:last-child {
      border-bottom: none;
    }

    .m-list li::before {
      content: "✗";
      position: absolute;
      left: 4px;
      top: 7px;
      color: var(--red);
      font-weight: 700;
      font-size: 12px;
    }

    .m-list li .li-sec {
      color: var(--ink-3);
      font-size: 11.5px;
      margin-left: 6px;
    }

    .m-actions {
      padding: 18px 28px 24px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .m-btn {
      padding: 11px 20px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      border: 1px solid var(--line-strong);
      background: var(--bg-elev);
      color: var(--ink-2);
    }

    .m-btn:hover {
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    .m-btn.solid {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .m-btn.solid:hover {
      background: var(--accent-ink);
      border-color: var(--accent-ink);
      color: #fff;
    }

    .m-btn.danger {
      background: var(--red);
      color: #fff;
      border-color: var(--red);
    }

    .m-btn.danger:hover {
      background: #97392e;
      border-color: #97392e;
      color: #fff;
    }

    .mini-btn.void {
      margin-left: 6px;
      border-color: rgba(190, 60, 60, 0.35);
      color: #b23b3b;
    }

    .mini-btn.void:hover {
      background: rgba(190, 60, 60, 0.08);
      border-color: rgba(190, 60, 60, 0.55);
    }

    .m-btn.go {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }

    .m-btn.go:hover {
      background: #3f6543;
      border-color: #3f6543;
      color: #fff;
    }

    /* ========== Toast ========== */
    .toast {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: #fff;
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
      z-index: 3000;
      opacity: 0;
      transition: opacity 0.18s, transform 0.18s;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-4px);
    }

    @media (max-width: 820px) {
      body {
        grid-template-columns: 1fr;
      }

      aside {
        display: none;
      }

      .main-col {
        width: 100% !important;
        border-right: none;
      }

      .resize-handle,
      .resize-grip,
      .resize-hint {
        display: none;
      }

      .mobile-topbar {
        display: flex;
      }

      /* 顶栏样式在基础层已定义，这里只负责显示 */

      .head {
        padding: 14px 16px 12px;
      }

      .head .kicker {
        display: none;
      }

      .head h1 {
        font-size: 21px;
        margin-bottom: 6px;
      }

      .head .tagline {
        font-size: 12.5px;
        line-height: 1.45;
      }

      .core-banner {
        margin: 12px 16px 0;
        padding: 11px 14px;
        font-size: 12.5px;
      }

      .body-scroll {
        padding: 4px 16px 20px;
      }

      .section {
        margin-top: 20px;
      }

      .item {
        padding: 13px 14px;
      }

      .action-bar {
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
        gap: 12px;
      }

      .prog-label b {
        font-size: 14px;
      }

      .fire-btn {
        padding: 12px 18px;
        font-size: 14px;
      }

      .overlay {
        padding: 14px;
        align-items: flex-end;
      }

      .modal {
        max-height: 88vh;
        border-radius: 16px 16px 0 0;
      }

      .m-top {
        padding: 20px 20px 16px;
      }

      .m-quote {
        margin: 0 20px;
      }

      .m-list {
        margin: 14px 20px 4px;
      }

      .m-actions {
        padding: 16px 20px calc(18px + env(safe-area-inset-bottom));
      }

      .m-btn {
        flex: 1 1 auto;
        text-align: center;
      }
    }

    /* ========== 顶部上下文条：策略切换 + 持仓选择 ========== */
    .ctx-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }

    .strat-seg {
      display: inline-flex;
      background: var(--bg-sidebar);
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      padding: 3px;
      gap: 3px;
    }

    .strat-btn {
      border: 0;
      background: transparent;
      font: inherit;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-3);
      padding: 6px 13px;
      border-radius: 7px;
      cursor: pointer;
      white-space: nowrap;
    }

    .strat-btn:hover { color: var(--ink-2); }

    .strat-btn.on {
      background: var(--bg-elev);
      color: var(--accent-ink);
      box-shadow: 0 1px 2px rgba(0, 0, 0, .06);
    }

    .pos-pick {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      color: var(--ink-3);
    }

    .pos-pick select {
      font: inherit;
      font-size: 12.5px;
      color: var(--ink);
      background: var(--bg-elev);
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      padding: 6px 9px;
      max-width: 260px;
    }

    .conn-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
      background: var(--red-soft);
      color: var(--red);
      border: 1px solid rgba(176, 72, 59, .28);
    }

    .conn-tag.ok { background: var(--green-soft); color: var(--green); border-color: rgba(79, 122, 82, .28); }

    /* ========== 建仓准备表单 ========== */
    .pf-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      align-items: start;
      /* 不 stretch：否则同一行里最高的那格（选项多的）会把邻居撑成空白大盒子 */
      gap: 12px;
      margin-bottom: 16px;
    }

    .pf-row {
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 13px;
    }

    .pf-row.wide { grid-column: 1 / -1; }

    .pf-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-2);
      margin-bottom: 7px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .pf-label .pf-unit { color: var(--ink-3); font-weight: 500; }

    .pf-input {
      width: 100%;
      font: inherit;
      font-size: 14px;
      color: var(--ink);
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line-strong);
      padding: 4px 0;
      outline: none;
    }

    .pf-input:focus { border-bottom-color: var(--accent); }

    .pf-hint {
      font-size: 11.5px;
      color: var(--ink-3);
      line-height: 1.5;
      margin-top: 7px;
    }

    .pf-hint.bad { color: var(--red); font-weight: 600; }
    .pf-hint.ok { color: var(--green); }

    .pf-opts { display: flex; flex-wrap: wrap; gap: 6px; }

    .pf-opt {
      border: 1px solid var(--line-strong);
      background: var(--bg);
      color: var(--ink-2);
      font: inherit;
      font-size: 12px;
      padding: 5px 11px;
      border-radius: 7px;
      cursor: pointer;
    }

    .pf-opt:hover { border-color: var(--accent); }

    .pf-opt.on {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    .pf-opt.on.neg { background: var(--red); border-color: var(--red); }

    .pf-opt .opt-sub {
      display: block;
      font-size: 10.5px;
      font-weight: 400;
      opacity: .72;
      margin-top: 1px;
    }

    /* ========== 滑块 ========== */
    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pf-range {
      flex: 1 1 auto;
      min-width: 0;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 3px;
      background: var(--line-strong);
      outline: none;
      margin: 8px 0;
    }

    .pf-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg-elev);
      box-shadow: 0 1px 4px rgba(0, 0, 0, .18);
      cursor: grab;
    }

    .pf-range::-webkit-slider-thumb:active { cursor: grabbing; }

    .pf-range::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg-elev);
      cursor: grab;
    }

    .slider-val {
      flex: 0 0 auto;
      min-width: 62px;
      text-align: right;
      font-family: "Source Serif 4", serif;
      font-size: 16px;
      font-weight: 600;
      color: var(--accent-ink);
      font-feature-settings: "tnum";
    }

    .slider-val.dim { color: var(--ink-3); font-weight: 500; }

    .pf-input.num {
      flex: 0 0 auto;
      width: 128px;
      text-align: right;
      font-feature-settings: "tnum";
    }

    .slider-ticks {
      display: flex;
      justify-content: space-between;
      font-size: 10.5px;
      color: var(--ink-3);
      margin-top: -2px;
    }

    .pf-range:disabled { opacity: .4; cursor: not-allowed; }
    .pf-range:disabled::-webkit-slider-thumb { background: var(--ink-3); cursor: not-allowed; }

    .pf-check {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-size: 12.5px;
      color: var(--ink-2);
      cursor: pointer;
      user-select: none;
    }

    .pf-check input { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
    .pf-check b { color: var(--ink); }

    .pf-label.acct-head {
      font-size: 13.5px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 12px;
    }

    /* 跳过冷却期：给短线选手的逃生门，但跳过这件事本身会被记下来 */
    .skip-btn {
      font: inherit;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--accent-ink);
      background: var(--accent-soft);
      border: 1px solid rgba(204, 120, 92, .3);
      border-radius: 6px;
      padding: 3px 9px;
      margin-left: 8px;
      cursor: pointer;
      vertical-align: 1px;
    }

    .skip-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .skip-btn.undo { color: var(--ink-3); background: transparent; border-color: var(--line-strong); }
    .skip-btn.undo:hover { background: var(--bg-sidebar); color: var(--ink-2); }

    .m-tbl.arch td:first-child { color: var(--ink-3); width: 42%; }
    .m-tbl.arch td { border-bottom-color: var(--line); }

    /* ========== Dashboard ========== */
    .tbl-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .m-tbl.dash { min-width: 520px; }
    .m-tbl.dash th { white-space: nowrap; }
    .m-tbl.dash td { white-space: nowrap; font-feature-settings: "tnum"; }
    .m-tbl.dash td .sub { color: var(--ink-3); font-weight: 400; font-size: 11.5px; }
    .m-tbl.dash td.neg, .m-tbl.dash td.neg b { color: var(--red); font-weight: 700; }
    .m-tbl.dash td.up { color: var(--green); font-weight: 700; }
    .m-tbl.dash td.down { color: var(--red); font-weight: 700; }
    .m-tbl.dash td .sub.up { color: var(--green); font-weight: 600; }
    .m-tbl.dash td .sub.down { color: var(--red); font-weight: 600; }

    .stance-ctx .sc-link {
      color: var(--accent-ink);
      font-weight: 600;
      cursor: pointer;
      border-bottom: 1px dashed var(--accent-ink);
    }

    .stance-ctx .sc-link:hover { color: var(--accent); }

    .new-btn {
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 7px;
      padding: 6px 13px;
      margin-top: 8px;
      cursor: pointer;
    }

    .new-btn:hover { background: var(--accent-ink); }

    .new-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12.5px;
      color: var(--ink-3);
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 13px;
      margin-bottom: 14px;
    }

    .new-bar b { color: var(--ink); }
    .new-bar .new-btn { margin-top: 0; }

    /* 回看态：看得见但改不动 —— 那是建仓当时存下来的事实 */
    .item.ro { cursor: default; opacity: .92; }
    .item.ro:hover { border-color: var(--line-strong); }
    .item.ro .cbox { opacity: .8; }
    .item.ro .i-text { background: var(--bg-sidebar); color: var(--ink-2); cursor: default; }

    .empty-note {
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--ink-3);
      padding: 10px 2px 2px;
    }

    .empty-note b { color: var(--ink-2); }

    .flag {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      font-size: 12.5px;
      line-height: 1.6;
      padding: 9px 12px;
      border-radius: 9px;
      margin-bottom: 7px;
      border: 1px solid var(--line-strong);
      color: var(--ink-2);
    }

    .flag.bad { background: var(--red-soft); border-color: rgba(176, 72, 59, .3); }
    .flag.bad b { color: var(--red); }
    .flag.warn { background: var(--bg-elev); }
    .flag.warn b { color: var(--ink); }

    .mini-btn {
      font: inherit;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--accent-ink);
      background: transparent;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      padding: 3px 9px;
      cursor: pointer;
    }

    .mini-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

    .fill-sum {
      font-family: "Source Serif 4", serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--ink);
      padding: 6px 0 2px;
      font-feature-settings: "tnum";
    }

    .fill-sum .sub { font-family: "Inter", sans-serif; font-size: 12.5px; font-weight: 400; color: var(--ink-3); }
    .fill-sum.ok { color: var(--green); }
    .fill-sum.bad { color: var(--red); }
    .fill-sum.bad .sub b { color: var(--red); }

    /* 锁住的步骤：看得见但进不去 —— 逻辑没过，谈钱没有意义 */
    .mode-btn.locked { opacity: .5; }
    .mode-btn.locked:hover { background: transparent; cursor: not-allowed; }

    /* 计算出来的指标卡 —— 数字自己说话，没有「点一下变绿」的入口 */
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .metric {
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      padding: 11px 13px;
      background: var(--bg-elev);
    }

    .metric.ok { background: var(--green-soft); border-color: rgba(79, 122, 82, .3); }
    .metric.bad { background: var(--red-soft); border-color: rgba(176, 72, 59, .32); }

    .mt-val { font-size: 19px; font-weight: 700; letter-spacing: -.3px; }
    .metric.ok .mt-val { color: var(--green); }
    .metric.bad .mt-val { color: var(--red); }
    .mt-label { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }

    /* ========== 条目扩展类型：计算型闸门 / 必填文本 ========== */
    .item.calc { cursor: default; }
    .item.calc:hover { border-color: var(--line-strong); }

    .item.calc .cbox {
      border-radius: 7px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .item.calc.pass .cbox { background: var(--green); border-color: var(--green); color: #fff; }
    .item.calc.fail .cbox { background: var(--red); border-color: var(--red); color: #fff; }
    .item.calc.idle .cbox { background: var(--bg); border-color: var(--line-strong); color: var(--ink-3); }
    .item.calc .cbox svg { display: none; }

    .item.calc.fail { background: var(--red-soft); border-color: rgba(176, 72, 59, .32); }
    .item.calc.pass { background: var(--green-soft); border-color: rgba(79, 122, 82, .28); }

    .calc-detail {
      font-size: 12px;
      font-weight: 600;
      margin-top: 6px;
      color: var(--ink-2);
    }

    .item.calc.fail .calc-detail { color: var(--red); }
    .item.calc.pass .calc-detail { color: var(--green); }

    .item.txt { cursor: default; display: block; }
    .item.txt:hover { border-color: var(--line-strong); }
    .item.txt.filled { background: var(--bg-elev); border-color: var(--line-strong); }

    .i-text {
      width: 100%;
      margin-top: 8px;
      font: inherit;
      font-size: 13px;
      line-height: 1.6;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      padding: 9px 11px;
      resize: vertical;
      outline: none;
    }

    .i-text:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .item.txt.empty .i-text { border-color: rgba(176, 72, 59, .4); }

    .req-tag {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent-ink);
      background: var(--accent-soft);
      border-radius: 4px;
      padding: 2px 5px;
      margin-left: 7px;
      vertical-align: 2px;
    }

    /* ========== 弹窗内的压力测试 / 结果验证表单 ========== */
    .m-tbl {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      margin: 4px 0 2px;
    }

  <script>
    /* =====================================================================
       买卖决策台 · YMOS
       ---------------------------------------------------------------------
       层级关系（别再搞反）：
         买卖决策台 = 投资逻辑层，在前。
         交易计划台 = 操盘手层的执行记录，在后。
       所以这里的闸门只能来自「自己的账户参数 + 这一笔的结构参数」，
       绝不从收盘计划反过来卡决策 —— 下游不能约束上游。

       流程顺序：
         ① 账户参数（一次性，存状态机文件）
         ② 开新仓 · 买入逻辑   ← 先完成论点与可证伪化，立即建立决策文件
         ③ 建仓准备 · 结构层   ← 复核论点，再补齐仓位、退出动作与期限
       两步是同一份建仓决策的分段复核：第一步建档，第二步以追加事件更新。

       两条设计原则：
         · 非对称摩擦：增加风险的方向设闸门，降低风险的方向零摩擦。
         · 计算型红线：结构层由数字判定，界面上没有「点一下变绿」的入口。
       ===================================================================== */
    const CHECK_SVG = '<svg viewBox="0 0 20 20" fill="none"><path d="M4 10.5l4 4 8-9" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    /* ============ 字典 ============ */
    const CURRENCY = {
      CNY: { label: "人民币", sym: "¥", max: 5000000, step: 10000 },
      HKD: { label: "港元", sym: "HK$", max: 5000000, step: 10000 },
      USD: { label: "美元", sym: "$", max: 1000000, step: 5000 },
    };
    // 资金期限按月选：1–120 个月，再加「长期」。显示时自动换成年 / 年+月。
    function fundHorizonLabel(months) {
      if (months >= 9999) return "长期";
      if (months < 12) return months + " 个月";
      const y = Math.floor(months / 12), m = months % 12;
      return y + " 年" + (m ? " " + m + " 个月" : "");
    }
    function normalizeFundKey(key) {
      const legacy = { "1y": "12m", "3y": "36m", "5y": "60m" };
      return legacy[key] || key;
    }
    const HORIZON_FUND = Array.from({ length: 120 }, (_, i) => ({
      key: (i + 1) + "m", label: fundHorizonLabel(i + 1), months: i + 1,
    })).concat([{ key: "long", label: "长期", months: 9999 }]);
    const FUND_TICKS = ["1 月", "1 年", "2 年", "3 年", "5 年", "10 年", "长期"];
    const HORIZON_THESIS = [
      { key: "weeks", label: "数周", months: 1 },
      { key: "q12", label: "1-2 季", months: 6 },
      { key: "m612", label: "6-12 月", months: 12 },
      { key: "y13", label: "1-3 年", months: 36 },
      { key: "y3p", label: "3 年以上", months: 60 },
    ];
    const EXIT_CONTROL = {
      internal: { label: "内生", sub: "无杠杆 / 无到期日", ok: true },
      leverage: { label: "有杠杆 / 融资", sub: "有人能追保平我", ok: false },
      expiry: { label: "有到期日", sub: "期权 / 合约会先死", ok: false },
    };
    const SELL_PORTION = {
      all: { label: "全部清仓", ratio: 1 },
      half: { label: "半仓", ratio: 0.5 },
      third: { label: "三分之一", ratio: 1 / 3 },
    };
    const COOL_MIN = 10;           // 冷却期（分钟）：开始填这笔到扣扳机的最短间隔
    const STRESS_DROP = 0.30;      // 加仓压力测试：再跌 30%

    function horizonBy(list, key) { const k = list === HORIZON_FUND ? normalizeFundKey(key) : key; return list.find(x => x.key === k) || null; }
    function horizonIdx(list, key) { const k = list === HORIZON_FUND ? normalizeFundKey(key) : key; const i = list.findIndex(x => x.key === k); return i < 0 ? -1 : i; }

    /* =====================================================================
       结构层 · RISK_GATE（策略无关，住在「建仓准备」）
       从被逼仓的案例反推：杀死一个人的往往不是看错方向，是结构。
       这几条不问「这个标的会不会涨」，只问「我还在不在牌桌上」。
       r1-r4 是计算型 —— 由数字判定，点不绿。
       ===================================================================== */
    const RISK_GATE = {
      name: "结构层 · 出局资格", rule: "all", note: "策略可以换，这一层不能换。", items: [
        {
          id: "r1", type: "calc", label: "出局权内生", redline: true,
          note: "谁有权强制我平仓？<em>出局条件必须由我自己定义</em>。把「什么时候必须认输」外包给一个利益不一致的第三方（融资追保、期权到期日、杠杆平仓线），就是结构性缺陷 —— 跟看多看空对不对无关。论点还没兑现但合约先死了，是散户版的期限错配。",
          calc: () => {
            if (!prep.exitControl) return { state: "idle", detail: "还没选出局权归属" };
            const e = EXIT_CONTROL[prep.exitControl];
            return e.ok ? { state: "pass", detail: "出局权在我手里" } : { state: "fail", detail: e.label + " —— " + e.sub + "，止损线不是我写的" };
          },
        },
        {
          id: "r2", type: "calc", label: "期限匹配", redline: true,
          note: "论点兑现周期 ≤ 这笔钱的可用期限（该账户在账户参数里定的）。不匹配就是定时炸弹，<em>跟方向对错无关</em> —— 用几个月内要用的钱，去承载一个要跑几年才兑现的叙事，方向再对也会先被时间清算。",
          calc: () => {
            const acc = prepAccount();
            const f = horizonBy(HORIZON_FUND, acc.horizonFund), t = horizonBy(HORIZON_THESIS, prep.horizonThesis);
            if (!f) return { state: "idle", detail: CURRENCY[prep.account].label + "账户还没定资金可用期限" };
            if (!t) return { state: "idle", detail: "还没选论点兑现周期" };
            return f.months >= t.months
              ? { state: "pass", detail: CURRENCY[prep.account].label + "账户可用 " + f.label + " ≥ 论点要跑 " + t.label }
              : { state: "fail", detail: CURRENCY[prep.account].label + "账户只有 " + f.label + "，论点要跑 " + t.label + " —— 期限错配" };
          },
        },
        {
          id: "r3", type: "calc", label: "单笔 ≤ 上限", redline: true,
          note: "单个标的不超过该账户资金基数的既定比例（账户参数里定的，默认 1/3）。这条不讲道理、不看信心 —— <em>信念强度峰值和风险暴露峰值往往是同一时刻</em>，所以上限必须在信念之外。",
          calc: () => {
            const m = metrics();
            if (!m.cap) return { state: "idle", detail: CURRENCY[prep.account].label + "账户还没填资金基数" };
            if (!m.total) return { state: "idle", detail: "还没填投入金额" };
            const pct = (m.ratio * 100).toFixed(1) + "%", cap = (account.maxSingleRatio * 100).toFixed(0) + "%";
            return m.ratio <= account.maxSingleRatio + 1e-9
              ? { state: "pass", detail: "占该账户 " + pct + "（上限 " + cap + "）" }
              : { state: "fail", detail: "占该账户 " + pct + " —— 超出上限 " + cap + "，超了 " + fmtMoney(m.total - m.cap * account.maxSingleRatio) };
          },
        },
        {
          id: "r4", type: "calc", label: "退出条件已定 · 风险可算", redline: true,
          note: "这笔最坏会亏多少、占账户多少 —— 这个数字必须<em>现在</em>就算得出来，不是事到临头再说。<br>不设价格止损也可以（长期 / 左侧建仓），但那意味着<em>出局条件换成了逻辑证伪</em>，最大风险就是这笔投入的全部 —— 那个数字同样要现在就看清楚。",
          calc: () => {
            const m = metrics();
            if (!m.cap || !m.total) return { state: "idle", detail: "资金或投入金额未填全" };
            if (prep.noStop) {
              return { state: "pass", detail: "无价格止损 · 出局条件 = 逻辑证伪；最大风险为本笔全部 " + fmtMoney(m.total) + "（占账户 " + (m.total / m.cap * 100).toFixed(2) + "%）" };
            }
            if (!m.stopPct) return { state: "idle", detail: "还没定止损幅度（或勾选「不设价格止损」）" };
            return { state: "pass", detail: "最大亏 " + fmtMoney(m.maxLoss) + "，占账户 " + (m.lossOfAcct * 100).toFixed(2) + "%" };
          },
        },
        {
          id: "r4b", label: "这个数字我看着不难受", redline: true,
          note: "上面那个金额，如果<em>明天就真的发生</em>，我依然睡得着、不会想加本金扳回来。看着难受，说明仓位太大 —— 回去改数字，别在这里说服自己。",
        },
        {
          id: "r5", label: "相关性坍缩已检查",
          note: "真实分散度是<em>压力下的分散度</em>，不是平时的。检查方式：如果这条主叙事明天被证伪，我组合里还有几个仓位能<em>独立存活</em>？不同公司、不同国家、不同环节，本质上可能是同一笔交易。",
        },
        {
          id: "r6", label: "出局位不在明牌上",
          note: "我的仓位和出局位，对手方推得出来吗？止损放在所有人都看得到的<em>整数关口 / 明显技术位</em>，等于把自己的出局价写在墙上。（不设价格止损的，这条问的是：我的证伪条件会不会被对手方拿来做文章。）",
        },
      ],
    };

    /* 退出逻辑住在「建仓准备」，但不重复「失效信号」：
       失效信号是判断层的可观测证据，这里写证据出现后的执行动作。 */
    const EXIT_GATE = {
      name: "退出动作 · 失效后怎么做", rule: "all", note: "上一步定义「什么证明我错了」，这里只定义「错了以后怎么退」。", items: [
        {
          id: "x4", type: "text", required: true, label: "失效后的退出动作", rows: 4,
          placeholder: "上面的失效信号出现后：立即清仓，还是分步减仓？用收盘确认还是盘中触发？若未证伪但达到价格 / 时间上限，怎么处理？退完后总仓位是多少？",
          note: "这是<em>证据 → 动作</em>的映射，也是投降条款。不要再写一遍失效信号；要写它出现后你必须做什么。",
        },
      ],
    };

    /* 论点：首次住在「买入逻辑」，建仓准备时再复核一次。
       五分钟能勾完的清单会退化成橡皮图章；写不出失效信号的人，写不完这一页。 */
    const THESIS_GATE = {
      name: "论点 · 可证伪化", rule: "all", items: [
        { id: "x1", type: "text", required: true, label: "买入逻辑（一句话）", rows: 2, placeholder: "为什么是它 —— 不是为什么买这个板块。", note: "写不成一句话，说明还没想清楚。" },
        { id: "x2", type: "text", required: true, label: "论点失效证据（可证伪）", rows: 3, placeholder: "例：跌破关键位且 3 日无承接 / 毛利率连续 2 季下滑 / 核心订单被公告证伪。", note: "这里只写<em>什么可观测事实证明论点错了</em>，不写卖出动作。「感觉不对」不是证据。" },
        { id: "x3", type: "text", required: true, label: "催化剂与兑现窗口", rows: 2, placeholder: "什么事发生会让它兑现？大概在什么时间窗口？", note: "没有窗口，下一步就没法判断期限匹配，也没法在到期时诚实地承认没兑现。" },
      ],
    };

    /* 纪律层：住在「买入逻辑」。只用自身可观测的东西，不依赖任何外部计划。 */
    const DISCIPLINE_GATE = {
      name: "纪律层 · 防冲动", rule: "all", items: [
        { id: "d1", label: "不是冲动买回", redline: true, note: "这不是刚<em>止损 / 止盈后</em>的日内买回。若确实要买回：必须重走全部建仓条件 —— <em>这道门能排除约 90% 的买回错误</em>。" },
        {
          id: "d2", type: "calc", skippable: true, label: "冷却期", redline: true,
          note: "从开始审这笔到扣扳机，默认要 " + COOL_MIN + " 分钟。<em>任何能在冲动发生后被快速满足的门槛，都会退化成橡皮图章</em> —— 这一条是给「五分钟写完一份文档来给已做的决定盖章」上的锁。<br>" +
            "<em>短线选手 / 补录历史交易</em>可以跳过：跳过不是作弊，跳过这件事本身会被<em>写进决策文件</em>。事后复盘时，把「跳过冷却期的交易」和「等满的交易」分开看胜率，你就知道这道门对你值不值钱。",
          calc: () => {
            if (prep.coolSkipped) {
              const mins = prep.startedAt ? Math.floor((Date.now() - prep.startedAt) / 60000) : 0;
              return { state: "pass", skipped: true, detail: "已跳过冷却期（实际思考 " + mins + " 分钟）—— 这条会记进决策文件" };
            }
            if (!prep.startedAt) return { state: "idle", detail: "还没开始填这一笔" };
            const mins = Math.floor((Date.now() - prep.startedAt) / 60000);
            return mins >= COOL_MIN
              ? { state: "pass", detail: "已思考 " + mins + " 分钟" }
              : { state: "fail", detail: "才 " + mins + " 分钟，还差 " + (COOL_MIN - mins) + " 分钟" };
          },
        },
      ],
    };

    /* 通用策略中的论点、风险、退出与纪律条目共享同一份输入状态。 */
    [RISK_GATE, EXIT_GATE, THESIS_GATE, DISCIPLINE_GATE].forEach(sec => {
      sec.shared = true;
      sec.items.forEach(it => { it.shared = true; });
    });

    /* =====================================================================
       策略层
       ===================================================================== */
    const STRATEGIES = {
      generic: {
        label: "通用策略", short: "通用",
        desc: "标的无关的标准骨架：判断 / 退出 / 纪律三层",
        modes: {
          buy_new: {
            kicker: "买入 · 开新仓 · 第一步", title: "通用买入逻辑审计",
            tagline: "这是一个<em>不预设打法</em>的骨架：论点与纪律层是所有人共用的，判断层留给你自己的流派。价值、趋势、事件驱动都能往里套 —— 换的是判断依据，不是这套门。",
            fireIdle: "保存买入逻辑 · 建立决策文件 →",
            passTitle: "逻辑门全过", passSub: "论点、失效信号、催化剂窗口都写下来了。下一步谈钱：投多少、止损在哪、跟资金期限冲不冲突。",
            passQuote: "结构层的教训是这个市场里唯一可以从别人的尸体上免费学会的部分 —— Alpha 学不来，风控结构学得来。",
            warnQuote: "还有条件没确认。跳过它们扣扳机，就是在重复上一次的错误 —— 而下一次你连「为什么错」都查不到。",
            sections: [
              {
                name: "判断层 · 为什么是它", rule: "all", items: [
                  { id: "g1", label: "位置与赔率已评估", note: "向下空间 vs 向上空间，我算过。<em>不是因为它涨了所以要买</em>，也不是因为它跌了所以便宜。" },
                  { id: "g2", label: "不是跟随别人的判断", note: "这个决定我能<em>自己讲完整</em>，不需要引用某个人的观点来撑。别人的认知不可转让。" },
                  { id: "g3", label: "已排除「怕踏空」动机", note: "如果这个标的明天涨停但我没买，我会遗憾但不会痛苦 —— 痛苦说明这是 FOMO，不是判断。" },
                ]
              },
            ],
            tips: ["这套骨架不问你是哪一派。它只保证：无论哪一派，你都有可证伪的论点、写下来的退出逻辑、和一个不由别人决定的出局位。"],
          },
          buy_add: {

    function blankAccount() {
      // 分市场账户：人民币 / 港元 / 美元各自有资金基数与可用期限。
      // 单笔上限是全局比例 —— 它是一条纪律，不该按币种打折。
      return {
        version: 4,
        accounts: { CNY: { capital: 0, horizonFund: "" }, HKD: { capital: 0, horizonFund: "" }, USD: { capital: 0, horizonFund: "" } },
        // settlements：已平仓并入资金基数的结转台账。有了它，账户净值里的「已实现盈亏」
        // 才不会和「已经涨进资金基数里的那部分」重复计算。
        maxSingleRatio: 1 / 3, changes: [], settlements: [], updated: "", portfolioSnapshot: null,
      };
    }
    function migrateAccount(a) {
      const b = blankAccount();
      if (!a) return b;
      if (a.accounts) {                       // v2
        for (const k of Object.keys(b.accounts)) if (a.accounts[k]) {
          Object.assign(b.accounts[k], a.accounts[k]);
          b.accounts[k].horizonFund = normalizeFundKey(b.accounts[k].horizonFund);
        }
      } else if (a.capital != null) {         // v1：单账户 → 落到它当时的币种上
        b.accounts[a.currency || "CNY"] = { capital: num(a.capital), horizonFund: normalizeFundKey(a.horizonFund || "") };
      }
      if (a.maxSingleRatio) b.maxSingleRatio = a.maxSingleRatio;
      if (Array.isArray(a.changes)) b.changes = a.changes.slice(-200);
      if (Array.isArray(a.settlements)) b.settlements = a.settlements.slice(-500);
      if (a.updated) b.updated = a.updated;
      if (a.portfolioSnapshot && typeof a.portfolioSnapshot === "object") b.portfolioSnapshot = a.portfolioSnapshot;
      return b;
    }

    /* 条目级存储：通用结构条目走 "shared" 桶，判断条目走 "generic" 桶 */
    function bkey(it, mode) { return (it && it.shared ? "shared" : currentStrategy) + "/" + (mode || currentMode); }
    function bank(store, it, mode) { const k = bkey(it, mode); if (!store[k]) store[k] = {}; return store[k]; }
    function cget(it, mode) { return viewing() ? !!activeChecks[it.id] : !!bank(checks, it, mode)[it.id]; }
    function cset(it, v) { if (!viewing()) bank(checks, it)[it.id] = v; }
    function tget(it, mode) { return viewing() ? (activeTexts[it.id] || "") : (bank(texts, it, mode)[it.id] || ""); }

    /* =====================================================================
       工具
       ===================================================================== */
    function num(v) { const n = parseFloat(v); return isFinite(n) ? n : 0; }
    function todayStr() {
      const d = new Date(), p = n => String(n).padStart(2, "0");
      return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
    }
    function nowStamp() {
      const d = new Date(), p = n => String(n).padStart(2, "0");
      return todayStr() + " " + p(d.getHours()) + ":" + p(d.getMinutes());
    }
    function prepAccount() { return account.accounts[prep.account] || account.accounts.CNY; }
    function cur(code) { return CURRENCY[code || prep.account] || CURRENCY.CNY; }
    function fmtMoney(v, code) {
      if (!isFinite(v)) return "—";
      return cur(code).sym + Math.round(v).toLocaleString("en-US");
    }
    function escapeHTML(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }
    function stripTags(s) { return String(s == null ? "" : s).replace(/<[^>]*>/g, ""); }

    /* 派生指标：一处算，闸门 / 指标卡 / 压力测试 / 写盘都读它 */
    function metrics() {
      const cap = num(prepAccount().capital);
      const base = num(prep.amount);                 // 当前生效的建仓计划
      // 调整建仓计划时，用户填的是「调整后的总额」；增量由它减出来，可正可负。
      const target = num(prep.planTarget) || base;
      const total = currentMode === "buy_add" ? target : base;
      const add = currentMode === "buy_add" ? total - base : num(prep.addAmount);
      const ratio = cap > 0 ? total / cap : 0;
      const stopPct = prep.noStop ? 0 : num(prep.stopPct);
      // 不设价格止损时，最大风险就是这笔投入的全部 —— 出局条件换成了逻辑证伪
      const maxLoss = prep.noStop ? total : total * stopPct / 100;
      // floor = 已建仓金额：计划不能低于已经买进去的钱，那不叫改计划，叫收口。
      const floor = currentMode === "buy_add" ? tradeFilledTotal(activeTradeItem()).amount : 0;
      return {
        cap, base, add, total, ratio, stopPct, maxLoss, floor,
        trimming: currentMode === "buy_add" && add < 0,
        lossOfAcct: cap > 0 ? maxLoss / cap : 0,
      };
    }

    function markStarted() { if (!prep.startedAt) prep.startedAt = Date.now(); persistPrep(); }
