<!doctype html>
<html lang="zh">

<head>
  <meta charset="utf-8" />
  <title>交易计划台 · 盘后动态管理</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#faf9f5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="交易计划台" />
  <!-- 不引任何外部 CDN：完全离线可用，字体走系统栈 -->
  <style>
    :root {
      --bg: #faf9f5;
      --bg-sidebar: #f4f2ea;
      --bg-elev: #ffffff;
      --ink: #1f1e1c;
      --ink-2: #4a4844;
      --ink-3: #8a857c;
      --line: #e7e3d8;
      --line-strong: #d8d2c2;
      --accent: #cc785c;
      --accent-ink: #b56247;
      --accent-soft: rgba(204, 120, 92, 0.10);
      --green: #4f7a52;
      --green-soft: rgba(79, 122, 82, 0.10);
      --red: #b0483b;
      --red-soft: rgba(176, 72, 59, 0.09);
      --stance: #5f7d95;
      --stance-soft: rgba(95, 125, 149, 0.12);
      --gold: #a8802a;
      --gold-soft: rgba(168, 128, 42, 0.12);
      --main-w: 100%;
    }

    * { box-sizing: border-box; }

    body.dragging-col { cursor: col-resize; user-select: none; }
    body.dragging-col * { cursor: col-resize !important; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: grid;
      grid-template-columns: 268px 1fr;
      height: 100vh;
      height: 100dvh;
    }

    /* ========== Sidebar ========== */
    aside {
      background: var(--bg-sidebar);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .brand {
      padding: 22px 22px 18px;
      font-family: "Source Serif 4", Georgia, "Songti SC", serif;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--ink);
      display: flex;
      align-items: baseline;
      gap: 10px;
      border-bottom: 1px solid var(--line);
    }

    .brand .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent); flex: 0 0 8px;
    }

    .brand .sub {
      margin-left: auto;
      font-size: 10px; font-weight: 600;
      color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase;
    }

    .mode-nav { flex: 1; overflow-y: auto; padding: 10px 0 16px; }

    .datepick {
      margin: 12px 14px 4px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .datepick label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); padding-left: 4px; }
    .datepick input {
      font-family: inherit; font-size: 13px;
      padding: 8px 10px; border-radius: 8px;
      border: 1px solid var(--line-strong); background: var(--bg-elev); color: var(--ink);
    }

    .mode-btn {
      margin: 3px 12px;
      padding: 11px 13px;
      border: 1px solid transparent;
      border-radius: 9px;
      cursor: pointer; user-select: none;
      display: flex; align-items: center; gap: 11px;
      color: var(--ink-2);
      transition: background 0.12s, border-color 0.12s;
    }
    .mode-btn:hover { background: rgba(204, 120, 92, 0.06); }
    .mode-btn.on {
      background: var(--bg-elev);
      border-color: var(--line-strong);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
      color: var(--ink);
    }
    .mode-btn .m-icon {
      width: 26px; height: 26px; flex: 0 0 26px;
      border-radius: 7px; display: flex; align-items: center; justify-content: center;
      font-size: 15px; background: rgba(0, 0, 0, 0.04);
    }
    .mode-btn.on .m-icon { background: var(--accent-soft); }
    .mode-btn .m-txt { min-width: 0; }
    .mode-btn .m-label { font-size: 14px; font-weight: 600; line-height: 1.25; }
    .mode-btn .m-desc { font-size: 11px; color: var(--ink-3); line-height: 1.3; margin-top: 1px; }
    .mode-btn .m-count {
      margin-left: auto; font-size: 11px; font-weight: 700;
      color: var(--ink-3); font-feature-settings: "tnum";
      min-width: 18px; text-align: right;
    }

    .side-foot {
      padding: 13px 18px 16px;
      border-top: 1px solid var(--line);
      font-size: 11px; color: var(--ink-3); line-height: 1.6;
    }
    .side-foot b { color: var(--ink-2); font-weight: 600; }
    .side-link {
      display: inline-block; margin-top: 8px;
      color: var(--accent-ink); font-weight: 600; cursor: pointer;
      text-decoration: none; border-bottom: 1px dashed var(--accent-ink);
    }

    /* ========== Main ========== */
    main { position: relative; overflow: hidden; background: var(--bg); min-width: 0; }
    .main-col {
      position: relative; height: 100vh; height: 100dvh;
      width: var(--main-w); max-width: 100%;
      display: flex; flex-direction: column; background: var(--bg);
      border-right: 1px solid var(--line);
    }

    .resize-handle {
      position: absolute; top: 0; bottom: 0; right: -4px; width: 9px;
      cursor: col-resize; z-index: 30; background: transparent; transition: background 0.15s;
    }
    .resize-handle:hover, .resize-handle.dragging { background: var(--accent-soft); }
    .resize-handle::after {
      content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 2px;
      background: transparent; border-radius: 2px; transition: background 0.15s;
    }
    .resize-handle:hover::after, .resize-handle.dragging::after { background: var(--accent); }
    .resize-grip {
      position: absolute; right: -1px; top: 50%; transform: translateY(-50%);
      width: 5px; height: 46px; border-radius: 4px; z-index: 31;
      background: var(--line-strong); opacity: 0.55; pointer-events: none;
      transition: opacity 0.15s, background 0.15s;
    }
    .resize-handle:hover ~ .resize-grip, .main-col:hover .resize-grip { opacity: 0.9; }
    .resize-hint {
      position: absolute; right: 12px; top: 72px; z-index: 40;
      padding: 8px 11px; border-radius: 7px; background: var(--ink); color: #fff;
      font-size: 12px; line-height: 1.45; box-shadow: 0 8px 24px rgba(0,0,0,.16);
      opacity: 0; transform: translateX(8px); pointer-events: none;
      transition: opacity .2s, transform .2s;
    }
    .resize-hint.show { opacity: 1; transform: translateX(0); }

    .mobile-topbar {
      display: none; flex-direction: column; gap: 9px; flex: 0 0 auto;
      padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
      border-bottom: 1px solid var(--line); background: var(--bg-sidebar);
    }
    .mtb-brand {
      font-family: "Source Serif 4", Georgia, "Songti SC", serif; font-size: 16px; font-weight: 600;
      display: flex; align-items: center; gap: 8px; color: var(--ink);
    }
    .mtb-brand .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: 0 0 7px; }
    .mtb-brand .mtb-date { margin-left: auto; font-size: 11px; color: var(--ink-3); }
    .mtb-tabs { display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; scrollbar-width: none; }
    .mtb-tabs::-webkit-scrollbar { display: none; }
    .mtb-chip {
      flex: 0 0 auto; padding: 8px 14px; border-radius: 20px;
      border: 1px solid var(--line-strong); background: var(--bg-elev);
      font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap;
      cursor: pointer; user-select: none;
    }
    .mtb-chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }

    .head { padding: 24px 40px 18px; border-bottom: 1px solid var(--line); }
    .head .kicker {
      font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--accent-ink); margin-bottom: 8px;
    }
    .head h1 {
      font-family: "Source Serif 4", Georgia, "Songti SC", serif; font-size: 25px; font-weight: 600;
      letter-spacing: -0.01em; margin: 0 0 7px; color: var(--ink);
    }
    .head .tagline { font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }

    .body-scroll { flex: 1; overflow-y: auto; padding: 18px 40px 28px; }

    /* ========== 定调条（在审计 tab 顶部显示今日定调） ========== */
    .stance-ctx {
      margin-bottom: 18px; padding: 11px 15px; border-radius: 10px;
      display: flex; gap: 10px; align-items: flex-start;
      font-size: 13px; line-height: 1.5;
      border: 1px solid var(--line-strong); background: var(--bg-elev); color: var(--ink-2);
      cursor: pointer;
    }
    .stance-ctx .sc-icon { flex: 0 0 auto; font-size: 15px; }
    .stance-ctx b { color: var(--ink); font-weight: 600; }
    .stance-ctx.none { border-style: dashed; }
    .stance-ctx.expand { background: var(--accent-soft); border-color: rgba(204,120,92,0.28); }
    .stance-ctx.contract { background: var(--green-soft); border-color: rgba(79,122,82,0.28); }
    .stance-ctx.watch { background: var(--stance-soft); border-color: rgba(95,125,149,0.28); }

    /* 今日执行偏差回顾（收盘定调顶部） */
    .dash-dev { margin-bottom: 20px; padding: 12px 15px; border-radius: 10px; display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.55; border: 1px solid var(--line-strong); background: var(--bg-elev); color: var(--ink-2); }
    .dash-dev .dd-icon { flex: 0 0 auto; font-size: 15px; }
    .dash-dev b { color: var(--ink); font-weight: 600; }
    .dash-dev a { color: var(--accent-ink); font-weight: 600; cursor: pointer; border-bottom: 1px dashed var(--accent-ink); }
    .dash-dev.loading { color: var(--ink-3); border-style: dashed; }
    .dash-dev.none { border-style: dashed; }
    .dash-dev.ok { background: var(--green-soft); border-color: rgba(79, 122, 82, 0.3); }
    .dash-dev.ok b { color: var(--green); }
    .dash-dev.warn { background: var(--red-soft); border-color: rgba(176, 72, 59, 0.32); }
    .dash-dev.warn b { color: var(--red); }

    /* ========== Dashboard 定调表单 ========== */
    .stance-q { margin-top: 22px; }
    .stance-q:first-child { margin-top: 4px; }
    .stance-q-title {
      font-family: "Source Serif 4", Georgia, "Songti SC", serif; font-size: 16px; font-weight: 600;
      color: var(--ink); margin-bottom: 11px;
      display: flex; align-items: baseline; gap: 9px;
    }
    .stance-q-title .qh { font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; font-size: 11px; color: var(--ink-3); font-weight: 500; }
    .stance-opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .stance-opt {
      display: flex; flex-direction: column; gap: 3px; align-items: flex-start; text-align: left;
      padding: 13px 14px; border: 1px solid var(--line-strong); border-radius: 11px;
      background: var(--bg-elev); cursor: pointer; font-family: inherit; color: var(--ink-2);
      transition: all 0.12s;
    }
    .stance-opt:hover { border-color: var(--stance); }
    .stance-opt .so-main { font-size: 14px; font-weight: 600; color: var(--ink); }
    .stance-opt .so-sub { font-size: 11px; color: var(--ink-3); line-height: 1.3; }
    .stance-opt.on { border-color: var(--stance); background: var(--stance-soft); box-shadow: 0 0 0 1px var(--stance) inset; }
    .stance-opt.on .so-sub { color: var(--stance); }
    /* 语义色：上涨/risk-on/扩张=accent，下跌/off/收缩=green(卖)，震荡/chaos/观望=stance */
    .stance-opt.on.pos { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent) inset; }
    .stance-opt.on.pos .so-sub { color: var(--accent-ink); }
    .stance-opt.on.neg { border-color: var(--green); background: var(--green-soft); box-shadow: 0 0 0 1px var(--green) inset; }
    .stance-opt.on.neg .so-sub { color: var(--green); }

    .stance-note {
      margin-top: 26px; padding: 13px 16px; border-radius: 10px;
      background: var(--stance-soft); border: 1px solid rgba(95, 125, 149, 0.25);
      font-size: 13px; line-height: 1.6; color: var(--ink-2);
    }
    .stance-note em { color: var(--stance); font-style: normal; font-weight: 600; }

    .field-note {
      width: 100%; box-sizing: border-box; margin-top: 22px;
      padding: 12px 14px; border-radius: 11px; border: 1px solid var(--line-strong);
      background: var(--bg-elev); color: var(--ink); font-family: inherit;
      font-size: 13.5px; line-height: 1.6; resize: vertical; outline: none; min-height: 70px;
    }
    .field-note:focus { border-color: var(--stance); box-shadow: 0 0 0 3px var(--stance-soft); }

    /* ========== 审计卡片 ========== */
    .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .toolbar .tb-title { font-family: "Source Serif 4", Georgia, "Songti SC", serif; font-size: 17px; font-weight: 600; }
    .add-form { display: flex; gap: 8px; margin-left: auto; }
    .add-form input {
      font-family: inherit; font-size: 13px; padding: 8px 12px; width: 170px;
      border-radius: 8px; border: 1px solid var(--line-strong); background: var(--bg-elev); color: var(--ink);
    }
    .add-form input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .btn {
      font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
      padding: 8px 15px; border-radius: 8px; border: 1px solid var(--line-strong);
      background: var(--bg-elev); color: var(--ink-2); white-space: nowrap;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent-ink); }
    .btn.solid { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.solid:hover { background: var(--accent-ink); color: #fff; }
    .btn.green { background: var(--green); border-color: var(--green); color: #fff; }
    .btn.green:hover { background: #3f6543; color: #fff; }

    .empty {
      padding: 34px 20px; text-align: center; color: var(--ink-3); font-size: 13px;
      border: 1px dashed var(--line-strong); border-radius: 12px; line-height: 1.6;
    }

    .card {
      border: 1px solid var(--line); border-radius: 13px; background: var(--bg-elev);
      margin-bottom: 14px; overflow: hidden;
    }
    .card.flag { border-color: rgba(176, 72, 59, 0.35); }
    .card-head {
      display: flex; align-items: center; gap: 10px; padding: 13px 16px;
      border-bottom: 1px solid var(--line); background: rgba(0,0,0,0.012);
    }
    .card-name {
      font-family: inherit; font-size: 15px; font-weight: 700; color: var(--ink);
      border: none; background: transparent; outline: none; min-width: 0; flex: 0 1 auto; width: auto;
      padding: 3px 5px; border-radius: 6px;
    }
    .card-name:focus { background: var(--accent-soft); }
    .card-badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge {
      font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 20px; letter-spacing: 0.02em;
    }
    .badge.warn { background: var(--red-soft); color: var(--red); }
    .badge.good { background: var(--green-soft); color: var(--green); }
    .badge.plan { background: var(--stance-soft); color: var(--stance); }
    .card-del {
      margin-left: auto; flex: 0 0 auto; cursor: pointer; border: none; background: transparent;
      color: var(--ink-3); font-size: 17px; line-height: 1; padding: 4px 6px; border-radius: 6px;
    }
    .card-del:hover { background: var(--red-soft); color: var(--red); }

    .card-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }

    /* 质检勾选行 */
    .quality { display: flex; gap: 9px; flex-wrap: wrap; }
    .qchk {
      display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none;
      padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line-strong);
      background: var(--bg); font-size: 12.5px; font-weight: 600; color: var(--ink-2);
      transition: all 0.12s;
    }
    .qchk .box {
      width: 17px; height: 17px; flex: 0 0 17px; border-radius: 5px;
      border: 2px solid var(--line-strong); display: flex; align-items: center; justify-content: center;
    }
    .qchk .box svg { width: 10px; height: 10px; opacity: 0; }
    .qchk.on { border-color: var(--green); background: var(--green-soft); color: var(--green); }
    .qchk.on .box { background: var(--green); border-color: var(--green); }
    .qchk.on .box svg { opacity: 1; }
    .qchk.redline.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
    .qchk.redline.on .box { background: var(--accent); border-color: var(--accent); }

    /* 下拉行 */
    .selrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .selcell { display: flex; flex-direction: column; gap: 4px; }
    .selcell label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
    .selcell select {
      font-family: inherit; font-size: 13px; padding: 8px 10px; border-radius: 8px;
      border: 1px solid var(--line-strong); background: var(--bg-elev); color: var(--ink); cursor: pointer;
    }
    .selcell select:focus { outline: none; border-color: var(--accent); }

    .action-row { display: flex; flex-direction: column; gap: 4px; }
    .action-row label {
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3);
      display: flex; align-items: center; gap: 8px;
    }
    .action-row .suggest { color: var(--accent-ink); font-weight: 600; cursor: pointer; text-transform: none; letter-spacing: 0; }
    .action-row input {
      font-family: inherit; font-size: 13.5px; padding: 9px 12px; border-radius: 8px;
      border: 1px solid var(--line-strong); background: var(--bg-elev); color: var(--ink);
    }
    .action-row input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    /* 情景预案（高开/低走压力测试） */
    .scenario { display: flex; flex-direction: column; gap: 7px; padding-top: 12px; border-top: 1px dashed var(--line); }
    .scenario .sc-title { font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); display: flex; align-items: baseline; gap: 8px; }
    .scenario .sc-title .sc-hint { font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--ink-3); }
    .scenario .sc-row { display: flex; align-items: center; gap: 8px; }
    .scenario .sc-tag { flex: 0 0 auto; font-size: 11.5px; font-weight: 700; padding: 6px 10px; border-radius: 8px; white-space: nowrap; }
    .scenario .sc-tag.high { background: var(--accent-soft); color: var(--accent-ink); }
    .scenario .sc-tag.low { background: var(--green-soft); color: var(--green); }
    .scenario input { flex: 1; min-width: 0; font-family: inherit; font-size: 13px; padding: 8px 11px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--bg-elev); color: var(--ink); }
    .scenario input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    /* ========== 明日动作汇总 ========== */
    .summary-stance {
      padding: 16px 18px; border-radius: 12px; margin-bottom: 22px;
      background: var(--bg-elev); border: 1px solid var(--line-strong);
      display: flex; align-items: center; gap: 14px;
    }
    .summary-stance .ss-icon { font-size: 26px; }
    .summary-stance .ss-main { font-family: "Source Serif 4", Georgia, "Songti SC", serif; font-size: 19px; font-weight: 600; color: var(--ink); }
    .summary-stance .ss-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
    .summary-stance.expand { background: var(--accent-soft); border-color: rgba(204,120,92,0.3); }
    .summary-stance.contract { background: var(--green-soft); border-color: rgba(79,122,82,0.3); }
    .summary-stance.watch { background: var(--stance-soft); border-color: rgba(95,125,149,0.3); }

    .micro-group { margin-bottom: 20px; }
    .micro-group h3 {
      font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--ink-3); margin: 0 0 10px;
    }
    .micro {
      display: flex; align-items: flex-start; gap: 12px; padding: 12px 15px;
      border: 1px solid var(--line); border-left: 3px solid var(--stance); border-radius: 10px;
      background: var(--bg-elev); margin-bottom: 8px;
    }
    .micro.buy { border-left-color: var(--accent); }
    .micro.sell { border-left-color: var(--green); }
    .micro .mi-name { font-weight: 700; color: var(--ink); flex: 0 0 auto; min-width: 84px; }
    .micro .mi-plan {
      flex: 0 0 auto; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 20px;
      background: var(--stance-soft); color: var(--stance); align-self: flex-start; margin-top: 1px;
    }
    .micro.buy .mi-plan { background: var(--accent-soft); color: var(--accent-ink); }
    .micro.sell .mi-plan { background: var(--green-soft); color: var(--green); }
    .micro .mi-action { color: var(--ink-2); line-height: 1.5; }
    .micro .mi-flag { color: var(--red); font-size: 11.5px; margin-top: 3px; }

    /* ========== 今日交易计划（执行台）========== */
    .exec-src {
      font-size: 12px; color: var(--ink-3); margin-top: 4px;
    }
    .exec-src b { color: var(--ink-2); font-weight: 600; }
    .exec-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
    .exec-meta .chip {
      font-size: 12px; font-weight: 600; padding: 4px 11px; border-radius: 20px;
      background: var(--bg); border: 1px solid var(--line-strong); color: var(--ink-2);
    }

    .ritual {
      margin-bottom: 22px; border: 1px solid rgba(204, 120, 92, 0.28); border-radius: 13px;
      background: var(--accent-soft); overflow: hidden;
    }
    .ritual-head {
      padding: 12px 16px; font-family: "Source Serif 4", Georgia, "Songti SC", serif; font-size: 15px; font-weight: 600;
      color: var(--accent-ink); border-bottom: 1px solid rgba(204, 120, 92, 0.2);
      display: flex; align-items: center; gap: 9px;
    }
    .ritual-head .rh-hint { margin-left: auto; font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; font-size: 11px; font-weight: 500; color: var(--ink-3); }
    .ritual-body { padding: 8px 10px 12px; }
    .ritual-step {
      display: flex; align-items: flex-start; gap: 12px; padding: 11px 12px; border-radius: 9px;
      cursor: pointer; user-select: none; transition: background 0.12s;
    }
    .ritual-step:hover { background: rgba(204, 120, 92, 0.06); }
    .ritual-step .rs-box {
      flex: 0 0 22px; width: 22px; height: 22px; margin-top: 1px; border-radius: 7px;
      border: 2px solid rgba(204, 120, 92, 0.5); background: var(--bg-elev);
      display: flex; align-items: center; justify-content: center;
    }
    .ritual-step .rs-box svg { width: 13px; height: 13px; opacity: 0; transform: scale(0.6); transition: all 0.12s; }
    .ritual-step.on .rs-box { background: var(--accent); border-color: var(--accent); }
    .ritual-step.on .rs-box svg { opacity: 1; transform: scale(1); }
    .ritual-step .rs-txt { min-width: 0; }
    .ritual-step .rs-main { font-size: 14px; font-weight: 600; color: var(--ink); line-height: 1.4; }
    .ritual-step.on .rs-main { color: var(--ink-3); text-decoration: line-through; }
    .ritual-step .rs-sub { font-size: 12px; color: var(--ink-3); line-height: 1.45; margin-top: 2px; }
    .ritual-foot {
      padding: 10px 16px; border-top: 1px dashed rgba(204, 120, 92, 0.25);
      font-size: 12.5px; color: var(--accent-ink); line-height: 1.5; background: rgba(204, 120, 92, 0.04);
    }

    .exec-item {
      display: flex; align-items: flex-start; gap: 12px; padding: 12px 15px;
      border: 1px solid var(--line); border-left: 3px solid var(--stance); border-radius: 10px;
      background: var(--bg-elev); margin-bottom: 8px; cursor: pointer; transition: opacity 0.15s;
    }
    .exec-item.buy { border-left-color: var(--accent); }
    .exec-item.sell { border-left-color: var(--green); }
    .exec-item .ex-box {
      flex: 0 0 20px; width: 20px; height: 20px; margin-top: 1px; border-radius: 6px;
      border: 2px solid var(--line-strong); background: var(--bg);
      display: flex; align-items: center; justify-content: center;
    }
    .exec-item .ex-box svg { width: 11px; height: 11px; opacity: 0; }
    .exec-item.done { opacity: 0.55; }
    .exec-item.done .ex-box { background: var(--ink-3); border-color: var(--ink-3); }
    .exec-item.done .ex-box svg { opacity: 1; }
    .exec-item.done .ex-name, .exec-item.done .ex-action { text-decoration: line-through; }
    .exec-item .ex-name { font-weight: 700; color: var(--ink); flex: 0 0 auto; min-width: 84px; }
    .exec-item .ex-plan {
      flex: 0 0 auto; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 20px;
      background: var(--stance-soft); color: var(--stance); align-self: flex-start; margin-top: 1px;
    }
    .exec-item.buy .ex-plan { background: var(--accent-soft); color: var(--accent-ink); }
    .exec-item.sell .ex-plan { background: var(--green-soft); color: var(--green); }
    .exec-item .ex-body { min-width: 0; flex: 1; }
    .exec-item .ex-action { color: var(--ink-2); line-height: 1.5; }
    .exec-item .ex-flag { color: var(--red); font-size: 11.5px; margin-top: 3px; }

    .reminders {
      margin-top: 22px; border: 1px solid var(--line); border-radius: 12px;
      background: var(--bg-elev); padding: 14px 18px;
    }
    .reminders h3 {
      font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--ink-3); margin: 0 0 10px;
    }
    .reminders ul { margin: 0; padding: 0; list-style: none; }
    .reminders li {
      font-size: 13px; color: var(--ink-2); line-height: 1.5; padding: 6px 0 6px 20px; position: relative;
    }
    .reminders li::before { content: "▪"; position: absolute; left: 4px; top: 6px; color: var(--stance); }
    .reminders li em { color: var(--accent-ink); font-style: normal; font-weight: 600; }

    .exec-cta {
      margin-top: 22px; text-align: center; font-size: 13px; color: var(--ink-3); line-height: 1.6;
    }
    .exec-cta a { color: var(--accent-ink); font-weight: 600; cursor: pointer; border-bottom: 1px dashed var(--accent-ink); }

    /* 执行台数据源选择器 */
    .exec-src-pick { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .exec-src-pick select {
      font-family: inherit; font-size: 12.5px; padding: 7px 10px; border-radius: 8px;
      border: 1px solid var(--line-strong); background: var(--bg-elev); color: var(--ink); cursor: pointer; max-width: 210px;
    }
    .exec-src-pick select:focus { outline: none; border-color: var(--accent); }

    /* 实际盘面确认卡 */
    .actual-card {
      border: 1px solid var(--line-strong); border-radius: 12px; background: var(--bg-elev);
      padding: 14px 16px; margin-bottom: 20px;
    }
    .actual-card > h3 {
      font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: var(--ink-2);
      margin: 0 0 12px; display: flex; align-items: baseline; gap: 8px;
    }
    .actual-card > h3 .ah-hint { font-size: 11px; font-weight: 500; color: var(--ink-3); letter-spacing: 0; }
    .actual-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .actual-grid .selcell label { display: flex; flex-direction: column; gap: 1px; }
    .actual-grid .selcell .pred { font-size: 10px; font-weight: 500; color: var(--ink-3); text-transform: none; letter-spacing: 0; }
    .actual-grid .selcell.diff select { border-color: var(--red); background: var(--red-soft); color: var(--red); font-weight: 600; }
    .actual-note {
      width: 100%; box-sizing: border-box; margin-top: 12px; padding: 10px 12px; border-radius: 9px;
      border: 1px solid var(--line-strong); background: var(--bg); color: var(--ink);
      font-family: inherit; font-size: 13px; line-height: 1.5; resize: vertical; outline: none; min-height: 54px;
    }
    .actual-note:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--bg-elev); }

    /* 执行条目：勾执行 + 预期 + 实际输入 */
    .exec-item .ex-box { cursor: pointer; }
    .ex-main { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .ex-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .ex-plan-line { font-size: 12.5px; color: var(--ink-3); line-height: 1.45; }
    .ex-plan-line b { color: var(--ink-2); font-weight: 600; }
    .ex-actual {
      font-family: inherit; font-size: 13px; padding: 8px 11px; border-radius: 8px;
      border: 1px solid var(--line-strong); background: var(--bg); color: var(--ink); width: 100%; box-sizing: border-box;
    }
    .ex-actual:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--bg-elev); }
    .exec-item.done .ex-name { text-decoration: line-through; color: var(--ink-3); }
    .exec-item.done .ex-actual { text-decoration: none; }
    .ex-scenario { font-size: 12px; color: var(--ink-2); line-height: 1.7; padding: 6px 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
    .ex-scenario .es-tag { font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 12px; margin-right: 6px; }
    .ex-scenario .es-tag.high { background: var(--accent-soft); color: var(--accent-ink); }
    .ex-scenario .es-tag.low { background: var(--green-soft); color: var(--green); }

    /* 计划外动作 */
    .extra-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .extra-row .extra-name, .extra-row .extra-note {
      font-family: inherit; font-size: 13px; padding: 8px 11px; border-radius: 8px;
      border: 1px solid var(--line-strong); background: var(--bg-elev); color: var(--ink);
    }
    .extra-row .extra-name { flex: 0 0 130px; }
    .extra-row .extra-note { flex: 1; min-width: 0; }
    .extra-row .extra-name:focus, .extra-row .extra-note:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .extra-row .extra-del {
      flex: 0 0 auto; cursor: pointer; border: none; background: transparent; color: var(--ink-3);
      font-size: 15px; line-height: 1; padding: 6px 8px; border-radius: 6px;
    }
    .extra-row .extra-del:hover { background: var(--red-soft); color: var(--red); }

    /* 执行台两列布局：容器查询——按正文实际宽度(拖拽后)决定单列/两列 */
    .today-wrap { container-type: inline-size; }
    .today-grid { display: grid; grid-template-columns: 1fr; gap: 22px; }
    .today-side { display: flex; flex-direction: column; gap: 0; }
    .today-side .ritual, .today-side .reminders { margin-top: 0; }
    .today-side .reminders { margin-top: 18px; }
    @container (min-width: 820px) {
      .today-grid { grid-template-columns: minmax(0, 1fr) 322px; gap: 26px; align-items: start; }
      .today-side { position: sticky; top: 4px; }
      /* 两列时右栏元素自身不再留顶距，靠 grid gap 对齐 */
      .today-main > *:first-child { margin-top: 0; }
    }

    /* ========== Action bar ========== */
    .action-bar {
      flex: 0 0 auto; background: var(--bg); border-top: 1px solid var(--line);
      padding: 14px 40px; display: flex; align-items: center; gap: 16px;
    }
    .action-bar .ab-info { flex: 1; min-width: 0; font-size: 12.5px; color: var(--ink-3); line-height: 1.5; }
    .action-bar .ab-info b { color: var(--ink-2); }
    .export-group { flex: 0 0 auto; display: flex; gap: 6px; }
    .exp-btn {
      padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--card, #fff); color: var(--ink-2); cursor: pointer;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 12.5px; font-weight: 600; white-space: nowrap;
    }
    .exp-btn:hover { border-color: var(--ink-3); color: var(--ink-1); }
    .exp-btn:active { transform: translateY(1px); }
    /* vault 连接状态条：未连时提醒「只是本地暂存」 */
    .vault-bar {
      flex: 0 0 auto; display: none; align-items: center; gap: 8px;
      padding: 8px 40px; font-size: 12.5px; line-height: 1.4;
      background: #fdf6e3; color: #8a6d1f; border-top: 1px solid #efe2bd;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }
    .vault-bar.show { display: flex; }
    .vault-bar code { background: rgba(0, 0, 0, .06); padding: 1px 5px; border-radius: 4px; }
    @media print {
      aside, .action-bar, .mobile-topbar, .vault-bar, .resize-handle, .resize-grip { display: none !important; }
      .body-scroll { overflow: visible !important; height: auto !important; }
      main, .main-col { width: 100% !important; max-width: none !important; }
    }
    .save-btn {
      flex: 0 0 auto; padding: 13px 26px; border-radius: 10px; border: none;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; font-size: 14.5px; font-weight: 700; cursor: pointer;
      background: var(--accent); color: #fff; box-shadow: 0 4px 14px rgba(204, 120, 92, 0.3);
      transition: all 0.14s; white-space: nowrap;
    }
    .save-btn:hover { transform: translateY(-1px); }
    .save-btn:active { transform: translateY(1px); }
    .save-btn.busy { opacity: 0.6; pointer-events: none; }

    /* ========== Toast ========== */
    .toast {
      position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
      background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18); z-index: 3000; opacity: 0;
      transition: opacity 0.18s, transform 0.18s; pointer-events: none; max-width: 80vw; text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
    .toast.warn { background: var(--red); }
    .toast.ok { background: var(--green); }

    @media (max-width: 860px) {
      body { grid-template-columns: 1fr; }
      aside { display: none; }
      .main-col { width: 100% !important; border-right: none; }
      .resize-handle, .resize-grip, .resize-hint { display: none; }
      .mobile-topbar { display: flex; }
      .head { padding: 14px 16px 12px; }
      .head .kicker { display: none; }
      .head h1 { font-size: 20px; }
      .head .tagline { font-size: 12.5px; }
      .body-scroll { padding: 14px 16px 20px; }
      .stance-opts { gap: 8px; }
      .stance-opt { padding: 11px; }
      .selrow { grid-template-columns: 1fr; }
      .add-form input { width: 130px; }
      .action-bar { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
      .summary-stance { flex-wrap: wrap; }
    }
  </style>
</head>

<body>
  <aside>
    <div class="brand">
      <span class="dot"></span>
      <span>交易计划台</span>
      <span class="sub">盘后</span>
    </div>
    <div class="datepick">
      <label>复盘日期</label>
      <input type="date" id="dateInput" />
    </div>
    <div class="mode-nav" id="modeNav"></div>
    <div class="side-foot">
      决策全在 <b>盘后冷静期</b> 做完；开盘只执行、不改逻辑。<br>
      标的是 <b>常驻名单</b>，跨天保留；每天只更新趋势 / 计划 / 动作。<br>
      <b>这是一份可修改样板</b>：可让你的 Agent / 编程工具按自己的周期、偏好和目录继续改。<br>
      <a class="side-link" href="/reader" data-file-href="reader.html">Reader</a> ·
      <a class="side-link" id="openSop" href="/sop" data-file-href="新高买卖决策台.html" target="_blank" rel="noopener">新高决策台</a> ·
      <a class="side-link" href="/" data-file-href="index.html">Console 首页</a>
    </div>
  </aside>

  <main>
    <div class="main-col" id="mainCol">
      <div class="mobile-topbar">
        <div class="mtb-brand">
          <span class="dot"></span>
          <span>交易计划台</span>
          <span class="mtb-date" id="mtbDate"></span>
        </div>
        <div class="mtb-tabs" id="mobileTabs"></div>
      </div>
      <div class="head">
        <div class="kicker" id="kicker"></div>
        <h1 id="title"></h1>
        <div class="tagline" id="tagline"></div>
      </div>
      <div class="body-scroll" id="bodyScroll"></div>
      <div class="vault-bar" id="vaultBar">
        <span>⚪️ <b>未连接 vault</b> —— 当前只在浏览器本地暂存。想让计划写回你自己的 Obsidian：在 Console 目录跑
          <code>python3 server.py</code>，然后从 <code>http://localhost:5273</code> 打开本页。</span>
      </div>
      <div class="action-bar">
        <div class="ab-info" id="abInfo"></div>
        <div class="export-group">
          <button class="exp-btn" id="expMd" title="下载 .md 文件，可直接拖进任意 Obsidian vault">⬇️ .md</button>
          <button class="exp-btn" id="expCopy" title="复制 Markdown 到剪贴板">📋 复制</button>
          <button class="exp-btn" id="expJson" title="导出结构化 JSON，给其他工具或 Agent 消费">{ } JSON</button>
          <button class="exp-btn" id="expPrint" title="打印 / 存为 PDF">🖨️</button>
        </div>
        <button class="save-btn" id="saveBtn">💾 保存今日收盘复盘</button>
      </div>
      <div class="resize-handle" id="resizeRight" title="拖动调整正文宽度 · 双击复位"></div>
      <div class="resize-grip"></div>
      <div class="resize-hint" id="resizeHint">↔ 这里可以拖动调宽<br>双击恢复 75% 默认宽度</div>
    </div>
  </main>

  <script>
    const CHECK_SVG = '<svg viewBox="0 0 20 20" fill="none"><path d="M4 10.5l4 4 8-9" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    /* ============ 选项字典 ============ */
    const TREND3 = { up: "🔺 上涨", down: "🔻 下跌", range: "◼ 震荡" };        // 大盘 / 板块大趋势
    const SMALL = { up: "🔺 上涨", down: "🔻 下跌", chaos: "🌀 混沌" };         // 当前小趋势
    const MOOD = { on: "🟢 Risk-on", chaos: "🟡 Chaos", off: "🔴 Risk-off" };  // 明日情绪预演
    const STANCE = {
      expand: { main: "扩张 · 盯买点", sub: "按计划买 / 加", icon: "🚀", cls: "pos" },
      watch: { main: "观望 · 少动", sub: "只做预设的 T", icon: "🕊", cls: "" },
      contract: { main: "收缩 · 盯卖点", sub: "止盈 / 止损", icon: "🛡", cls: "neg" },
    };

    const BIG_TREND = { newhigh: "新高", pullback: "回调", range: "震荡", down: "下跌" };       // 持仓/观察 大趋势
    const SMALL_TREND = { newhigh: "新高上涨", rebound: "反弹", down: "下跌" };                 // 小趋势
    const HOLD_PLAN = { hold: "持有", add: "开仓/加仓", tp: "止盈", sl: "止损", reduce: "减仓" };
    const WATCH_PLAN = { watchbuy: "盯买点", watchonly: "只观察" };

    // 自动建议动作
    const HOLD_ACTION = {
      hold: "持有不动，跌破止损位再说",
      add: "留意低多机会，回踩企稳按计划加",
      tp: "留意高开 / 冲高，触发区间止盈",
      sl: "留意反抽 / 高开，果断止损离场",
      reduce: "任何反抽 / 高开即减仓降敞口",
    };
    const WATCH_ACTION = { watchbuy: "盯预设买点，突破 / 企稳再进场", watchonly: "只观察，不动手，等右侧确认" };

    /* ============ 状态 ============ */
    const STORE_KEY = "ymos-plan-state";
    let state = null;
    let currentTab = "today";
    let dateManual = false;     // 用户本次会话是否手动选过日期（选过就不自动跳到今天）
    let dashDev = null;         // 收盘定调顶部「今日执行偏差」缓存 { fetched, planDate, mismatches[] }
    // 执行台缓存：从服务端载入的「上一交易日计划」（只读）
    let execPlan = null, execDate = null, execFetched = false;
    let execMode = "auto";      // "auto"（上一交易日）| "YYYY-MM-DD"（手动选）
    let execDates = null;       // 已存计划日期列表（缓存）
    let execRec = null;         // 今日实际执行记录（写回被执行的那份计划文件）
    const EXEC_SECTION_MARK_JS = "<!-- ymos-exec-section -->";
    const EXEC_DATA_MARK_JS = "ymos-exec-data";

    function todayStr() {
      const d = new Date(); const p = n => String(n).padStart(2, "0");
      return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
    }
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

    function blankState(date) {
      return {
        version: 1, date: date || todayStr(),
        dashboard: { marketBig: "", sectorBig: "", smallTrend: "", tomorrowMood: "", stance: "", note: "" },
        holdings: [], watch: [],
      };
    }
    function newHolding(name) {
      return { id: uid(), name: name || "", funds: false, slot: false, perf: false, sizeOk: true, bigTrend: "newhigh", smallTrend: "newhigh", plan: "hold", action: "", scHigh: "", scLow: "" };
    }
    function newWatch(name) {
      return { id: uid(), name: name || "", funds: false, slot: false, perf: false, bigTrend: "newhigh", smallTrend: "newhigh", plan: "watchbuy", action: "" };
    }

    function load() {
      try { const raw = localStorage.getItem(STORE_KEY); if (raw) { const s = JSON.parse(raw); if (s && s.dashboard) return s; } } catch (e) { }
      return blankState();
    }
    function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { } scheduleDraft(); }

    /* 本地草稿镜像：每次改动 debounce 1.5s 把当前状态写成 md，缓存被清也能恢复 */
    let draftTimer = null;
    function scheduleDraft() {
      clearTimeout(draftTimer);
      draftTimer = setTimeout(pushDraft, 1500);
    }
    function pushDraft(useBeacon) {
      let md;
      try { md = buildMarkdown(); } catch (e) { return; }
      const body = JSON.stringify({ markdown: md });
      try {
        if (useBeacon && navigator.sendBeacon) {
          navigator.sendBeacon("/api/plan/draft", new Blob([body], { type: "application/json" }));
        } else {
          fetch("/api/plan/draft", { method: "POST", headers: { "Content-Type": "application/json" }, body, keepalive: true }).catch(() => { });
        }
      } catch (e) { }
    }

    // 开盘三步（盘中执行台的默念/确认清单）
    const OPEN_STEPS = [
      { id: "s1", main: "不临时起意开新仓", sub: "今天的买入必须是昨晚计划里定好的，不看盘中涨跌临时冲。" },
      { id: "s2", main: "盘中新机会只进观察名单，今晚再审", sub: "冒出来的新票不下手，先记下，收盘后走审计流程。" },
      { id: "s3", main: "盘面与预期不符时，默认防守只卖不买", sub: "看不懂 / 走反了就降敞口，别加仓扛，别为扳回加本金。" },
    ];

    /* ============ Tab 定义 ============ */
    const TABS = [
      { key: "today", icon: "🌅", label: "今日交易计划", desc: "盘中执行 · 上一交易日定", kicker: "盘中 · 只执行不决策", title: "今日交易计划", tagline: "这是上一交易日收盘后定的计划，今天照着执行。盘中只勾执行进度、不改计划——要改，等收盘复盘。手只是执行昨晚计划的机器人。" },
      { key: "dashboard", icon: "🧭", label: "收盘定调", desc: "大盘 / 板块 / 明日情绪", kicker: "收盘后 · 大势定调", title: "收盘定调 · 明日大势", tagline: "先给大盘、板块、小趋势定性，再定明日情绪与动作。方向在盘后想清楚，盘中只照着执行——上涨才加敞口，下跌加现金。" },
      { key: "holdings", icon: "💼", label: "持仓审计", desc: "逐个体检 · 定明日动作", kicker: "持仓 · 逐个审计", title: "持仓审计", tagline: "每个持仓都要过「资金表达、卡位、业绩」三关；单一标的不重仓，持仓数量控制在自己能持续跟踪的范围内。缺关的考虑清理，别自欺。" },
      { key: "watch", icon: "🔭", label: "观察审计", desc: "盯买点 · 潜在计划", kicker: "观察 · 潜在机会", title: "观察审计", tagline: "同样的三关标准审视候选。达标且趋势对，才升级为「盯买点」；否则只观察，等右侧确认，绝不盘中冲动。" },
      { key: "tomorrow", icon: "📋", label: "明日动作", desc: "微观动作汇总 · 保存", kicker: "明日 · 微观动作", title: "明日动作清单", tagline: "把定调与逐个标的的计划汇总成一份可执行清单。明天盘中照着做，不临时决策。确认无误后保存到 Obsidian 归档。" },
    ];

    /* ============ 渲染导航 ============ */
    function renderNav() {
      const nav = document.getElementById("modeNav");
      nav.innerHTML = "";
      for (const t of TABS) {
        const cnt = t.key === "holdings" ? state.holdings.length : t.key === "watch" ? state.watch.length : "";
        const btn = document.createElement("div");
        btn.className = "mode-btn" + (t.key === currentTab ? " on" : "");
        btn.onclick = () => switchTab(t.key);
        btn.innerHTML = '<div class="m-icon">' + t.icon + '</div>' +
          '<div class="m-txt"><div class="m-label">' + t.label + '</div><div class="m-desc">' + t.desc + '</div></div>' +
          (cnt !== "" ? '<div class="m-count">' + cnt + '</div>' : '');
        nav.appendChild(btn);
      }
      const mt = document.getElementById("mobileTabs");
      mt.innerHTML = "";
      for (const t of TABS) {
        const chip = document.createElement("div");
        chip.className = "mtb-chip" + (t.key === currentTab ? " on" : "");
        chip.textContent = t.label;
        chip.onclick = () => switchTab(t.key);
        mt.appendChild(chip);
      }
      document.getElementById("mtbDate").textContent = state.date;
    }

    // 切到计划页时：若计划日期是过去的（隔夜草稿留下的）且没手动选过，自动跳到今天，避免误存到昨天
    function maybeAdvanceDate() {
      if (dateManual) return;
      const t = todayStr();
      if (state.date < t) {
        state.date = t;
        const di = document.getElementById("dateInput"); if (di) di.value = t;
        persist();
        toast("已切到今天 " + t + "（常驻名单保留，做今天的收盘复盘）", "");
      }
    }
    function switchTab(key) {
      currentTab = key;
      if (key !== "today") maybeAdvanceDate();
      if (key === "dashboard") dashDev = null;   // 每次进收盘定调都刷新今日执行偏差
      renderNav(); renderTab(); document.getElementById("bodyScroll").scrollTop = 0;
    }

    /* ============ 渲染主区 ============ */
    function renderTab() {
      const t = TABS.find(x => x.key === currentTab);
      document.getElementById("kicker").textContent = t.kicker;
      document.getElementById("title").textContent = t.title;
      document.getElementById("tagline").textContent = t.tagline;
      const scroll = document.getElementById("bodyScroll");
      scroll.innerHTML = "";
      if (currentTab === "today") renderToday(scroll);
      else if (currentTab === "dashboard") renderDashboard(scroll);
      else if (currentTab === "holdings") renderAudit(scroll, "holdings");
      else if (currentTab === "watch") renderAudit(scroll, "watch");
      else renderTomorrow(scroll);
      renderAbInfo();
    }

    function renderAbInfo() {
      const info = document.getElementById("abInfo");
      const saveBtn = document.getElementById("saveBtn");
      if (currentTab === "today") {
        if (execFetched && execPlan) {
          saveBtn.style.display = "";
          saveBtn.textContent = "💾 保存今日执行记录";
          const total = (execPlan.holdings || []).length + (execPlan.watch || []).length;
          const done = countExecDone();
          const extra = execRec && execRec.extras.length ? ' · 计划外 <b>' + execRec.extras.length + '</b>' : '';
          info.innerHTML = '执行进度：<b>' + done + ' / ' + total + '</b> 已处理' + extra + '　·　存回 <b>' + (execDate || "—") + '</b>日交易计划.md（计划+实际一体）';
        } else {
          saveBtn.style.display = "none";
          info.innerHTML = '盘中只执行、不改计划 —— 要改，切到「收盘定调」等收盘后再动。';
        }
        return;
      }
      saveBtn.style.display = "";
      saveBtn.textContent = "💾 保存今日收盘复盘";
      const d = state.dashboard;
      const st = d.stance ? STANCE[d.stance].main : "未定调";
      info.innerHTML =
        '定调：<b>' + st + '</b>　持仓 <b>' + state.holdings.length + '</b> · 观察 <b>' + state.watch.length + '</b>　—— 保存到 ' + state.date + '日交易计划.md';
    }

    /* ---- Dashboard ---- */
    function optBtn(group, val, main, sub, cur, cls) {
      const on = cur === val;
      const semantic = cls ? (" " + cls) : "";
      return '<button class="stance-opt' + (on ? " on" + semantic : "") + '" data-g="' + group + '" data-v="' + val + '">' +
        '<span class="so-main">' + main + '</span>' + (sub ? '<span class="so-sub">' + sub + '</span>' : '') + '</button>';
    }
    // 今日执行偏差：读「上一交易日计划」的执行块，对比预估 vs 实际
    async function fetchDashDev() {
      let result = { fetched: true, has: null };
      try {
        const res = await fetch("/api/plan/latest?before=" + encodeURIComponent(todayStr()));
        const j = await res.json();
        if (res.ok && j.found) {
          if (j.exec) {
            const pd = (j.state && j.state.dashboard) || {}, ac = j.exec.actual || {};
            const checks = [["大盘", ac.marketBig, pd.marketBig, TREND3], ["板块", ac.sectorBig, pd.sectorBig, TREND3], ["小趋势", ac.smallTrend, pd.smallTrend, SMALL], ["情绪", ac.mood, pd.tomorrowMood, MOOD]];
            const mismatches = checks.filter(c => c[1] && c[1] !== (c[2] || "")).map(c => ({ label: c[0], pred: c[3][c[2]] || "—", act: c[3][c[1]] || "—" }));
            result = { fetched: true, has: true, planDate: j.date, mismatches };
          } else { result = { fetched: true, has: false, planDate: j.date }; }
        }
      } catch (e) { }
      dashDev = result;
      if (currentTab === "dashboard") renderTab();
    }
    function buildDashDev() {
      if (!dashDev) { dashDev = { fetched: false }; fetchDashDev(); }
      const el = document.createElement("div");
      if (!dashDev.fetched) { el.className = "dash-dev loading"; el.textContent = "读取今日执行回顾…"; return el; }
      if (dashDev.has === null) return null;
      if (dashDev.has === false) {
        el.className = "dash-dev none";
        el.innerHTML = '<span class="dd-icon">📊</span><div>' + dashDev.planDate + ' 的计划今天还没在执行台记实际。<a id="ddGo">去今日交易计划记一下 →</a></div>';
        el.querySelector("#ddGo").onclick = () => switchTab("today");
        return el;
      }
      if (!dashDev.mismatches.length) {
        el.className = "dash-dev ok";
        el.innerHTML = '<span class="dd-icon">✅</span><div>今日执行盘面与昨日预估<b>一致</b>。复盘时确认动作是否也如预期。</div>';
        return el;
      }
      el.className = "dash-dev warn";
      const items = dashDev.mismatches.map(m => m.label + '（预估 ' + m.pred + ' → 实际 ' + m.act + '）').join("、");
      el.innerHTML = '<span class="dd-icon">📊</span><div>今日执行回顾：<b>' + dashDev.mismatches.length + ' 处</b>与昨日预估不符 —— ' + items +
        '。<br>把这个偏差的教训写进今晚计划，尤其是相关持仓的<b>情景预案</b>（高开 / 低走两手准备）。</div>';
      return el;
    }

    function renderDashboard(scroll) {
      const dev = buildDashDev(); if (dev) scroll.appendChild(dev);
      const d = state.dashboard;
      const wrap = document.createElement("div");
      const trendOpts = (g, dict, cur) => Object.keys(dict).map(k =>
        optBtn(g, k, dict[k], "", cur, k === "up" || k === "on" || k === "newhigh" ? "pos" : (k === "down" || k === "off" ? "neg" : ""))).join("");
      wrap.innerHTML =
        '<div class="stance-q"><div class="stance-q-title">① 大盘大趋势 <span class="qh">大级别</span></div><div class="stance-opts">' + trendOpts("marketBig", TREND3, d.marketBig) + '</div></div>' +
        '<div class="stance-q"><div class="stance-q-title">② 板块大趋势 <span class="qh">主线板块</span></div><div class="stance-opts">' + trendOpts("sectorBig", TREND3, d.sectorBig) + '</div></div>' +
        '<div class="stance-q"><div class="stance-q-title">③ 当前小趋势 <span class="qh">小级别</span></div><div class="stance-opts">' + trendOpts("smallTrend", SMALL, d.smallTrend) + '</div></div>' +
        '<div class="stance-q"><div class="stance-q-title">④ 明日情绪预演</div><div class="stance-opts">' + trendOpts("tomorrowMood", MOOD, d.tomorrowMood) + '</div></div>' +
        '<div class="stance-q"><div class="stance-q-title">⑤ 明日动作定调 <span class="qh">总基调</span></div><div class="stance-opts">' +
        Object.keys(STANCE).map(k => optBtn("stance", k, STANCE[k].main, STANCE[k].sub, d.stance, STANCE[k].cls)).join("") + '</div></div>' +
        '<textarea class="field-note" id="dashNote" placeholder="今日复盘一句话 / 明日总纲（选填）：例，大盘缩量震荡，只守不攻，等主线放量再加敞口。">' + escapeHTML(d.note || "") + '</textarea>' +
        '<div class="stance-note">开盘三不：<em>不临时起意开新仓</em>、盘中新机会<em>只进观察名单今晚再审</em>、盘面与预期不符时<em>默认防守只卖不买</em>。手只是执行昨晚计划的机器人。</div>';
      wrap.querySelectorAll(".stance-opt").forEach(el => {
        el.onclick = () => { const g = el.dataset.g, v = el.dataset.v; d[g] = (d[g] === v ? "" : v); persist(); renderDashboard(clearAndGet(scroll)); renderAbInfo(); };
      });
      const ta = wrap.querySelector("#dashNote");
      ta.addEventListener("input", () => { d.note = ta.value; persist(); });
      scroll.appendChild(wrap);
    }
    function clearAndGet(scroll) { scroll.innerHTML = ""; return scroll; }

    /* ---- 定调条 ---- */
    function stanceCtx() {
      const d = state.dashboard;
      const el = document.createElement("div");
      el.onclick = () => switchTab("dashboard");
      if (!d.stance) { el.className = "stance-ctx none"; el.innerHTML = '<span class="sc-icon">📋</span><div>还没定调 —— 先去「收盘定调」定好大势与明日动作，审计才有方向。</div>'; return el; }
      const s = STANCE[d.stance];
      const parts = [];
      if (d.marketBig) parts.push("大盘 " + TREND3[d.marketBig]);
      if (d.sectorBig) parts.push("板块 " + TREND3[d.sectorBig]);
      if (d.tomorrowMood) parts.push(MOOD[d.tomorrowMood]);
      el.className = "stance-ctx " + d.stance;
      el.innerHTML = '<span class="sc-icon">' + s.icon + '</span><div>今日定调：<b>' + s.main + '</b>（' + s.sub + '）' + (parts.length ? '　·　' + parts.join(" / ") : '') + '</div>';
      return el;
    }

    /* ---- 审计（持仓 / 观察通用）---- */
    function renderAudit(scroll, kind) {
      scroll.appendChild(stanceCtx());
      const list = state[kind];
      const isHold = kind === "holdings";

      const toolbar = document.createElement("div");
      toolbar.className = "toolbar";
      toolbar.innerHTML = '<span class="tb-title">' + (isHold ? "当前持仓" : "观察名单") + '（' + list.length + '）</span>' +
        '<div class="add-form"><input id="addName" placeholder="标的名称，回车添加" /><button class="btn solid" id="addBtn">➕ 添加</button></div>';
      scroll.appendChild(toolbar);
      const addName = toolbar.querySelector("#addName");
      const doAdd = () => {
        const nm = addName.value.trim();
        list.push(isHold ? newHolding(nm) : newWatch(nm));
        persist(); renderNav(); renderAudit(clearAndGet(scroll), kind); renderAbInfo();
        setTimeout(() => { const el = document.querySelector('#addName'); if (el) el.focus(); }, 0);
      };
      toolbar.querySelector("#addBtn").onclick = doAdd;
      addName.addEventListener("keydown", e => { if (e.key === "Enter") doAdd(); });

      if (isHold && list.length > 3) {
        const w = document.createElement("div");
        w.className = "empty"; w.style.borderColor = "var(--red)"; w.style.color = "var(--red)"; w.style.marginBottom = "14px";
        w.textContent = "⚠️ 当前持仓 " + list.length + " 个 —— 请确认仍在自己能持续跟踪的范围内；太分散时优先收口。";
        scroll.appendChild(w);
      }

      if (!list.length) {
        const e = document.createElement("div"); e.className = "empty";
        e.innerHTML = isHold ? "还没有持仓。上方输入标的名添加。<br>持仓是常驻名单，加一次后每天只更新趋势与计划。" : "还没有观察标的。上方输入名称添加。<br>盘中冒出的新机会先进这里，收盘再审，不盘中下手。";
        scroll.appendChild(e); return;
      }

      list.forEach(item => scroll.appendChild(auditCard(item, kind, scroll)));
    }

    function auditCard(item, kind, scroll) {
      const isHold = kind === "holdings";
      const qualityOk = item.funds && item.slot && item.perf;
      const sizeBad = isHold && !item.sizeOk;
      const card = document.createElement("div");
      card.className = "card" + ((!qualityOk || sizeBad) ? " flag" : "");

      // 徽章
      const badges = [];
      if (!qualityOk) badges.push('<span class="badge warn">用人存疑</span>');
      if (sizeBad) badges.push('<span class="badge warn">单一标的过重</span>');
      if (qualityOk && !sizeBad) badges.push('<span class="badge good">达标</span>');
      const planDict = isHold ? HOLD_PLAN : WATCH_PLAN;
      badges.push('<span class="badge plan">' + planDict[item.plan] + '</span>');

      const head = document.createElement("div");
      head.className = "card-head";
      head.innerHTML = '<input class="card-name" value="' + escapeHTML(item.name) + '" placeholder="标的名" />' +
        '<div class="card-badges">' + badges.join("") + '</div>' +
        '<button class="card-del" title="删除">✕</button>';
      card.appendChild(head);
      head.querySelector(".card-name").addEventListener("input", e => { item.name = e.target.value; persist(); });
      head.querySelector(".card-del").onclick = () => {
        const arr = state[kind]; const i = arr.indexOf(item); if (i >= 0) arr.splice(i, 1);
        persist(); renderNav(); renderAudit(clearAndGet(scroll), kind); renderAbInfo();
      };

      const body = document.createElement("div");
      body.className = "card-body";

      // 质检
      const qWrap = document.createElement("div");
      qWrap.className = "quality";
      const qchk = (field, label, redline) => {
        const on = item[field];
        return '<div class="qchk' + (redline ? " redline" : "") + (on ? " on" : "") + '" data-f="' + field + '"><div class="box">' + CHECK_SVG + '</div>' + label + '</div>';
      };
      let qHtml = qchk("funds", "资金表达强 · 新高附近") + qchk("slot", "卡位") + qchk("perf", "业绩");
      if (isHold) qHtml += qchk("sizeOk", "单一标的未超过我的上限", true);
      qWrap.innerHTML = qHtml;
      qWrap.querySelectorAll(".qchk").forEach(el => {
        el.onclick = () => { const f = el.dataset.f; item[f] = !item[f]; persist(); renderAudit(clearAndGet(scroll), kind); };
      });
      body.appendChild(qWrap);

      // 下拉：大趋势 / 小趋势 / 计划
      const selWrap = document.createElement("div");
      selWrap.className = "selrow";
      const selCell = (field, label, dict) => {
        const opts = Object.keys(dict).map(k => '<option value="' + k + '"' + (item[field] === k ? " selected" : "") + '>' + dict[k] + '</option>').join("");
        return '<div class="selcell"><label>' + label + '</label><select data-f="' + field + '">' + opts + '</select></div>';
      };
      selWrap.innerHTML = selCell("bigTrend", "大趋势", BIG_TREND) + selCell("smallTrend", "小趋势", SMALL_TREND) + selCell("plan", isHold ? "最新计划" : "潜在计划", planDict);
      selWrap.querySelectorAll("select").forEach(sel => {
        sel.onchange = () => {
          const f = sel.dataset.f; item[f] = sel.value;
          if (f === "plan") item.action = "";  // 换计划时清掉手填，回到自动建议
          persist(); renderAudit(clearAndGet(scroll), kind);
        };
      });
      body.appendChild(selWrap);

      // 明日具体动作
      const suggest = (isHold ? HOLD_ACTION : WATCH_ACTION)[item.plan] || "";
      const aRow = document.createElement("div");
      aRow.className = "action-row";
      aRow.innerHTML = '<label>明日具体动作 <span class="suggest" title="填入建议">↩ 用建议</span></label>' +
        '<input value="' + escapeHTML(item.action || "") + '" placeholder="' + escapeHTML(suggest) + '" />';
      const aInput = aRow.querySelector("input");
      aInput.addEventListener("input", () => { item.action = aInput.value; persist(); });
      aRow.querySelector(".suggest").onclick = () => { item.action = suggest; aInput.value = suggest; persist(); };
      body.appendChild(aRow);

      // 情景预案（仅持仓）：把「高开 vs 低走」的压力测试前移到计划环节
      if (isHold) {
        const sc = document.createElement("div");
        sc.className = "scenario";
        sc.innerHTML = '<div class="sc-title">情景预案 <span class="sc-hint">明天不管怎么开都有预设动作，不被动</span></div>' +
          '<div class="sc-row"><span class="sc-tag high">↗ 若高开</span><input class="sc-high" placeholder="例：冲高到 XX 先止盈一半，回不来就清" value="' + escapeHTML(item.scHigh || "") + '" /></div>' +
          '<div class="sc-row"><span class="sc-tag low">↘ 若低走</span><input class="sc-low" placeholder="例：开盘就跌破 XX 直接减，反抽不上就清" value="' + escapeHTML(item.scLow || "") + '" /></div>';
        sc.querySelector(".sc-high").addEventListener("input", e => { item.scHigh = e.target.value; persist(); });
        sc.querySelector(".sc-low").addEventListener("input", e => { item.scLow = e.target.value; persist(); });
        body.appendChild(sc);
      }

      card.appendChild(body);
      return card;
    }

    /* ---- 明日动作汇总 ---- */
    function renderTomorrow(scroll) {
      const d = state.dashboard;
      const ss = document.createElement("div");
      if (d.stance) {
        const s = STANCE[d.stance];
        ss.className = "summary-stance " + d.stance;
        ss.innerHTML = '<span class="ss-icon">' + s.icon + '</span><div><div class="ss-main">' + s.main + '</div><div class="ss-sub">' + s.sub +
          (d.marketBig ? '　·　大盘 ' + TREND3[d.marketBig] : '') + (d.tomorrowMood ? '　·　' + MOOD[d.tomorrowMood] : '') + '</div></div>';
      } else {
        ss.className = "summary-stance"; ss.style.cursor = "pointer"; ss.onclick = () => switchTab("dashboard");
        ss.innerHTML = '<span class="ss-icon">📋</span><div><div class="ss-main">还没定调</div><div class="ss-sub">点我去「收盘定调」先定明日总基调</div></div>';
      }
      scroll.appendChild(ss);

      const renderGroup = (title, list, kind) => {
        const g = document.createElement("div"); g.className = "micro-group";
        g.innerHTML = '<h3>' + title + '（' + list.length + '）</h3>';
        if (!list.length) { const e = document.createElement("div"); e.className = "empty"; e.textContent = "无"; g.appendChild(e); scroll.appendChild(g); return; }
        const isHold = kind === "holdings";
        const planDict = isHold ? HOLD_PLAN : WATCH_PLAN;
        list.forEach(item => {
          const suggest = (isHold ? HOLD_ACTION : WATCH_ACTION)[item.plan] || "";
          const act = item.action && item.action.trim() ? item.action : suggest;
          let cls = "";
          if (isHold) cls = (item.plan === "add") ? "buy" : (item.plan === "tp" || item.plan === "sl" || item.plan === "reduce") ? "sell" : "";
          else cls = item.plan === "watchbuy" ? "buy" : "";
          const qualityOk = item.funds && item.slot && item.perf;
          const sizeBad = isHold && !item.sizeOk;
          const flags = [];
          if (!qualityOk) flags.push("用人存疑");
          if (sizeBad) flags.push("单一标的过重");
          const mi = document.createElement("div");
          mi.className = "micro" + (cls ? " " + cls : "");
          mi.innerHTML = '<span class="mi-name">' + escapeHTML(item.name || "（未命名）") + '</span>' +
            '<span class="mi-plan">' + planDict[item.plan] + '</span>' +
            '<div><div class="mi-action">' + escapeHTML(act || "—") + '</div>' +
            (flags.length ? '<div class="mi-flag">⚠️ ' + flags.join(" · ") + '</div>' : '') + '</div>';
          g.appendChild(mi);
        });
        scroll.appendChild(g);
      };
      renderGroup("持仓 · 明日微观动作", state.holdings, "holdings");
      renderGroup("观察 · 明日微观动作", state.watch, "watch");
    }

    /* ============ 今日交易计划（执行台：读上一交易日计划 + 记今日实际）============ */
    function ritualKey() { return "ymos-open-ritual-" + todayStr(); }
    function getMap(key) { try { return JSON.parse(localStorage.getItem(key) || "{}") || {}; } catch (e) { return {}; } }
    function setMap(key, m) { try { localStorage.setItem(key, JSON.stringify(m)); } catch (e) { } }
    function countExecDone() {
      if (!execPlan || !execRec) return 0;
      let n = 0;
      (execPlan.holdings || []).forEach(it => { if ((execRec.items["h_" + it.id] || {}).executed) n++; });
      (execPlan.watch || []).forEach(it => { if ((execRec.items["w_" + it.id] || {}).executed) n++; });
      return n;
    }
    function daysAgo(dateStr) {
      const diff = Math.round((new Date(todayStr()) - new Date(dateStr)) / 86400000);
      return diff;
    }
    async function loadExec() {
      // 数据源日期列表（供手动选）
      if (execDates === null) {
        try { const r = await fetch("/api/plan/dates"); const jj = await r.json(); execDates = jj.dates || []; }
        catch (e) { execDates = []; }
      }
      // 按 execMode 载入计划：auto=上一交易日；否则=指定日期
      try {
        let url;
        if (execMode === "auto") url = "/api/plan/latest?before=" + encodeURIComponent(todayStr());
        else url = "/api/plan/load?date=" + encodeURIComponent(execMode);
        const res = await fetch(url);
        const j = await res.json();
        if (res.ok && j.found && j.state && j.state.dashboard) {
          execPlan = normalize(j.state);
          execDate = (execMode === "auto") ? j.date : execMode;
          // 执行记录：本地草稿（最新编辑）> 服务端已存执行块 > 空白（沿用预估）
          let draft = null;
          try { draft = JSON.parse(localStorage.getItem(execDraftKey(execDate)) || "null"); } catch (e) { }
          execRec = normalizeExec(draft || j.exec, execPlan, execDate);
        } else { execPlan = null; execDate = (execMode === "auto") ? null : execMode; execRec = null; }
      } catch (e) { execPlan = null; execDate = null; execRec = null; }
      execFetched = true;
      if (currentTab === "today") renderTab();
    }

    function renderToday(scroll) {
      if (!execFetched) {
        const l = document.createElement("div"); l.className = "empty"; l.textContent = "载入收盘计划…";
        scroll.appendChild(l);
        loadExec();
        return;
      }

      // 工具栏：标题 + 数据源选择 + 刷新
      const bar = document.createElement("div");
      bar.className = "toolbar";
      const srcOpts = ['<option value="auto"' + (execMode === "auto" ? " selected" : "") + '>自动 · 上一交易日</option>']
        .concat((execDates || []).map(dt =>
          '<option value="' + dt + '"' + (execMode === dt ? " selected" : "") + '>' + dt + ' 收盘</option>')).join("");
      bar.innerHTML = '<span class="tb-title">' + (execDate ? execDate + " → 今日执行" : "今日执行") + '</span>' +
        '<div class="exec-src-pick"><span style="font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:.06em">数据源</span>' +

        '<button class="btn" id="execRefresh">↻</button></div>';
      scroll.appendChild(bar);
      bar.querySelector("#execSrc").onchange = (e) => { execMode = e.target.value; execFetched = false; renderTab(); };
      bar.querySelector("#execRefresh").onclick = () => { execFetched = false; execDates = null; renderTab(); };

      if (!execPlan) {
        const e = document.createElement("div"); e.className = "empty";

          : execMode + " 没有可读取的计划文件。换个数据源，或先去做那天的收盘复盘。";
        scroll.appendChild(e);
        const cta = document.createElement("div"); cta.className = "exec-cta";
        cta.innerHTML = '<a id="gotoPlan">去做收盘复盘 →</a>';

      }

      // 两列容器：today-main（定调 + 持仓 + 观察）| today-side（开盘三步 + 盘中纪律）
      const wrap = document.createElement("div"); wrap.className = "today-wrap";
      const grid = document.createElement("div"); grid.className = "today-grid";
      const main = document.createElement("div"); main.className = "today-main";
      const side = document.createElement("div"); side.className = "today-side";
      grid.appendChild(main); grid.appendChild(side); wrap.appendChild(grid); scroll.appendChild(wrap);

      const d = execPlan.dashboard;

      // ① 动作定调 hero
      const hero = document.createElement("div");
      const ago = daysAgo(execDate);

      if (d.stance) {

          '<div class="ss-sub">' + s.sub + '</div>' +
          '<div class="exec-src">📋 基于 <b>' + execDate + '</b>（' + agoTxt + '）收盘定的计划' + (d.note ? '　·　' + escapeHTML(d.note) : '') + '</div></div>';
      } else {
        hero.className = "summary-stance";
        hero.innerHTML = '<span class="ss-icon">📋</span><div><div class="ss-main">未定调</div><div class="exec-src">来自 ' + execDate + ' 收盘计划</div></div>';
      }
      const metas = [];
      if (d.marketBig) metas.push("大盘 " + TREND3[d.marketBig]);
      if (d.sectorBig) metas.push("板块 " + TREND3[d.sectorBig]);

      if (metas.length) {

      main.appendChild(hero);

      // ①.5 今日实际盘面（对昨日预估的确认 / 修正）
      const ac = document.createElement("div");
      ac.className = "actual-card";
      const actCell = (field, label, dict, planKey) => {
        const cur = execRec.actual[field] || "", planVal = d[planKey] || "";
        const diff = cur && cur !== planVal;
        const opts = '<option value="">—</option>' + Object.keys(dict).map(k => '<option value="' + k + '"' + (cur === k ? " selected" : "") + '>' + dict[k] + '</option>').join("");
        return '<div class="selcell' + (diff ? " diff" : "") + '"><label>' + label +
          (planVal ? '<span class="pred">预估 ' + dict[planVal] + '</span>' : '<span class="pred">预估 —</span>') + '</label>' +
