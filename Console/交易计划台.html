      };
      ac.innerHTML = '<h3>今日实际盘面 <span class="ah-hint">昨日是收盘预估，盘中按实况确认；与预估不符会标红——这就是「高开 vs 低走」压力测试的证据</span></h3>' +
        '<div class="actual-grid">' +
        actCell("marketBig", "大盘", TREND3, "marketBig") +
        actCell("sectorBig", "板块", TREND3, "sectorBig") +
        actCell("smallTrend", "小趋势", SMALL, "smallTrend") +
        actCell("mood", "盘面情绪", MOOD, "tomorrowMood") +
        '</div>' +
        '<textarea class="actual-note" id="actualNote" placeholder="盘面实况一句话：例，早盘冲高回落、主线分歧、情绪转弱，防守为主。">' + escapeHTML(execRec.actual.note || "") + '</textarea>';
      ac.querySelectorAll("select").forEach(sel => {
        sel.onchange = () => {
          const f = sel.dataset.af; execRec.actual[f] = sel.value; saveExecDraft();
          sel.closest(".selcell").classList.toggle("diff", sel.value && sel.value !== sel.dataset.pv);
        };
      });
      ac.querySelector("#actualNote").addEventListener("input", e => { execRec.actual.note = e.target.value; saveExecDraft(); });
      main.appendChild(ac);

      // ② 持仓今日执行 / ③ 观察今日盯盘（勾执行 + 记实际）
      const renderGroup = (parent, title, hint, list, kind) => {
        const g = document.createElement("div"); g.className = "micro-group";
        g.innerHTML = '<h3>' + title + '（' + list.length + '）' + (hint ? '<span style="font-weight:500;color:var(--ink-3);text-transform:none;letter-spacing:0"> · ' + hint + '</span>' : '') + '</h3>';
        if (!list.length) { const e = document.createElement("div"); e.className = "empty"; e.textContent = "无"; g.appendChild(e); parent.appendChild(g); return; }
        const isHold = kind === "holdings";
        const planDict = isHold ? HOLD_PLAN : WATCH_PLAN;
        list.forEach(item => {
          const key = (isHold ? "h_" : "w_") + item.id;
          const ei = execItem(key);
          const suggest = (isHold ? HOLD_ACTION : WATCH_ACTION)[item.plan] || "";
          const act = item.action && item.action.trim() ? item.action : suggest;
          let cls = "";
          if (isHold) cls = (item.plan === "add") ? "buy" : (item.plan === "tp" || item.plan === "sl" || item.plan === "reduce") ? "sell" : "";
          else cls = item.plan === "watchbuy" ? "buy" : "";
          const qualityOk = item.funds && item.slot && item.perf;
          const sizeBad = isHold && !item.sizeOk;
          const flags = [];
          if (!qualityOk) flags.push("用人存疑");
          if (sizeBad) flags.push("单一标的过重");
          const row = document.createElement("div");
          row.className = "exec-item" + (cls ? " " + cls : "") + (ei.executed ? " done" : "");
          const ph = isHold
            ? "实际：例，开盘弱于预期，按计划减仓 @成交价"
            : "实际：例，冲高回落没到买点，继续观察";
          row.innerHTML = '<div class="ex-box" title="点一下=已执行">' + CHECK_SVG + '</div>' +
            '<div class="ex-main">' +
            '<div class="ex-top"><span class="ex-name">' + escapeHTML(item.name || "（未命名）") + '</span>' +
            '<span class="ex-plan">' + planDict[item.plan] + '</span>' +
            (flags.length ? '<span class="ex-flag">⚠️ ' + flags.join(" · ") + '</span>' : '') + '</div>' +
            '<div class="ex-plan-line">预期：<b>' + escapeHTML(act || "—") + '</b></div>' +
            (isHold && (item.scHigh || item.scLow) ? '<div class="ex-scenario">' +
              (item.scHigh ? '<span class="es-tag high">↗ 高开</span>' + escapeHTML(item.scHigh) : '') +
              (item.scHigh && item.scLow ? '<br>' : '') +
              (item.scLow ? '<span class="es-tag low">↘ 低走</span>' + escapeHTML(item.scLow) : '') + '</div>' : '') +
            '<input class="ex-actual" placeholder="' + ph + '" value="' + escapeHTML(ei.note || "") + '" /></div>';
          row.querySelector(".ex-box").onclick = () => {
            ei.executed = !ei.executed; saveExecDraft();
            row.classList.toggle("done", ei.executed); renderAbInfo();
          };
          row.querySelector(".ex-actual").addEventListener("input", e => { ei.note = e.target.value; saveExecDraft(); });
          g.appendChild(row);
        });
        parent.appendChild(g);
      };
      renderGroup(main, "持仓 · 今日执行", "勾已执行 · 记实际卖价/数量与偏差", execPlan.holdings, "holdings");
      renderGroup(main, "观察 · 今日盯盘", "到买点才动，否则继续观察", execPlan.watch, "watch");

      // ③.5 计划外动作（板块走弱临时卖了可卖可不卖的仓位等）
      const extraG = document.createElement("div"); extraG.className = "micro-group";
      extraG.innerHTML = '<h3>计划外动作（' + execRec.extras.length + '）<span style="font-weight:500;color:var(--ink-3);text-transform:none;letter-spacing:0"> · 计划外的买卖都记这，收盘复盘时反思</span></h3>';
      const extraList = document.createElement("div");
      const renderExtras = () => {
        extraList.innerHTML = "";
        execRec.extras.forEach((ex, i) => {
          const r = document.createElement("div"); r.className = "extra-row";
          r.innerHTML = '<input class="extra-name" placeholder="标的/动作" value="' + escapeHTML(ex.name || "") + '" />' +
            '<input class="extra-note" placeholder="说明：例，板块确认走弱，把可卖可不卖的 XX 也减了" value="' + escapeHTML(ex.note || "") + '" />' +
            '<button class="extra-del" title="删除">✕</button>';
          r.querySelector(".extra-name").addEventListener("input", e => { ex.name = e.target.value; saveExecDraft(); });
          r.querySelector(".extra-note").addEventListener("input", e => { ex.note = e.target.value; saveExecDraft(); });
          r.querySelector(".extra-del").onclick = () => { execRec.extras.splice(i, 1); saveExecDraft(); renderExtras(); extraG.querySelector("h3").firstChild.textContent = "计划外动作（" + execRec.extras.length + "）"; };
          extraList.appendChild(r);
        });
      };
      renderExtras();
      const addExtra = document.createElement("button");
      addExtra.className = "btn"; addExtra.style.marginTop = "2px"; addExtra.textContent = "➕ 添加计划外动作";
      addExtra.onclick = () => { execRec.extras.push({ id: uid(), name: "", note: "" }); saveExecDraft(); renderExtras(); extraG.querySelector("h3").firstChild.textContent = "计划外动作（" + execRec.extras.length + "）"; };
      extraG.appendChild(extraList); extraG.appendChild(addExtra);
      main.appendChild(extraG);

      // ④ 开盘三步（右栏 / 窄屏在下）
      const rmap = getMap(ritualKey());
      const ritual = document.createElement("div");
      ritual.className = "ritual";
      ritual.innerHTML =
        '<div class="ritual-head">🌅 开盘三步 · 先默念再看盘<span class="rh-hint">点一下确认</span></div>' +
        '<div class="ritual-body">' +
        OPEN_STEPS.map((st, i) => '<div class="ritual-step' + (rmap[st.id] ? " on" : "") + '" data-id="' + st.id + '">' +
          '<div class="rs-box">' + CHECK_SVG + '</div>' +
          '<div class="rs-txt"><div class="rs-main">' + (i + 1) + '. ' + st.main + '</div><div class="rs-sub">' + st.sub + '</div></div></div>').join("") +
        '</div>' +
        '<div class="ritual-foot">手只是执行昨晚计划的机器人。今天的决策昨晚已经做完了——盘中只<b>应对</b>，不<b>新做</b>交易逻辑。</div>';
      ritual.querySelectorAll(".ritual-step").forEach(el => {
        el.onclick = () => {
          const id = el.dataset.id; const m = getMap(ritualKey());
          m[id] = !m[id]; setMap(ritualKey(), m);
          el.classList.toggle("on", m[id]);
        };
      });
      side.appendChild(ritual);

      // ⑤ 盘中纪律常驻提醒（右栏 / 窄屏在下）
      const rem = document.createElement("div");
      rem.className = "reminders";
      rem.innerHTML = '<h3>盘中纪律 · 常驻提醒</h3><ul>' +
        '<li>单一标的不重仓；持仓数量不超过自己能持续跟踪的范围。</li>' +
        '<li><em>上涨才加敞口，下跌加现金</em>；抄底也要等右侧确认、梯度进入。</li>' +
        '<li>只做<em>计划内</em>的动作，非计划标的一律不碰——想买先进观察名单。</li>' +
        '<li>止盈 / 止损按昨晚定的执行，触发就走，<em>不盘中改数</em>。</li>' +
        '<li>A 股 <em>T+1</em>：今天开的仓当天撤不出，动作要留提前量。</li>' +
        '</ul>';
      side.appendChild(rem);

      // 收盘后回到计划（整幅底部）
      const cta = document.createElement("div"); cta.className = "exec-cta";
      cta.innerHTML = '收盘了？<a id="gotoPlan">去做今日收盘复盘，定明天 →</a>';
      cta.querySelector("#gotoPlan").onclick = () => switchTab("dashboard");
      scroll.appendChild(cta);
    }

    /* ============ 生成 Markdown ============ */
    function planLabel(item, isHold) { return (isHold ? HOLD_PLAN : WATCH_PLAN)[item.plan]; }
    function actOf(item, isHold) {
      const suggest = (isHold ? HOLD_ACTION : WATCH_ACTION)[item.plan] || "";
      return (item.action && item.action.trim()) ? item.action.trim() : suggest;
    }
    function buildMarkdown(st) {
      st = st || state;
      const d = st.dashboard;
      const L = [];
      L.push("# " + st.date + " 日交易计划");
      L.push("");
      L.push("> 盘后复盘定调 · 明日只执行不决策。");
      L.push("");
      L.push("## 🧭 大势定调");
      L.push("");
      L.push("| 项目 | 判断 |");
      L.push("| --- | --- |");
      L.push("| 大盘大趋势 | " + (TREND3[d.marketBig] || "—") + " |");
      L.push("| 板块大趋势 | " + (TREND3[d.sectorBig] || "—") + " |");
      L.push("| 当前小趋势 | " + (SMALL[d.smallTrend] || "—") + " |");
      L.push("| 明日情绪预演 | " + (MOOD[d.tomorrowMood] || "—") + " |");
      L.push("| **明日动作定调** | **" + (d.stance ? STANCE[d.stance].main + "（" + STANCE[d.stance].sub + "）" : "—") + "** |");
      L.push("");
      if (d.note && d.note.trim()) { L.push("**复盘纲要：** " + d.note.trim()); L.push(""); }

      const auditTable = (list, isHold) => {
        if (!list.length) { L.push("_（空）_"); L.push(""); return; }
        L.push("| 标的 | 资金 | 卡位 | 业绩 |" + (isHold ? " 仓位合规 |" : "") + " 大趋势 | 小趋势 | 计划 | 明日动作 |");
        L.push("| --- | :-: | :-: | :-: |" + (isHold ? " :-: |" : "") + " --- | --- | --- | --- |");
        const yn = b => b ? "✅" : "❌";
        list.forEach(it => {
          const cells = ["**" + (it.name || "（未命名）") + "**", yn(it.funds), yn(it.slot), yn(it.perf)];
          if (isHold) cells.push(yn(it.sizeOk));
          cells.push(BIG_TREND[it.bigTrend], SMALL_TREND[it.smallTrend], planLabel(it, isHold), actOf(it, isHold) || "—");
          L.push("| " + cells.join(" | ") + " |");
        });
        L.push("");
      };
      L.push("## 💼 持仓审计（" + st.holdings.length + "）");
      L.push("");
      auditTable(st.holdings, true);
      L.push("## 🔭 观察审计（" + st.watch.length + "）");
      L.push("");
      auditTable(st.watch, false);

      L.push("## 📋 明日微观动作");
      L.push("");
      const microList = (list, isHold, head) => {
        L.push("**" + head + "**");
        L.push("");
        if (!list.length) { L.push("- （无）"); L.push(""); return; }
        list.forEach(it => {
          L.push("- **" + (it.name || "（未命名）") + "** · " + planLabel(it, isHold) + " → " + (actOf(it, isHold) || "—"));
          if (isHold && (it.scHigh || it.scLow)) {
            const parts = [];
            if (it.scHigh) parts.push("↗ 高开：" + it.scHigh.trim());
            if (it.scLow) parts.push("↘ 低走：" + it.scLow.trim());
            L.push("    - 情景预案｜" + parts.join("　｜　"));
          }
        });
        L.push("");
      };
      microList(st.holdings, true, "持仓");
      microList(st.watch, false, "观察");

      // 结构化数据（供交易计划台精确回填，请勿手改）
      L.push("---");
      L.push("");
      L.push("<!-- ymos-plan-data：交易计划台结构化数据，请勿手动修改 -->");
      L.push("```json");
      L.push(JSON.stringify(st, null, 2));
      L.push("```");
      L.push("");
      return L.join("\n");
    }

    /* ============ 执行记录：数据结构 / 生成 / 保存 ============
     * 一份计划 md = 计划块（收盘定的预期）+ 执行块（次日盘中记的实际）。
     * execRec 存进「被执行的那份计划文件」，形成「计划 + 实际」一体的可回顾单元。
     */
    function execDraftKey(planDate) { return "ymos-exec-" + planDate; }
    function blankExec(plan, planDate) {
      const dd = plan.dashboard || {};
      return {
        version: 1, planDate: planDate, execDate: todayStr(),
        // 实际盘面：默认沿用昨日预估，用户只改与实际不符的
        actual: { marketBig: dd.marketBig || "", sectorBig: dd.sectorBig || "", smallTrend: dd.smallTrend || "", mood: dd.tomorrowMood || "", note: "" },
        items: {},          // { "h_<id>" / "w_<id>": { executed:bool, note:string } }
        extras: [],         // 计划外动作 [{ id, name, note }]
      };
    }
    function normalizeExec(raw, plan, planDate) {
      const b = blankExec(plan, planDate);
      if (!raw) return b;
      b.actual = Object.assign(b.actual, raw.actual || {});
      b.items = raw.items || {};
      b.extras = (raw.extras || []).map(e => ({ id: e.id || uid(), name: e.name || "", note: e.note || "" }));
      if (raw.execDate) b.execDate = raw.execDate;
      return b;
    }
    function saveExecDraft() { if (execRec) { try { localStorage.setItem(execDraftKey(execRec.planDate), JSON.stringify(execRec)); } catch (e) { } } }
    function execItem(key) { if (!execRec.items[key]) execRec.items[key] = { executed: false, note: "" }; return execRec.items[key]; }

    // 实际 vs 预估：不同则返回 true（用于高亮）
    function actualDiffers(field, planVal) { return execRec && execRec.actual[field] && execRec.actual[field] !== (planVal || ""); }

    function buildExecSection(plan) {
      const r = execRec, L = [];
      L.push("");                       // 与计划块留空行
      L.push(EXEC_SECTION_MARK_JS);     // 执行区起点标记（供服务端保护）
      L.push("## 📊 实际执行（" + r.execDate + " 盘中）");
      L.push("");
      const a = r.actual, dd = plan.dashboard || {};
      const cell = (label, actKey, dict, planKey) => {
        const av = dict[a[actKey]] || "—", pv = dict[dd[planKey]] || "—";
        const diff = a[actKey] && a[actKey] !== (dd[planKey] || "");
        return "| " + label + " | " + pv + " | " + av + (diff ? " ⚠️与预估不符" : "") + " |";
      };
      L.push("| 项目 | 昨日预估 | 今日实际 |");
      L.push("| --- | --- | --- |");
      L.push(cell("大盘大趋势", "marketBig", TREND3, "marketBig"));
      L.push(cell("板块大趋势", "sectorBig", TREND3, "sectorBig"));
      L.push(cell("当前小趋势", "smallTrend", SMALL, "smallTrend"));
      L.push(cell("盘面情绪", "mood", MOOD, "tomorrowMood"));
      L.push("");
      if (a.note && a.note.trim()) { L.push("**盘面实况：** " + a.note.trim()); L.push(""); }

      const execTable = (list, isHold, head) => {
        L.push("### " + head);
        L.push("");
        if (!list.length) { L.push("_（空）_"); L.push(""); return; }
        L.push("| 标的 | 计划 | 预期动作 | 已执行 | 实际情况 |");
        L.push("| --- | --- | --- | :-: | --- |");
        list.forEach(it => {
          const key = (isHold ? "h_" : "w_") + it.id;
          const ei = r.items[key] || { executed: false, note: "" };
          L.push("| **" + (it.name || "（未命名）") + "** | " + planLabel(it, isHold) + " | " + (actOf(it, isHold) || "—") +
            " | " + (ei.executed ? "✅" : "⬜") + " | " + (ei.note && ei.note.trim() ? ei.note.trim() : "—") + " |");
        });
        L.push("");
      };
      execTable(plan.holdings, true, "持仓执行");
      execTable(plan.watch, false, "观察执行");

      L.push("### 计划外动作");
      L.push("");
      if (!r.extras.length) { L.push("_（无）_"); }
      else { r.extras.forEach(e => { L.push("- **" + (e.name || "（未命名）") + "**：" + (e.note && e.note.trim() ? e.note.trim() : "—")); }); }
      L.push("");

      L.push("<!-- " + EXEC_DATA_MARK_JS + "：执行结构化数据，请勿手动修改 -->");
      L.push("```json");
      L.push(JSON.stringify(r, null, 2));
      L.push("```");
      L.push("");
      return L.join("\n");
    }

    async function saveExec() {
      if (!execPlan || !execRec) { toast("没有可保存的执行计划", "warn"); return; }
      const btn = document.getElementById("saveBtn");
      const md = buildMarkdown(execPlan).replace(/\s+$/, "") + "\n" + buildExecSection(execPlan);
      btn.classList.add("busy"); btn.textContent = "保存中…";
      try {
        const res = await fetch("/api/plan/save", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ date: execRec.planDate, markdown: md }),
        });
        const j = await res.json();
        if (res.ok && j.ok) { saveExecDraft(); toast("执行记录已存入 " + (j.rel || (execRec.planDate + "日交易计划.md")), "ok"); }
        else { toast("保存失败：" + (j.error || res.status), "warn"); }
      } catch (e) { toast("保存失败：服务未启动？", "warn"); }
      finally { btn.classList.remove("busy"); btn.textContent = "💾 保存今日执行记录"; }
    }

    /* ============ 保存 / 载入 ============ */
    async function save() {
      const btn = document.getElementById("saveBtn");
      const md = buildMarkdown();
      btn.classList.add("busy"); btn.textContent = "保存中…";
      try {
        const res = await fetch("/api/plan/save", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ date: state.date, markdown: md }),
        });
        const j = await res.json();
        if (res.ok && j.ok) { toast("已保存 · " + (j.rel || (state.date + "日交易计划.md")), "ok"); }
        else { toast("保存失败：" + (j.error || res.status), "warn"); }
      } catch (e) {
        toast("保存失败：服务未启动？请先跑 server.py", "warn");
      } finally {
        btn.classList.remove("busy"); btn.textContent = "💾 保存今日收盘复盘";
      }
    }

    async function loadDate(date) {
      // 切日期：先看 localStorage 里是不是同一天；否则尝试从服务端载入历史
      if (date === state.date) return;
      if (state.date === todayStr()) persist(); // 存住今天的草稿
      try {
        const res = await fetch("/api/plan/load?date=" + encodeURIComponent(date));
        const j = await res.json();
        if (res.ok && j.found && j.state && j.state.dashboard) {
          state = normalize(j.state); state.date = date;
          toast("已载入 " + date + " 的计划", "ok");
        } else {
          // 没有历史文件：以当前名单为底，换个日期（常驻名单跨天保留）
          state = normalize(state); state.date = date;
          toast(date + " 无归档，沿用当前名单新建", "");
        }
      } catch (e) {
        state = normalize(state); state.date = date;
        toast("服务未启动，仅切换日期（未载历史）", "warn");
      }
      if (date === todayStr()) persist();
      renderNav(); renderTab();
    }

    function normalize(s) {
      const b = blankState(s.date);
      b.dashboard = Object.assign(b.dashboard, s.dashboard || {});
      b.holdings = (s.holdings || []).map(h => Object.assign(newHolding(), h));
      b.watch = (s.watch || []).map(w => Object.assign(newWatch(), w));
      return b;
    }

    /* ============ 工具 ============ */
    function escapeHTML(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
    let toastTimer = null;
    function toast(msg, kind) {
      let t = document.querySelector(".toast");
      if (!t) { t = document.createElement("div"); t.className = "toast"; document.body.appendChild(t); }
      t.className = "toast " + (kind || "") + " show";
      t.textContent = msg;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
    }

    /* ============ init ============ */
    const dateInput = document.getElementById("dateInput");
    dateInput.addEventListener("change", () => { const v = dateInput.value; if (v) { dateManual = true; loadDate(v); } });
    document.getElementById("saveBtn").onclick = () => { if (currentTab === "today") saveExec(); else save(); };
    if (location.protocol === "file:") {
      for (const link of document.querySelectorAll("[data-file-href]")) {
        link.href = link.dataset.fileHref;
      }
    }
    // 离开页面前把最新草稿刷到本地备份
    window.addEventListener("pagehide", () => pushDraft(true));
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") pushDraft(true); });
    // 键盘：1-4 切 tab，⌘S 保存，⌘←/→ 切日期
    window.addEventListener("keydown", e => {
      const typing = e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT";
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") {
        e.preventDefault();
        if (currentTab === "today") saveExec(); else save();
        return;
      }
      if ((e.metaKey || e.ctrlKey) && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
        e.preventDefault();
        shiftDate(e.key === "ArrowLeft" ? -1 : 1);
        return;
      }
      if (typing) return;
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= TABS.length) switchTab(TABS[n - 1].key);
    });

    function shiftDate(delta) {
      const p = (state.date || todayStr()).split("-").map(Number);
      const d = new Date(p[0], p[1] - 1, p[2] + delta);
      const next = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      dateManual = true;
      loadDate(next);
    }

    /* ============ vault 连接状态 ============ */
    /* 计划台的主路径是「写回你自己的 Obsidian」。后端没起时不崩，
       退到本地暂存 + 导出，但要明确告诉用户当前是哪种状态。 */
    let vaultOnline = false;
    async function checkVault() {
      try {
        const r = await fetch("/api/health");
        vaultOnline = r.ok;
      } catch (e) { vaultOnline = false; }
      const bar = document.getElementById("vaultBar");
      if (bar) bar.classList.toggle("show", !vaultOnline);
      const btn = document.getElementById("saveBtn");
      if (btn && !vaultOnline) btn.title = "未连接 vault —— 请改用左侧「⬇️ .md」导出，或先启动 server.py";
    }

    /* ============ 导出 ============ */
    function downloadBlob(filename, text, mime) {
      const blob = new Blob([text], { type: mime + ";charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    document.getElementById("expMd").onclick = () => {
      downloadBlob(state.date + "日交易计划.md", buildMarkdown(), "text/markdown");
      toast("已下载 .md —— 可直接拖进任意 vault", "ok");
    };
    document.getElementById("expCopy").onclick = async () => {
      const md = buildMarkdown();
      try {
        await navigator.clipboard.writeText(md);
        toast("Markdown 已复制到剪贴板", "ok");
      } catch (e) {
        const ta = document.createElement("textarea");
        ta.value = md; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); toast("Markdown 已复制", "ok"); }
        catch (e2) { toast("复制失败，请改用「⬇️ .md」", "warn"); }
        ta.remove();
      }
    };
    document.getElementById("expJson").onclick = () => {
      downloadBlob(state.date + "-plan.json", JSON.stringify(state, null, 2), "application/json");
      toast("已导出 JSON —— 可喂给你自己的 Agent", "ok");
    };
    document.getElementById("expPrint").onclick = () => window.print();

    /* ============ 正文宽度拖拽（参考新高决策台）============ */
    const SIDEBAR_W = 268, MIN_W = 560, DEFAULT_RATIO = 0.75, WIDTH_KEY = "ymos-plan-main-w";
    let mainWPref = localStorage.getItem(WIDTH_KEY); // null | 数字字符串
    function maxMainW() { return Math.max(MIN_W, window.innerWidth - SIDEBAR_W); }
    function defaultMainW() { return Math.max(MIN_W, Math.round(maxMainW() * DEFAULT_RATIO)); }
    function applyMainW() {
      let w;
      if (mainWPref === null || mainWPref === "full") w = defaultMainW();
      else w = Math.max(MIN_W, Math.min(parseInt(mainWPref, 10) || defaultMainW(), maxMainW()));
      document.documentElement.style.setProperty("--main-w", w + "px");
    }
    (function initResize() {
      const handle = document.getElementById("resizeRight");
      const col = document.getElementById("mainCol");
      if (!handle || !col) return;
      handle.addEventListener("mousedown", e => {
        e.preventDefault();
        const startX = e.clientX, startW = col.getBoundingClientRect().width;
        handle.classList.add("dragging");
        document.body.classList.add("dragging-col");
        function move(ev) {
          let w = Math.max(MIN_W, Math.min(maxMainW(), startW + (ev.clientX - startX)));
          document.documentElement.style.setProperty("--main-w", w + "px");
          mainWPref = String(Math.round(w));
        }
        function up() {
          handle.classList.remove("dragging");
          document.body.classList.remove("dragging-col");
          localStorage.setItem(WIDTH_KEY, mainWPref);
          window.removeEventListener("mousemove", move);
          window.removeEventListener("mouseup", up);
        }
        window.addEventListener("mousemove", move);
        window.addEventListener("mouseup", up);
      });
      handle.addEventListener("dblclick", () => {
        mainWPref = null; localStorage.removeItem(WIDTH_KEY); applyMainW();
        toast("正文宽度已恢复为 75%", "");
      });
      window.addEventListener("resize", applyMainW);
      applyMainW();
      const hintKey = "ymos-plan-resize-hint-seen";
      if (!localStorage.getItem(hintKey) && window.innerWidth > 860) {
        const hint = document.getElementById("resizeHint");
        requestAnimationFrame(() => hint.classList.add("show"));
        setTimeout(() => hint.classList.remove("show"), 5000);
        localStorage.setItem(hintKey, "1");
      }
    })();

    /* 启动：localStorage 优先；为空则从本地草稿镜像恢复常驻名单 */
    (async function bootstrap() {
      const hadLocal = !!localStorage.getItem(STORE_KEY);
      state = load();
      if (!hadLocal) {
        try {
          const res = await fetch("/api/plan/draft");
          const j = await res.json();
          if (res.ok && j.found && j.state && j.state.dashboard) {
            state = normalize(j.state);
            toast("浏览器无缓存 · 已从本地备份恢复上次名单", "ok");
          }
        } catch (e) { }
      }
      // 隔夜草稿留下的旧日期：开页即跳到今天（常驻名单保留），避免误存到昨天
      if (state.date < todayStr()) { state.date = todayStr(); persist(); }
      dateInput.value = state.date;
      renderNav();
      renderTab();
      checkVault();
    })();
  </script>
</body>
